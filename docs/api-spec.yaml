  /api/tier1:
    get:
      tags:
        - Extraction
      summary: Get Tier 1 state and spend
      description:
        'Whether Tier 1 (the decision model codebase_extract asks about the
        cards Tier 0 cannot decide) is on for the served project''s checkout, and
        why not: state, provider and model, where each credential comes from
        (never its value), this calendar month''s spend (UTC) against the monthly
        cap with the 80% warning state, spend by source, and the answer cache.
        The same body as the tier1_status MCP tool, without its probe: this
        endpoint never sends a request to a provider and never writes a file.
        Returns state "off" when the project has not opted in. Tier 1 is
        enabled and changed only with `dr analyzer tier1 ...`; nothing in this
        API changes it.'
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            description:
              "The analyzer Tier 1 is configured for (default: the active
              analyzer, else cbm)"
          required: false
          description:
            "The analyzer Tier 1 is configured for (default: the active
            analyzer, else cbm)"
          name: analyzer
          in: query
      responses:
        "200":
          description: Tier 1's state and spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tier1Status"
              examples:
                "off":
                  summary: Not opted in (no tier1.json)
                  value:
                    state: "off"
                    reason:
                      "no .dr/analyzers/cbm/tier1.json: Tier 1 is opt-in. Enable it with `dr
