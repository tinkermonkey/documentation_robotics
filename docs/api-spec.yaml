  /api/changesets:
    get:
      tags:
        - Changesets
      summary: Get changesets
      description:
        "Retrieve a list of all changesets. Each carries its base drift
        (drift), checked on this read with no commit attempt: whether the base
        model changed under it and overlaps what it stages. GET
        /api/changesets/:id adds what changed."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Changesets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  changesets:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        status:
                          type: string
                          enum:
                            - staged
                            - committed
                            - discarded
                        created:
                          type: string
                        changes_count:
                          type: number
                        origin:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                                - chat
                                - plan
                                - extract
                                - cli
                                - upgrade
                              description:
                                "Who created the changeset: DrBot in `dr visualize` (chat), the
                                changeset_create MCP tool (plan),
                                codebase_extract (extract), `dr changeset
                                create` (cli), or a spec migration run by `dr
                                upgrade` or project_upgrade (upgrade)"
                            detail:
                              type: string
                          required:
                            - kind
                          description:
                            Where the changeset came from; absent on changesets made before it
                            was recorded
                        purpose:
                          type: string
                          enum:
                            - plan
                            - bootstrap
                            - reconcile
                            - verification
                            - chat
                            - upgrade-record
                          description:
                            "What the changeset is for, declared when it was made (inferred for
                            one made before that): plan (changeset_create; lands
                            with the code), chat (DrBot; lands after review),
                            bootstrap (codebase_extract of the whole code; lands
                            and reconciles code drift), reconcile
                            (codebase_extract with since and no plan active;
                            lands and reconciles code drift), verification
                            (codebase_extract with since while a plan was
                            active: the record of what was built, compared with
                            the plan; never lands, it is kept as a record or
                            discarded), upgrade-record (`dr upgrade` or
                            project_upgrade: the relationships a spec migration
                            dropped because the catalog has no replacement for
                            their types, each a staged relationship delete;
                            never lands, it is reviewed, restored from by hand
                            and discarded)"
                        verifies:
                          type: string
                          description:
                            "For a verification record: the id of the plan changeset it
                            verifies"
                        actions:
                          type: array
                          items:
                            type: string
                            enum:
                              - commit
                              - discard
                          description:
                            "The moves its purpose and status allow now: commit and discard
                            while staged, discard only for a verification record
                            or an upgrade record, none once committed or
                            discarded"
                        drift:
                          $ref: "#/components/schemas/ChangesetDriftSummary"
                        revision:
                          type: integer
                          description: The changeset's nextSequenceNumber
                        review:
                          type: object
                          properties:
                            decided:
                              type: integer
                              description:
                                Decisions whose change is still staged and was not rewritten after
                                the decision (any verdict, ask included)
                            total:
                              type: integer
                              description: Staged changes
                            asked:
                              type: integer
                              description: Of the decided, those with verdict ask
                          required:
                            - decided
                            - total
                            - asked
                      required:
                        - name
                        - status
                        - created
                        - changes_count
                        - purpose
                        - actions
                        - drift
                required:
                  - version
                  - changesets
  /api/changesets/:changesetId:
    get:
      tags:
        - Changesets
      summary: Get changeset
      description:
        "Retrieve a specific changeset with all its changes, and its base
        drift (drift), checked on this read with no commit attempt: whether the
        base model changed under it and, when it did, the staged changes the
        base now overlaps (always all of them, each with what landing does about
        it) and what was added, removed or changed in the base. Those five lists
        are a page: driftLimit entries of each from driftOffset, with
        drift.baseChanges.page giving each list's true total and the nextOffset
        that continues them."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
        - schema:
            type: integer
            minimum: 1
            description:
              How many entries of each drift.baseChanges list to return (default
              50; no upper bound)
          required: false
          description:
            How many entries of each drift.baseChanges list to return (default
            50; no upper bound)
          name: driftLimit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            description:
              Where in each drift.baseChanges list to start (default 0); pass
              drift.baseChanges.page.nextOffset to go on
          required: false
          description:
            Where in each drift.baseChanges list to start (default 0); pass
            drift.baseChanges.page.nextOffset to go on
          name: driftOffset
          in: query
      responses:
        "200":
          description: Changeset retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  created:
                    type: string
                  modified:
                    type: string
                  baseSnapshot:
                    type: string
                  stats:
                    type: object
                    properties:
                      additions:
                        type: number
                      modifications:
                        type: number
                      deletions:
                        type: number
                    required:
                      - additions
                      - modifications
                      - deletions
                  revision:
                    type: integer
                    description:
                      "The changeset's nextSequenceNumber: one past the highest sequence
                      number used"
                  origin:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - chat
                          - plan
                          - extract
                          - cli
                          - upgrade
                        description:
                          "Who created the changeset: DrBot in `dr visualize` (chat), the
                          changeset_create MCP tool (plan), codebase_extract
                          (extract), `dr changeset create` (cli), or a spec
                          migration run by `dr upgrade` or project_upgrade
                          (upgrade)"
                      detail:
                        type: string
                    required:
                      - kind
                    description:
                      Where the changeset came from; absent on changesets made before it
                      was recorded
                  purpose:
                    type: string
                    enum:
                      - plan
                      - bootstrap
                      - reconcile
                      - verification
                      - chat
                      - upgrade-record
                    description:
                      "What the changeset is for, declared when it was made (inferred for
                      one made before that): plan (changeset_create; lands with
                      the code), chat (DrBot; lands after review), bootstrap
                      (codebase_extract of the whole code; lands and reconciles
                      code drift), reconcile (codebase_extract with since and no
                      plan active; lands and reconciles code drift),
                      verification (codebase_extract with since while a plan was
                      active: the record of what was built, compared with the
                      plan; never lands, it is kept as a record or discarded),
                      upgrade-record (`dr upgrade` or project_upgrade: the
                      relationships a spec migration dropped because the catalog
                      has no replacement for their types, each a staged
                      relationship delete; never lands, it is reviewed, restored
                      from by hand and discarded)"
                  verifies:
                    type: string
                    description:
                      "For a verification record: the id of the plan changeset it
                      verifies"
                  scope:
                    type: object
                    properties:
                      since:
                        type: string
                        description: The git ref extraction read the changes since
                      codeCommit:
                        type: string
                        description: The commit extraction read the code at
                    required:
                      - since
                    description: "For a verification record: what its extraction read"
                  actions:
                    type: array
                    items:
                      type: string
                      enum:
                        - commit
                        - discard
                    description:
                      "The moves its purpose and status allow now: commit and discard
                      while staged, discard only for a verification record or an
                      upgrade record, none once committed or discarded"
                  drift:
                    $ref: "#/components/schemas/ChangesetDrift"
                  unstaged:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence:
                          type: integer
                          description: The sequence number the change had
                        removedAt:
                          type: integer
                          description: The revision the unstage or rewrite took
                        rewritten:
                          type: boolean
                          enum:
                            - true
                          description:
                            The change was rewritten in place (still staged under the same
                            sequence number); the tombstone holds its earlier
                            version
                        change:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - add
                                - update
                                - delete
                                - relationship-add
                                - relationship-delete
                            elementId:
                              type: string
                            layerName:
                              type: string
                            timestamp:
                              type: string
                            before: {}
                            after: {}
                            origin:
                              $ref: "#/components/schemas/ChangeOrigin"
                          required:
                            - type
                            - elementId
                            - layerName
                      required:
                        - sequence
                        - removedAt
                        - change
                    description: Unstaged and rewritten changes (tombstones), oldest first
                  review:
                    type: object
                    properties:
                      decisions:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            verdict:
                              type: string
                              enum:
                                - keep
                                - drop
                                - ask
                            note:
                              type: string
                            atRevision:
                              type: integer
                              description:
                                The changeset revision (nextSequenceNumber) when the decision was
                                made
                            decidedAt:
                              type: string
                              description: ISO timestamp of the decision
                          required:
                            - verdict
                            - atRevision
                            - decidedAt
                        description: Decisions keyed by the change's sequenceNumber, as a string
                      lastReviewedRevision:
                        type: integer
                        description:
                          The highest atRevision among the decisions; absent when there are
                          none
                    required:
                      - decisions
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - add
                            - update
                            - delete
                            - relationship-add
                            - relationship-delete
                        elementId:
                          type: string
                          description: "For relationship changes: source::predicate::target"
                        layerName:
                          type: string
                        sequenceNumber:
                          type: integer
                          description: Stable identity of the change; never renumbered
                        timestamp:
                          type: string
                        before:
                          description: Previous element state (for update/delete operations)
                        after:
                          description: New element state (for add/update operations)
                        origin:
                          $ref: "#/components/schemas/ChangeOrigin"
                        blockers:
                          type: array
                          items:
                            type: object
                            properties:
                              relationshipId:
                                type: string
                                description: source::predicate::target (dotted ids)
                              direction:
                                type: string
                                enum:
                                  - in
                                  - out
                                description: "out: the deleted element is the source; in: it is the target"
                              otherElementId:
                                type: string
                                description: The element at the other end (dotted id)
                              predicate:
                                type: string
                            required:
                              - relationshipId
                              - direction
                              - otherElementId
                              - predicate
                          description:
                            "Delete changes of a staged changeset only: relationships in the
                            projected model that still reference the deleted
                            element and that the changeset does not delete"
                      required:
                        - type
                        - elementId
                        - layerName
                required:
                  - id
                  - name
                  - status
                  - created
                  - modified
                  - stats
                  - revision
                  - purpose
                  - actions
                  - drift
                  - unstaged
                  - review
                  - changes
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
  /api/changesets/:changesetId/review:
    put:
      tags:
        - Changesets
      summary: Record review decisions
      description: Set or clear the reviewer's verdict on changes of a staged
        changeset, by sequence number. A null verdict clears the decision. The
        server stamps atRevision (the changeset's current revision) and
        decidedAt. Stored in review.yaml in the changeset's directory, under its
        file lock. Broadcasts changesets.updated.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    properties:
                      sequence:
                        type: integer
                        minimum: 0
                      verdict:
                        type:
                          - string
                          - "null"
                        enum:
                          - keep
                          - drop
                          - ask
                          - null
                        description: null clears the decision
                      note:
                        type: string
                    required:
                      - sequence
                      - verdict
              required:
                - decisions
      responses:
        "200":
          description: The changeset's review after the update
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        verdict:
                          type: string
                          enum:
                            - keep
                            - drop
                            - ask
                        note:
                          type: string
                        atRevision:
                          type: integer
                          description:
                            The changeset revision (nextSequenceNumber) when the decision was
                            made
                        decidedAt:
                          type: string
                          description: ISO timestamp of the decision
                      required:
                        - verdict
                        - atRevision
                        - decidedAt
                    description: Decisions keyed by the change's sequenceNumber, as a string
                  lastReviewedRevision:
                    type: integer
                    description:
                      The highest atRevision among the decisions; absent when there are
                      none
                required:
                  - decisions
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "409":
          description: Changeset is not staged
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "422":
          description: A sequence number names no staged change (or, to clear, no decision)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
  /api/changesets/:changesetId/commit:
    post:
      tags:
        - Changesets
      summary: Commit changeset
      description: "Apply a staged changeset to the model (same as `dr changeset
        commit`): validates it, applies every change atomically, marks it
        committed, and deactivates it if it was active. Drift does not refuse
        it: when the base overlaps what the changeset stages (its drift.state is
        drifted), it lands all the same, and the result's drift lists each
        overlap with what landing did about it. Show GET /api/changesets/:id's
        drift.overlapping, with each consequence, before calling this. Refused
        (409) for a verification record or an upgrade record (whose actions do
        not include commit): it is never landed."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                drop:
                  type: array
                  items:
                    type: integer
                  description:
                    Sequence numbers to leave out. Changes that depend on an element a
                    dropped add creates (relationship-adds with it at either
                    end, updates of it) are left out too. All are unstaged
                    (tombstoned) before the commit.
                deleteBlockedLinks:
                  type: array
                  items:
                    type: integer
                  description:
                    Sequence numbers of delete changes whose blockers may be deleted
                    with the element. With either field present, any other
                    delete with blockers is refused (422).
      responses:
        "200":
          description: Action completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  committed:
                    type: number
                    description: Changes applied to the model (commit only)
                  skipped:
                    type: number
                    description: Changes skipped as already present (commit only)
                  failed:
                    type: number
                    description: Changes that failed to apply (commit only)
                  preExistingErrors:
                    type: number
                    description: Validation errors the base model already had (commit only)
                  deactivated:
                    type: boolean
                    description: The changeset was active and was deactivated (commit only)
                  deactivationError:
                    type: string
                  drift:
                    type: object
                    properties:
                      message:
                        type: string
                        description: What happened, in a sentence
                      overlapping:
                        type: object
                        properties:
                          elements:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: The element (dotted id)
                                reason:
                                  type: string
                                  enum:
                                    - already-in-base
                                    - already-removed
                                    - changed-in-base
                                    - removed-in-base
                                    - linked-in-base
                                  description:
                                    "already-in-base: a staged add of an element the base now has;
                                    already-removed: a staged delete of one the
                                    base no longer has; changed-in-base: any
                                    staged change (an update, a delete, a delete
                                    then an add) of one whose base content is
                                    not what that change was staged on (an
                                    update restaged on the current base is not
                                    one); removed-in-base: a staged update or
                                    recreate of one the base removed;
                                    linked-in-base: a staged delete of one the
                                    base has since linked, whose new
                                    relationship the delete would remove"
                                consequence:
                                  type: string
                                  description:
                                    What landing does about this overlap, as a sentence to show the
                                    person before they commit
                                resolve:
                                  type: string
                                  description:
                                    How the plan resolves the overlap (unstage, restage, stage a
                                    delete), for the agent revising it
                              required:
                                - id
                                - reason
                                - consequence
                                - resolve
                          relationships:
                            type: array
                            items:
                              type: object
                              properties:
                                source:
                                  type: string
                                  description: Source element (dotted id)
                                predicate:
                                  type: string
                                target:
                                  type: string
                                  description: Target element (dotted id)
                                reason:
                                  type: string
                                  enum:
                                    - already-in-base
                                    - already-removed
                                    - endpoint-removed-in-base
                                  description:
                                    "already-in-base and already-removed as for elements;
                                    endpoint-removed-in-base: a staged
                                    relationship change with an end on a base
                                    element that was removed. An edit to an
                                    element at an end is not an overlap
                                    (endpoint-changed-in-base is no longer
                                    reported)"
                                endpoints:
                                  type: array
                                  items:
                                    type: string
                                  description: "For endpoint-removed-in-base: the ends the base removed"
                                consequence:
                                  type: string
                                  description:
                                    What landing does about this overlap, as a sentence to show the
                                    person before they commit
                                resolve:
                                  type: string
                                  description:
                                    How the plan resolves the overlap (unstage, restage, stage a
                                    delete), for the agent revising it
                              required:
                                - source
                                - predicate
                                - target
                                - reason
                                - consequence
                                - resolve
                        required:
                          - elements
                          - relationships
                        description:
                          Absent when the changeset has no base index, so the overlaps could
                          not be listed
                    required:
                      - message
                    description:
                      "Commit only, when the base had drifted under the changeset: it
                      landed all the same, and this says what the base
                      overlapped"
                  dropped:
                    type: array
                    items:
                      type: integer
                    description:
                      "Commit with a body only: every sequence number left out, cascaded
                      ones included"
                  linksDeleted:
                    type: integer
                    description:
                      "Commit with a body only: relationships deleted with the deletes
                      named in deleteBlockedLinks"
                required:
                  - id
                  - name
                  - status
        "400":
          description:
            The body is not JSON, or does not match the schema (an empty body
            is the plain commit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "409":
          description:
            "Changeset is not staged, or (commit) it is a verification record
            or an upgrade record, which is never landed. Never for drift: a
            drifted changeset lands"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "422":
          description:
            The changeset failed validation; nothing was applied. Or (body
            given) a sequence number names no staged change, a delete has
            blockers and is not in deleteBlockedLinks (blockers lists them), or
            a staged relationship-add names an element the changeset deletes
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  blockers:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          relationshipId:
                            type: string
                            description: source::predicate::target (dotted ids)
                          direction:
                            type: string
                            enum:
                              - in
                              - out
                            description: "out: the deleted element is the source; in: it is the target"
                          otherElementId:
                            type: string
                            description: The element at the other end (dotted id)
                          predicate:
                            type: string
                        required:
                          - relationshipId
                          - direction
                          - otherElementId
                          - predicate
                    description:
                      "When deletes have blockers and are not in deleteBlockedLinks:
                      their blockers, keyed by sequence number"
                required:
                  - error
