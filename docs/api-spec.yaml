                  linksDeleted:
                    type: integer
                    description:
                      "Commit with a body only: relationships deleted with the deletes
                      named in deleteBlockedLinks"
                required:
                  - id
                  - name
                  - status
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "409":
          description: Changeset is not staged, or the model drifted since it was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "422":
          description: The changeset failed validation; nothing was applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
