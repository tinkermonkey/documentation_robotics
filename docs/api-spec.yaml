openapi: 3.0.3
info:
  title: Documentation Robotics Visualization Server API
  version: 0.1.0
  description: API specification for the DR CLI visualization server
  contact:
    name: Documentation Robotics
    url: https://github.com/tinkermonkey/documentation_robotics
  license:
    name: ISC
servers:
  - url: http://localhost:8080
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description:
        "API token (shown at server startup, pass as Authorization: Bearer
        <token>)"
  schemas:
    ChangesetDriftSummary:
      type: object
      properties:
        state:
          type: string
          enum:
            - none
            - content-free
            - drifted
            - not-applicable
            - unknown
          description:
            "Whether the base model changed under the changeset since it was
            created or re-baselined: none (the base is as it was), content-free
            (the base changed, as when another changeset lands, but it overlaps
            none of this one's staged changes), drifted (the base overlaps a
            staged change, listed in overlapping with what landing does about
            it, or the changeset has no base index to tell; a commit still lands
            it and reports the overlaps), not-applicable (a verification record
            or an upgrade record, which never lands, or a changeset that is no
            longer staged), unknown (no base snapshot was recorded, or the check
            failed). No state refuses a commit"
        blocksCommit:
          type: boolean
          description:
            "Deprecated: always false. Drift warns at a commit and never
            refuses it, so do not hold Apply on this; read state"
        message:
          type: string
          description:
            What the state means for this changeset, in a sentence or two.
            Names no CLI command
      required:
        - state
        - blocksCommit
        - message
      description:
        Base drift, checked on this read with no commit attempt, against
        the model as the server last loaded it (it reloads when a model file
        changes; a commit reads the model from disk). The changeset's own
        endpoint adds what changed
    ChangesetDrift:
      type: object
      properties:
        state:
          type: string
          enum:
            - none
            - content-free
            - drifted
            - not-applicable
            - unknown
          description:
            "Whether the base model changed under the changeset since it was
            created or re-baselined: none (the base is as it was), content-free
            (the base changed, as when another changeset lands, but it overlaps
            none of this one's staged changes), drifted (the base overlaps a
            staged change, listed in overlapping with what landing does about
            it, or the changeset has no base index to tell; a commit still lands
            it and reports the overlaps), not-applicable (a verification record
            or an upgrade record, which never lands, or a changeset that is no
            longer staged), unknown (no base snapshot was recorded, or the check
            failed). No state refuses a commit"
        blocksCommit:
          type: boolean
          description:
            "Deprecated: always false. Drift warns at a commit and never
            refuses it, so do not hold Apply on this; read state"
        message:
          type: string
          description:
            What the state means for this changeset, in a sentence or two.
            Names no CLI command
        warnings:
          type: array
          items:
            type: string
          description:
            "What could not be told: no base index recorded, an unreadable one,
            a failed comparison. Empty when everything could be. It never
            restates overlapping"
        baseIndex:
          type: string
          enum:
            - recorded
            - not-recorded
            - unreadable
          description:
            Whether the changeset recorded which elements and relationships the
            base had when it was created. Without one, baseChanges is absent
        rebaselined:
          type: object
          properties:
            at:
              type: string
              description: ISO timestamp of the last re-baseline
            from:
              type: string
              description: The base hash the changeset had before it
            to:
              type: string
              description: The base hash it was re-baselined to
            times:
              type: integer
              description: How many times it was re-baselined
          required:
            - at
            - from
            - times
          description:
            "Set when the changeset was re-baselined (changeset_update with
            rebaseline): baseChanges then counts from that base, not from its
            creation. A re-baseline clears no overlap: overlapping is read from
            the base as it is now"
        notChecked:
          type: object
          properties:
            elements:
              type: array
              items:
                type: string
              description:
                Elements staged changes record no element for, whose base edits
                could not be seen
            relationships:
              type: integer
              description:
                Staged relationship changes not checked against what the base
                removed, for want of a base index
            sentence:
              type: string
              description:
                "The same, for a person: show it beside overlapping, which is not
                the whole answer when this is present"
          required:
            - elements
            - relationships
            - sentence
          description: What could not be checked for overlaps; absent when everything was
        overlapping:
          type: object
          properties:
            elements:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The element (dotted id)
                  reason:
                    type: string
                    enum:
                      - already-in-base
                      - already-removed
                      - changed-in-base
                      - removed-in-base
                      - linked-in-base
                    description:
                      "already-in-base: a staged add of an element the base now has;
                      already-removed: a staged delete of one the base no longer
                      has; changed-in-base: any staged change (an update, a
                      delete, a delete then an add) of one whose base content is
                      not what that change was staged on (an update restaged on
                      the current base is not one); removed-in-base: a staged
                      update or recreate of one the base removed;
                      linked-in-base: a staged delete of one the base has since
                      linked, whose new relationship the delete would remove"
                  consequence:
                    type: string
                    description:
                      What landing does about this overlap, as a sentence to show the
                      person before they commit
                  resolve:
                    type: string
                    description:
                      How the plan resolves the overlap (unstage, restage, stage a
                      delete), for the agent revising it
                required:
                  - id
                  - reason
                  - consequence
                  - resolve
            relationships:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    description: Source element (dotted id)
                  predicate:
                    type: string
                  target:
                    type: string
                    description: Target element (dotted id)
                  reason:
                    type: string
                    enum:
                      - already-in-base
                      - already-removed
                      - endpoint-removed-in-base
                    description:
                      "already-in-base and already-removed as for elements;
                      endpoint-removed-in-base: a staged relationship change
                      with an end on a base element that was removed. An edit to
                      an element at an end is not an overlap
                      (endpoint-changed-in-base is no longer reported)"
                  endpoints:
                    type: array
                    items:
                      type: string
                    description: "For endpoint-removed-in-base: the ends the base removed"
                  consequence:
                    type: string
                    description:
                      What landing does about this overlap, as a sentence to show the
                      person before they commit
                  resolve:
                    type: string
                    description:
                      How the plan resolves the overlap (unstage, restage, stage a
                      delete), for the agent revising it
                required:
                  - source
                  - predicate
                  - target
                  - reason
                  - consequence
                  - resolve
          required:
            - elements
            - relationships
          description:
            "The staged changes the base now overlaps, each with what landing
            does about it. Show them before Apply: a commit lands over them. A
            base change not listed here overlaps nothing the changeset stages"
        baseChanges:
          type: object
          properties:
            counts:
              type: object
              properties:
                elementsAdded:
                  type: integer
                elementsRemoved:
                  type: integer
                elementsChanged:
                  type: integer
                relationshipsAdded:
                  type: integer
                relationshipsRemoved:
                  type: integer
              required:
                - elementsAdded
                - elementsRemoved
                - elementsChanged
                - relationshipsAdded
                - relationshipsRemoved
              description: Exact, whatever the page of the lists
            elementsAdded:
              type: array
              items:
                type: string
            elementsRemoved:
              type: array
              items:
                type: string
            elementsChanged:
              type: array
              items:
                type: string
            relationshipsAdded:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    description: Source element (dotted id)
                  predicate:
                    type: string
                  target:
                    type: string
                    description: Target element (dotted id)
                required:
                  - source
                  - predicate
                  - target
            relationshipsRemoved:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    description: Source element (dotted id)
                  predicate:
                    type: string
                  target:
                    type: string
                    description: Target element (dotted id)
                required:
                  - source
                  - predicate
                  - target
            layers:
              type: array
              items:
                type: string
              description:
                "The layers the base changed in: those of every element added,
                removed or changed and of both ends of every relationship added
                or removed. Never cut"
            truncated:
              type: boolean
              description:
                True when a list here is not the whole of it; page says what there
                is and where to go on
            page:
              type: object
              properties:
                offset:
                  type: integer
                  description: Where in each list this page starts
                limit:
                  type: integer
                  description:
                    How many entries of each list this page holds at most (driftLimit;
                    default 50)
                totals:
                  type: object
                  properties:
                    elementsAdded:
                      type: integer
                    elementsRemoved:
                      type: integer
                    elementsChanged:
                      type: integer
                    relationshipsAdded:
                      type: integer
                    relationshipsRemoved:
                      type: integer
                  required:
                    - elementsAdded
                    - elementsRemoved
                    - elementsChanged
                    - relationshipsAdded
                    - relationshipsRemoved
                  description: Each list's true length
                returned:
                  type: object
                  properties:
                    elementsAdded:
                      type: integer
                    elementsRemoved:
                      type: integer
                    elementsChanged:
                      type: integer
                    relationshipsAdded:
                      type: integer
                    relationshipsRemoved:
                      type: integer
                  required:
                    - elementsAdded
                    - elementsRemoved
                    - elementsChanged
                    - relationshipsAdded
                    - relationshipsRemoved
                  description: How many entries of each list this page carries
                nextOffset:
                  type: integer
                  description:
                    The driftOffset that continues the lists; absent when every list
                    has been read to its end
                more:
                  type: string
                  description: "With nextOffset: the call that reads the next entries, in words"
              required:
                - offset
                - limit
                - totals
                - returned
              description:
                What this page of the five lists holds. Read on with driftLimit and
                driftOffset on GET /api/changesets/:id
          required:
            - counts
            - elementsAdded
            - elementsRemoved
            - elementsChanged
            - relationshipsAdded
            - relationshipsRemoved
            - layers
            - truncated
            - page
          description:
            What changed in the base since the changeset was created or last
            re-baselined (dotted ids); needs a base index
      required:
        - state
        - blocksCommit
        - message
      description:
        Base drift, checked on this read with no commit attempt, against
        the model as the server last loaded it (it reloads when a model file
        changes; a commit reads the model from disk). warnings, baseIndex,
        rebaselined, overlapping and baseChanges are present only in states
        content-free and drifted
    ChangeOrigin:
      type: object
      properties:
        by:
          type: string
          enum:
            - tier0
            - tier1
            - agent
            - upgrade
          description:
            "tier0: a Tier-0 rule or the node or edge mapping; tier1: a
            decision model (Tier 1); agent: the calling agent; upgrade: a spec
            migration, which dropped the relationship (the relationship deletes
            of an upgrade record)"
        rule:
          type: string
          description:
            "Tier 0: the rule (e.g. node-mapping:Route, or edge:CALLS for a
            relationship between elements the run did not add); Tier 1:
            tier1:<question set> (e.g. tier1:dr-qset-2); upgrade: the retired
            relationship type and the change record that retired it"
        provider:
          type: string
          description: "Tier 1: the provider (e.g. cloudflare-workers-ai)"
        model:
          type: string
          description: "Tier 1: the model, as the provider's response named it when it did"
        upstream:
          type: string
          description: "Tier 1 through OpenRouter: the upstream that served the request"
        p:
          type: object
          properties:
            layer:
              type: number
              description: Probability of the chosen layer
            type:
              type:
                - number
                - "null"
              description:
                Probability of the chosen element type; null when the type was not
                asked
          required:
            - layer
            - type
          description: "Tier 1: the probabilities of the chosen layer and type"
        confirmed:
          type: string
          enum:
            - auto
            - agent
          description:
            "Tier 1: auto (staged by stage mode) or agent (the agent accepted
            the band with acceptTier1)"
      required:
        - by
      description:
        Who decided this change (codebase_extract, and the relationship
        deletes of an upgrade record); absent on changes staged otherwise and in
        older changesets
    Tier1Status:
      type: object
      properties:
        state:
          type: string
          enum:
            - "off"
            - misconfigured
            - no-credentials
            - "on"
            - warming
            - capped
          description:
            "on: Tier 1 runs; warming: on, while the codebase_index job fills
            the answer cache (warming has its progress); capped: opted in and
            ready, but this month's spend reached the cap (cached answers are
            still used); off: no tier1.json (the default); misconfigured:
            tier1.json is unreadable, invalid, tracked by git, too open, or
            names an unknown provider or model; no-credentials: a key is
            missing"
        reason:
          type: string
          description:
            "Why Tier 1 is not on, for a person: set for every state but on
            (capped included: the cap, when it resets, how to raise it; warming:
            the fill's progress)"
        analyzer:
          type: string
          description: The analyzer Tier 1 is configured for (the active one, else cbm)
        config:
          type: string
          description: The opt-in file, relative to the project root
            (.dr/analyzers/<analyzer>/tier1.json)
        provider:
          type: string
          description: The provider tier1.json names (on, capped, no-credentials)
        model:
          type: string
          description: The model tier1.json names (on, capped, no-credentials)
        modelId:
          type: string
          description:
            The provider's model id, e.g. @cf/cloudflare/clef (on, warming and
            capped only)
        monthlyCapUsd:
          type: number
          description: The cap tier1.json sets, default filled in (on, capped,
            no-credentials); month.capUsd is always present
        concurrency:
          type: integer
          description: Requests in flight at once (on, capped, no-credentials)
        mode:
          type: string
          enum:
            - suggest
            - hide
            - stage
          description:
            "stage: codebase_extract stages the accept band (origin confirmed
            auto) and hides the not-element band without the agent, because both
            bands of the model's default thresholds are verified on held-out
            labels and tier1.json leaves mode at auto; hide: only the
            not-element band is verified, so it is hidden and the accept band
            stays a suggestion; suggest: nothing is staged or hidden without the
            agent. Set when tier1.json names a known model"
        modeReason:
          type: string
          description: 'Why mode: held-out verified defaults (both bands, or the
            not-element band alone), in-sample ones, overridden thresholds, or
            "mode": "suggest" in tier1.json'
        routing:
          type: object
          properties:
            only:
              type: array
              items:
                type: string
              description:
                The upstreams allowed to receive card text (OpenRouter provider
                slugs, e.g. cloudflare, deepinfra/fp8)
            allowFallbacks:
              type: boolean
              enum:
                - false
              description: "Always false: OpenRouter never falls back to another upstream"
            dataCollection:
              type: string
              enum:
                - deny
              description: "Always deny: only upstreams that do not collect the data"
            zdr:
              type: boolean
              enum:
                - true
              description: Zero-data-retention endpoints only, when configured
          required:
            - only
            - allowFallbacks
            - dataCollection
          description:
            "OpenRouter only: the routing every request carries (on, capped,
            no-credentials). OpenRouter's Decisions API is in alpha and may
            change"
        credentials:
          type: object
          additionalProperties:
            type: object
            properties:
              set:
                type: boolean
              from:
                type:
                  - string
                  - "null"
                description:
                  "Where the value comes from: tier1.json or an environment
                  variable's name; null when unset. Never the value"
            required:
              - set
              - from
          description:
            "Per credential the provider needs: whether it is set and where
            from (never the value); empty when off or misconfigured"
        month:
          type: object
          properties:
            spentUsd:
              type: number
              description: Spent this calendar month (UTC), from the ledger
            capUsd:
              type: number
              description:
                The monthly cap (monthlyCapUsd in tier1.json; $20 by default; 0
                sends nothing)
            remainingUsd:
              type: number
              description: What is left of the cap this month (never below 0)
            resetsAt:
              type: string
              description:
                "When the window resets: the first of next month, 00:00 UTC (ISO
                8601)"
            cards:
              type: integer
              description: Cards asked this month
            percentUsed:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 100
              description:
                spentUsd as a percentage of capUsd, 0 to 100 (held at 100 past the
                cap), to one decimal; null when the cap is 0
          required:
            - spentUsd
            - capUsd
            - remainingUsd
            - resetsAt
            - cards
            - percentUsed
        nearCap:
          type: boolean
          description:
            "True at 80% of the cap or more, before it is reached: the warning
            state (a cap of 0 never warns)"
        bySource:
          type: object
          additionalProperties:
            type: object
            properties:
              cards:
                type: integer
              costUsd:
                type: number
              lastAt:
                type: string
                description: The last time this source spent (ISO 8601)
            required:
              - cards
              - costUsd
              - lastAt
          description:
            This month's spend per source (extract, index, classify, probe); a
            source that spent nothing this month is absent
        cache:
          type: object
          properties:
            entries:
              type: integer
              description:
                Lines in the cache files, one per cached answer, before compaction
                drops any (read without parsing; `dr analyzer tier1 cache
                status` has the exact count)
            bytes:
              type: integer
            files:
              type: integer
            lastCompaction:
              type:
                - string
                - "null"
              description: When the cache was last compacted (ISO 8601), or null
          required:
            - entries
            - bytes
            - files
            - lastCompaction
          description: The Tier-1 answer cache
        dotDrIgnored:
          type:
            - boolean
            - "null"
          description:
            "Whether git ignores .dr/ (null when git cannot say: outside a git
            work tree, or git is unavailable)"
        warming:
          type: object
          properties:
            jobId:
              type: string
              description: The codebase_index job filling the cache
            startedAt:
              type: string
              description: When the fill started (ISO 8601)
            cards:
              type:
                - object
                - "null"
              properties:
                done:
                  type: integer
                  description: Cards answered from the cache, asked, or skipped so far
                total:
                  type: integer
                  description: Cards Tier 0 left undecided, which Tier 1 is asked about
              required:
                - done
                - total
              description: Null while the cards are still being built
            costUsd:
              type: number
              description: Spent by the fill so far (also in month and bySource.index)
            etaSeconds:
              type: integer
              description:
                About how many seconds the fill has left, from its rate so far or
                its estimate
          required:
            - jobId
            - startedAt
            - cards
            - costUsd
          description:
            "State warming only: how far the codebase_index job's cache fill
            has got"
        warnings:
          type: array
          items:
            type: string
        summary:
          type: string
          description:
            "One line for a person: the state, then this month's spend against
            the cap (and the 80% warning)"
        note:
          type: string
          description:
            How a person changes Tier 1 (dr analyzer tier1 ...; nothing over
            this API) and what the spend counts
      required:
        - state
        - analyzer
        - config
        - credentials
        - month
        - nearCap
        - bySource
        - cache
        - dotDrIgnored
        - warnings
        - summary
        - note
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the server is running and healthy
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Server health status
                  version:
                    type: string
                    description:
                      API version (the version of this HTTP API, not of the dr CLI or the
                      spec)
                  cliVersion:
                    type: string
                    description: Version of the dr CLI that is serving this API, e.g. "0.5.0"
                  pid:
                    type: integer
                    description: Process id of the server. Only with the auth token
                  launcherPid:
                    type: integer
                    description:
                      Process id of the `dr visualize` process that runs the server. Only
                      with the auth token
                  viewerId:
                    type: string
                    description:
                      Id of this viewer, as its record in the user's viewer registry has
                      it. Only with the auth token
                  clients:
                    type: integer
                    description:
                      Browser tabs connected now (WebSocket clients). Only with the auth
                      token
                required:
                  - status
                  - version
                  - cliVersion
  /api/model:
    get:
      tags:
        - Model
      summary: Get full model
      description: Retrieve the complete architecture model across all layers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Element ID (UUID)
                        spec_node_id:
                          type: string
                          description: Spec node type ID (e.g. motivation.goal)
                        type:
                          type: string
                          description: Element type (e.g. goal, endpoint)
                        layer_id:
                          type: string
                          description: Layer this element belongs to
                        name:
                          type: string
                          description: Element display name
                        description:
                          type: string
                          description: Element description
                        attributes:
                          type: object
                          additionalProperties: {}
                          description: Typed attribute bag per spec-node schema
                        source_reference:
                          type: object
                          properties:
                            provenance:
                              type: string
                              enum:
                                - extracted
                                - manual
                                - inferred
                                - generated
                            locations:
                              type: array
                              items:
                                type: object
                                properties:
                                  file:
                                    type: string
                                  symbol:
                                    type: string
                                required:
                                  - file
                            repository:
                              type: object
                              properties:
                                url:
                                  type: string
                                commit:
                                  type: string
                          required:
                            - provenance
                            - locations
                          description: Source code provenance linking this element to its implementation
                        metadata:
                          type: object
                          properties:
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            created_by:
                              type: string
                            version:
                              type: number
                          description: Element lifecycle metadata (timestamps, version)
                        properties:
                          type: object
                          additionalProperties: {}
                          description: Legacy property bag (deprecated — prefer attributes)
                      required:
                        - id
                        - spec_node_id
                        - type
                        - layer_id
                        - name
                    description: All architecture elements across all layers
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Stable link ID derived from source, target, and type
                        source:
                          type: string
                          description: Source element ID
                        target:
                          type: string
                          description: Target element ID
                        type:
                          type: string
                          description: Relationship predicate or reference type
                        layer_id:
                          type: string
                          description: Layer ID for intra-layer relationships
                        source_layer_id:
                          type: string
                          description: Source layer ID for cross-layer references
                        target_layer_id:
                          type: string
                          description: Target layer ID for cross-layer references
                      required:
                        - id
                        - source
                        - target
                        - type
                    description: Intra-layer relationships and cross-layer references
                required:
                  - nodes
                  - links
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
  /api/layers/:layerName:
    get:
      tags:
        - Model
      summary: Get layer
      description: Retrieve a specific layer with all its elements
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum:
              - motivation
              - business
              - product
              - security
