components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description:
        "API token (shown at server startup, pass as Authorization: Bearer
        <token>)"
  schemas:
    ChangeOrigin:
      type: object
      properties:
        by:
          type: string
          enum:
            - tier0
            - tier1
            - agent
          description:
            "tier0: a Tier-0 rule or the node or edge mapping; tier1: a
            decision model (Tier 1); agent: the calling agent"
        rule:
          type: string
          description:
            "Tier 0: the rule (e.g. node-mapping:Route, or edge:CALLS for a
            relationship between elements the run did not add); Tier 1:
            tier1:<question set> (e.g. tier1:dr-qset-2)"
        provider:
          type: string
          description: "Tier 1: the provider (e.g. cloudflare-workers-ai)"
        model:
          type: string
          description: "Tier 1: the model, as the provider's response named it when it did"
        upstream:
          type: string
          description: "Tier 1 through OpenRouter: the upstream that served the request"
        p:
          type: object
          properties:
            layer:
              type: number
              description: Probability of the chosen layer
            type:
              type:
                - number
                - "null"
              description:
                Probability of the chosen element type; null when the type was not
                asked
          required:
            - layer
            - type
          description: "Tier 1: the probabilities of the chosen layer and type"
        confirmed:
          type: string
          enum:
            - auto
            - agent
          description:
            "Tier 1: auto (staged by stage mode) or agent (the agent accepted
            the band with acceptTier1)"
      required:
        - by
      description:
        Who decided this change (codebase_extract only); absent on changes
        staged otherwise and in older changesets
    Tier1Status:
      type: object
      properties:
        state:
          type: string
          enum:
            - "off"
            - misconfigured
            - no-credentials
            - "on"
            - capped
          description:
            "on: Tier 1 runs; capped: opted in and ready, but this month's
            spend reached the cap (cached answers are still used); off: no
            tier1.json (the default); misconfigured: tier1.json is unreadable,
            invalid, tracked by git, too open, or names an unknown provider or
            model; no-credentials: a key is missing"
        reason:
          type: string
          description:
            "Why Tier 1 is not on, for a person: set for every state but on
            (capped included: the cap, when it resets, how to raise it)"
        analyzer:
          type: string
          description: The analyzer Tier 1 is configured for (the active one, else cbm)
        config:
          type: string
          description: The opt-in file, relative to the project root
            (.dr/analyzers/<analyzer>/tier1.json)
        provider:
          type: string
          description: The provider tier1.json names (on, capped, no-credentials)
        model:
          type: string
          description: The model tier1.json names (on, capped, no-credentials)
        modelId:
          type: string
          description:
            The provider's model id, e.g. @cf/cloudflare/clef (on and capped
            only)
        monthlyCapUsd:
          type: number
          description: The cap tier1.json sets, default filled in (on, capped,
            no-credentials); month.capUsd is always present
        concurrency:
          type: integer
          description: Requests in flight at once (on, capped, no-credentials)
        credentials:
          type: object
          additionalProperties:
            type: object
            properties:
              set:
                type: boolean
              from:
                type:
                  - string
                  - "null"
                description:
                  "Where the value comes from: tier1.json or an environment
                  variable's name; null when unset. Never the value"
            required:
              - set
              - from
          description:
            "Per credential the provider needs: whether it is set and where
            from (never the value); empty when off or misconfigured"
        month:
          type: object
          properties:
            spentUsd:
              type: number
              description: Spent this calendar month (UTC), from the ledger
            capUsd:
              type: number
              description:
                The monthly cap (monthlyCapUsd in tier1.json; $20 by default; 0
                sends nothing)
            remainingUsd:
              type: number
              description: What is left of the cap this month (never below 0)
            resetsAt:
              type: string
              description:
                "When the window resets: the first of next month, 00:00 UTC (ISO
                8601)"
            cards:
              type: integer
              description: Cards asked this month
            percentUsed:
              type:
                - number
                - "null"
              minimum: 0
              maximum: 100
              description:
                spentUsd as a percentage of capUsd, 0 to 100 (held at 100 past the
                cap), to one decimal; null when the cap is 0
          required:
            - spentUsd
            - capUsd
            - remainingUsd
            - resetsAt
            - cards
            - percentUsed
        nearCap:
          type: boolean
          description:
            "True at 80% of the cap or more, before it is reached: the warning
            state (a cap of 0 never warns)"
        bySource:
          type: object
          additionalProperties:
            type: object
            properties:
              cards:
                type: integer
              costUsd:
                type: number
              lastAt:
                type: string
                description: The last time this source spent (ISO 8601)
            required:
              - cards
              - costUsd
              - lastAt
          description:
            This month's spend per source (extract, index, classify, probe); a
            source that spent nothing this month is absent
        cache:
          type: object
          properties:
            entries:
              type: integer
              description:
                Lines in the cache files, one per cached answer, before compaction
                drops any (read without parsing; `dr analyzer tier1 cache
                status` has the exact count)
            bytes:
              type: integer
            files:
              type: integer
            lastCompaction:
              type:
                - string
                - "null"
              description: When the cache was last compacted (ISO 8601), or null
          required:
            - entries
            - bytes
            - files
            - lastCompaction
          description: The Tier-1 answer cache
        dotDrIgnored:
          type:
            - boolean
            - "null"
          description:
            "Whether git ignores .dr/ (null when git cannot say: outside a git
            work tree, or git is unavailable)"
        warnings:
          type: array
          items:
            type: string
        summary:
          type: string
          description:
            "One line for a person: the state, then this month's spend against
            the cap (and the 80% warning)"
        note:
          type: string
          description:
            How a person changes Tier 1 (dr analyzer tier1 ...; nothing over
            this API) and what the spend counts
      required:
        - state
        - analyzer
        - config
        - credentials
        - month
        - nearCap
        - bySource
        - cache
        - dotDrIgnored
        - warnings
        - summary
        - note
