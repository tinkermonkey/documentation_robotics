      responses:
        "200":
          description: Changeset retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  created:
                    type: string
                  modified:
                    type: string
                  baseSnapshot:
                    type: string
                  stats:
                    type: object
                    properties:
                      additions:
                        type: number
                      modifications:
                        type: number
                      deletions:
                        type: number
                    required:
                      - additions
                      - modifications
                      - deletions
                  revision:
                    type: integer
                    description:
                      "The changeset's nextSequenceNumber: one past the highest sequence
                      number used"
                  origin:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - chat
                          - plan
                          - extract
                          - cli
                        description:
                          "Who created the changeset: DrBot in `dr visualize` (chat), the
                          changeset_create MCP tool (plan), codebase_extract
                          (extract), or `dr changeset create` (cli)"
                      detail:
                        type: string
                    required:
                      - kind
                    description:
                      Where the changeset came from; absent on changesets made before it
                      was recorded
                  unstaged:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence:
                          type: integer
                          description: The sequence number the change had
                        removedAt:
                          type: integer
                          description: The revision the unstage or rewrite took
                        rewritten:
                          type: boolean
                          enum:
                            - true
                          description:
                            The change was rewritten in place (still staged under the same
                            sequence number); the tombstone holds its earlier
                            version
                        change:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - add
                                - update
                                - delete
                                - relationship-add
                                - relationship-delete
                            elementId:
                              type: string
                            layerName:
                              type: string
                            timestamp:
                              type: string
                            before: {}
                            after: {}
                            origin:
                              $ref: "#/components/schemas/ChangeOrigin"
                          required:
                            - type
                            - elementId
                            - layerName
                      required:
                        - sequence
                        - removedAt
                        - change
                    description: Unstaged and rewritten changes (tombstones), oldest first
                  review:
                    type: object
                    properties:
                      decisions:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            verdict:
                              type: string
                              enum:
                                - keep
                                - drop
                                - ask
                            note:
                              type: string
                            atRevision:
                              type: integer
                              description:
                                The changeset revision (nextSequenceNumber) when the decision was
                                made
                            decidedAt:
                              type: string
                              description: ISO timestamp of the decision
                          required:
                            - verdict
                            - atRevision
                            - decidedAt
                        description: Decisions keyed by the change's sequenceNumber, as a string
                      lastReviewedRevision:
                        type: integer
                        description:
                          The highest atRevision among the decisions; absent when there are
                          none
                    required:
                      - decisions
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - add
                            - update
                            - delete
                            - relationship-add
                            - relationship-delete
                        elementId:
                          type: string
                          description: "For relationship changes: source::predicate::target"
                        layerName:
                          type: string
                        sequenceNumber:
                          type: integer
                          description: Stable identity of the change; never renumbered
                        timestamp:
                          type: string
                        before:
                          description: Previous element state (for update/delete operations)
                        after:
                          description: New element state (for add/update operations)
                        origin:
                          $ref: "#/components/schemas/ChangeOrigin"
                        blockers:
                          type: array
                          items:
                            type: object
                            properties:
                              relationshipId:
                                type: string
                                description: source::predicate::target (dotted ids)
                              direction:
                                type: string
                                enum:
                                  - in
                                  - out
                                description: "out: the deleted element is the source; in: it is the target"
                              otherElementId:
                                type: string
                                description: The element at the other end (dotted id)
                              predicate:
                                type: string
                            required:
                              - relationshipId
                              - direction
                              - otherElementId
                              - predicate
                          description:
                            "Delete changes of a staged changeset only: relationships in the
                            projected model that still reference the deleted
                            element and that the changeset does not delete"
                      required:
                        - type
                        - elementId
                        - layerName
                required:
                  - id
                  - name
                  - status
                  - created
                  - modified
                  - stats
                  - revision
                  - unstaged
                  - review
                  - changes
        "404":
