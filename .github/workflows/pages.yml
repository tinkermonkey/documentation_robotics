name: Publish overview site

# Publishes site/ (the Documentation Robotics overview page) to GitHub Pages:
# https://tinkermonkey.github.io/documentation_robotics/
# The hero figure (site/hero/) is built here into site/assets/, which is not committed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/hero/package-lock.json
      - name: Build the hero figure
        working-directory: site/hero
        run: npm ci && npm run build
      - name: Stage the site
        run: |
          mkdir _site
          cp site/index.html _site/
          cp -r site/assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
