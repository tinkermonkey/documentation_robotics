application.applicationinterface.central-server-mcp-endpoint:
  id: 738b00dd-0323-4527-af71-98d97468cdab
  path: application.applicationinterface.central-server-mcp-endpoint
  spec_node_id: application.applicationinterface
  type: applicationinterface
