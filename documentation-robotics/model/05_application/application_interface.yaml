  name: Central server MCP endpoint
  description: "/mcp on the central process (127.0.0.1:<port>): MCP over streamable HTTP, one MCP server per session, each resolving its own checkout (pinned root, client roots, or the process's default checkout). Every DR MCP tool is reached here; dr mcp over stdio forwards to it. Requires the token."
