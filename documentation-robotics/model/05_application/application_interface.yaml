    updated_at: 2026-11-26T15:16:47.812Z
    version: 1
application.applicationinterface.central-server-viewer-pages:
  id: e43bb9e3-0d9e-4259-ac05-3e9faa46b8cd
  path: application.applicationinterface.central-server-viewer-pages
  spec_node_id: application.applicationinterface
  type: applicationinterface
  layer_id: application
  name: Central server viewer pages
  description: "The viewer on the central process (127.0.0.1:<port>): / and the deep links /p/<project>/c/<checkout>/... load the bundled viewer's index.html, and any other path not taken by /api/, /mcp, /ws, /health or the API docs is one of the viewer's files. The pages need no token: the viewer carries it in the URL fragment and sends it on its API and socket calls."
  attributes:
    interfaceType: user-interface
  source_reference:
