application.applicationservice.serve-command:
  id: e1fa4704-8156-4ecc-abe3-2b53f9187cd8
  path: application.applicationservice.serve-command
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: serveCommand
  description: "dr serve: runs the user's central DR process (detached, or attached with --foreground; dr mcp and dr visualize start it detached), and --status and --stop it. --state-dir <dir> runs an isolated process for a test suite: its record, token and log go in <dir>, it sweeps no viewers, and --port is the exact port. --token-file <path> gives the process the token the suite chose (every call still needs it). --no-sweep skips the start-up sweep. With --json, a foreground process prints one ready line (pid, port, url, farm) once it serves (#1376, #1369)."
  attributes:
    serviceType: synchronous
  source_reference:
    provenance: manual
    locations:
