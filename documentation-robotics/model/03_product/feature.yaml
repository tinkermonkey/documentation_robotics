  attributes:
    priority: medium
    status: delivered
    documentation:
      "CLI: dr analyzer classify --tier0-only (card builder + Tier-0
      rules); reports decided, narrowed and undecided symbols. Does not write a
      changeset. The card builder makes no card for a file, and the analyzer
      mapping has no entry for the code graph's Module node; the node is still
      read as data (a test file's calls, a declaration's file). Rules that
      matched on a file card (file-based routes, UI library folders) apply to
      declarations only. The classify-eval harness and Tier 1's held-out record
      leave file cards out of the scored set."
