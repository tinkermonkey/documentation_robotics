  layer_id: product
  name: Code-to-model verification
  description: "MCP: codebase_verify. CLI: dr analyzer verify (graph-discovered
    routes vs model endpoints). An element sourced at a whole file is checked by
    its file alone: it is not reported as drift because extraction no longer
    offers the file."
  attributes:
    priority: medium
    status: delivered
    documentation:
      "MCP: codebase_verify. CLI: dr analyzer verify (graph-discovered
      routes vs model endpoints). An element an existing model sourced at a
      whole file (no symbol, or the file's module name as its symbol) is checked
      by its file alone: it counts as present while the file exists, and is not
      reported as drift or as a candidate delete because extraction no longer
      offers the file."
