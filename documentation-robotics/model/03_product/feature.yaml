    gaps as accepted, not open; verification reports one the code contradicts."
  attributes:
    priority: medium
    status: delivered
    documentation:
      "MCP: gap_accept and gap_reopen (cli/src/mcp/tools/gap-tools.ts).
      An accepted gap records that a connection the catalog allows for an
      element's type is deliberately absent, with the reason; it lives on the
      element (accepted_gaps in the spec's base node schema, #1026). Both tools
      stage into the active changeset and refuse without one, so the human
      approves the gap when the changeset lands. gap_accept refuses a triple the
      catalog doesn't define, one it marks required, and one the element already
      has. changeset_brief lists accepted gaps as accepted, not open; extraction
      and verification report one the code contradicts."
