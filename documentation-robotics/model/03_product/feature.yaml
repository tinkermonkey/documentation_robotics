product.feature.changeset-overlay-in-the-viewer:
  id: f510b30d-52dc-4dad-87da-13c6568452fc
  path: product.feature.changeset-overlay-in-the-viewer
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Changeset overlay in the viewer
  description: "MCP: review_open returns a deep link to the changeset in the shared viewer (project and checkout in the URL); it starts nothing. Viewer: changeset overlay with Apply and Discard, offered only where the server's actions allow them, with base drift shown before review and before Apply. CLI: dr visualize."
  attributes:
    priority: high
    status: delivered
    documentation: "MCP: review_open (cli/src/mcp/tools/review-open.ts) reuses the dr visualize already serving the project or starts one, and returns a link that opens the changeset on the graph. CLI: dr visualize. The CLI bundles viewer 0.12.0, which follows what the changeset API reports: it treats a changeset by its purpose and offers only the server's actions (a verification record or an upgrade record shows as a record with Discard only), and it shows base drift before review and before Apply. GET /health carries cliVersion, the dr CLI serving the API, beside the API's own version; the viewer shows it in its status bar. The server watches .dr/active-changeset, so the viewer learns of an activation made elsewhere. Stopping dr visualize stops its server for certain: the launcher signals the server process and sends SIGKILL if it has not exited after 3 seconds (cli/src/utils/stop-child-process.ts), and the server leaves its file watcher to the process exit instead of closing it (#1235)."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/commands/visualize.ts
  metadata:
    created_at: 2026-11-09T21:54:57.607Z
    updated_at: 2026-11-09T21:54:57.607Z
    version: 1
