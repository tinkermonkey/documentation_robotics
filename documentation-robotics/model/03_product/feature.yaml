product.feature.viewer-lifecycle:
  id: 739052bf-20b9-4144-acba-85486be6c3e4
  path: product.feature.viewer-lifecycle
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Viewer lifecycle
  description: "CLI: dr visualize --list shows every running viewer (project, port, pid, CLI version, started at) and dr visualize --stop [project | --all] stops them, including viewers the registry lost. MCP: review_open replaces an older viewer it started and says when another viewer is older; restart: true replaces it. A viewer review_open starts exits after 24 hours with no browser tab and no request; any viewer exits when its project's documentation-robotics/ folder is gone."
  attributes:
    priority: high
    status: delivered
    documentation: "CLI: dr visualize --list and --stop [project | --all | --port n] (cli/src/commands/visualize-viewers.ts) list and stop every running viewer; the list joins the registry (cli/src/server/viewer-registry.ts, one record per viewer, swept on every read) with a scan of the process table (cli/src/server/viewer-processes.ts), so viewers the registry lost are found, and a pid is signalled only when it is known to be a viewer's (cli/src/server/viewer-control.ts). MCP: review_open compares the viewer's cliVersion with its own; an older viewer review_open started is replaced on the same port with the same token, any other older viewer is reused with outdated and a notice, and restart: true replaces it. A viewer review_open starts runs with --idle-exit 24 (DR_VIEWER_IDLE_HOURS; 0 means never): it exits after that long with no WebSocket client and no request other than /health (cli/src/server/viewer-lifetime.ts). Any viewer exits when its project's documentation-robotics/ folder is missing on two checks 30 seconds apart. The server exits when its launcher is gone, and dr visualize --exit-with-parent has the launcher do the same (cli/src/utils/parent-watch.ts)."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/commands/visualize-viewers.ts
  metadata:
    created_at: 2026-11-20T16:31:40.294Z
