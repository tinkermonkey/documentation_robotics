product.feature.change-planning-workflow:
  id: 5852ac40-5ff6-4b1e-abc6-5a9559f09792
  path: product.feature.change-planning-workflow
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Change planning workflow
  description: "Claude Code: /dr-plan command and dr_change_planning skill,
    shipped in the DR plugin; GitHub Copilot gets the skill from dr copilot
    install. Walks Frame to Land over the MCP tools."
  attributes:
    priority: high
    status: delivered
    documentation: "Claude Code: /dr-plan
      (integrations/claude_code/commands/dr-plan.md) and the dr_change_planning
      skill, shipped in the DR plugin for Claude Code; dr claude install still
      copies them into a project. GitHub Copilot: the same skill under
      integrations/github_copilot, installed by dr copilot install and brought
      up to date by dr upgrade. The loop is Frame, Orient, Draft, Pressure-test,
      Review, Build, Verify, Land, over the MCP tools. Build commits only the
      plan's own changeset directory with the code; which changeset is active is
      no longer a file under changesets/, so there is no marker to keep out of
      the commit (#1218). The as-built verification record is made in Verify,
      after the build commit. The human then chooses: discard it
      (changeset_discard), or keep it, in which case it stays staged and its
      directory is committed beside the plan's in the same PR. It is never
      landed (#1197)."
  source_reference:
    provenance: manual
    locations:
      - file: integrations/claude_code/skills/dr_change_planning/SKILL.md
  metadata:
    created_at: 2026-11-09T21:54:57.494Z
    updated_at: 2026-11-09T21:54:57.494Z
    version: 1
