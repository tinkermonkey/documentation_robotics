product.feature.commit-confirmation-token:
  id: 024c8984-3141-4664-848d-87f229d7a22a
  path: product.feature.commit-confirmation-token
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Commit confirmation token
  description: "MCP: changeset_commit_preview checks a changeset for landing without writing anything and returns the landing summary (intent, counts, layers, drift with the true count of overlaps and what landing does about each kind, validation) with a token bound to the changeset's confirmed state. Claude Code shows the summary, and the person approves the changeset_commit call carrying the token in Claude Code's permission prompt, which anthropic/requiresUserInteraction forces. changeset_commit accepts the token only from Claude Code (v2.1.199 or later) and refuses it once used, expired (one hour: long enough for an answer relayed through another session, too short for yesterday's preview to land today), or when the changeset or base model changed since the preview. An expired token is reported as expired, not as a decline. The token does not bind force, which is ignored. Other clients still confirm in the elicitation dialog."
  attributes:
    priority: high
    status: developing
    size: s
    documentation: "Token: an HMAC, keyed per server process, over the changeset id, force, a 10-minute expiry and the confirmedState fingerprint (staged changes and base model); good once. The preview tool is not flagged, so landing takes one approval. Permission modes (checked 2026-11-17 against the Claude Code docs): the prompt is forced in acceptEdits, auto and bypassPermissions (so --dangerously-skip-permissions too), allow rules and PreToolUse hooks don't skip it, and dontAsk, --permission-prompt-tool and runs without a prompt callback deny the call. The server can't see the mode and doesn't need to."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/mcp/tools/changeset-commit.ts
        symbol: changesetCommitPreviewHandler
  metadata:
    created_at: 2026-11-17T20:42:52.469Z
    updated_at: 2026-11-17T20:42:52.469Z
    version: 1
product.feature.base-drift-on-the-changeset-api:
  id: e4c2e358-5964-4c9a-8f61-e13c0a5d94f4
  path: product.feature.base-drift-on-the-changeset-api
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Base drift on the changeset API
  description: "Viewer API: GET /api/changesets and GET /api/changesets/:id carry a drift field, with no commit attempt. The list gives each changeset's drift state (none, content-free, drifted, not-applicable, unknown) and a sentence saying what it means; blocksCommit is kept and always false, since drift no longer refuses a commit. The detail adds what changed: the staged changes the base now overlaps, each with what landing does about it, the elements and relationships added, removed or changed in the base since the changeset was created or re-baselined, and the layers they are in. POST /api/changesets/:id/commit lands a drifted changeset and returns the overlaps it landed over. Read from the same code as changeset_brief's drift and the commit's drift check."
  attributes:
    priority: high
    status: developing
    size: s
    documentation: "Purpose-aware (changeset-purpose.ts): a verification record or an upgrade record reads not-applicable, since it never lands, and a verification record names its plan's state. A committed or discarded changeset reads not-applicable. Content-free drift (the base changed, nothing the changeset stages overlaps it) is its own state. State drifted means a landing warns, not that it is refused: blocksCommit is always false and stays only so a client built against the earlier API keeps reading it. Each overlap carries a consequence sentence. The commit route answers 409 only for a record or a changeset that is no longer staged. docs/api-spec.yaml is regenerated with it."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/core/changeset-drift-status.ts
        symbol: driftStatus
  metadata:
    created_at: 2026-11-18T19:52:37.509Z
    updated_at: 2026-11-18T19:52:37.509Z
    version: 1
