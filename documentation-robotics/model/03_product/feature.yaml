      an MCP elicitation dialog, or takes a confirmation token from Claude Code
      (see Commit confirmation token). It is refused when no person can answer,
      and a refusal says why: declined, the dialog could not be shown, or drift.
      Viewer: Apply. CLI: dr changeset commit. A landing clears the
