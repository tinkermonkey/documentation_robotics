product.feature.extraction-to-a-changeset:
  id: e760b2ad-b93a-4e62-8418-e6c23242d26a
  path: product.feature.extraction-to-a-changeset
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Extraction to a changeset
  description:
    "MCP: codebase_extract. Builds cards from the declarations the code
    index reports (classes, interfaces, functions, methods, routes, types),
    never from a file, stages what the Tier-0 rules decide into a changeset, and
    returns the narrowed and undecided symbols to the calling agent, which
    stages its own decisions. Import and test-file relationships are joined to
    declarations, not to a file's element. The calling agent is the cascade's
    last tier, and it also models what the code graph reports no declaration
    for; no separate model API key."
  attributes:
    priority: high
    status: planned
    documentation:
      "MCP: codebase_extract. Builds cards from the declarations the
      code index reports (classes, interfaces, functions, methods, routes,
      types), never from a file, stages what the Tier-0 rules decide into a
      changeset, and returns the narrowed and undecided symbols to the calling
      agent, which stages its own decisions. Import and test-file relationships
      are joined to declarations, not to a file's element; where a file has no
      single declaration to take them they are dropped. The calling agent is the
      cascade's last tier, and it also models what the code graph reports no
      declaration for (entry points, file-based routes, top-level constants,
      buildable projects); no separate model API key."
  metadata:
    created_at: 2026-11-09T22:04:38.299Z
    updated_at: 2026-11-09T22:04:38.299Z
    version: 1
product.feature.dr-plugin-for-claude-code:
  id: 6b58dba3-d603-462b-ba67-cacc48c60eb1
  path: product.feature.dr-plugin-for-claude-code
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: DR plugin for Claude Code
  description: A Claude Code plugin bundling the dr MCP server, the layer and
    planning skills and the agents, installed once at user scope. Replaces
    per-project dr claude install and .mcp.json edits. The dr binary still comes
    from npm. Its skills tell the agent what extraction by rule cannot see and
    where to look for it.
  attributes:
    priority: high
    status: planned
    documentation:
      "A Claude Code plugin bundling the dr MCP server, the layer and
      planning skills and the agents, installed once at user scope. Replaces
      per-project dr claude install and .mcp.json edits. The dr binary still
      comes from npm. Its skills tell the agent what extraction by rule cannot
      see and where to look for it: entry points made of top-level statements,
      file-based routes, top-level constants such as stores and schemas, and
      buildable projects. They never tell the agent to model a file as an
      element; an element names its file and, where there is one, its symbol."
  metadata:
