product.feature.rule-based-classification:
  id: 496156f0-db1c-4f87-864e-c93a28c317e4
  path: product.feature.rule-based-classification
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Rule-based classification
  description: "CLI: dr analyzer classify --tier0-only (card builder + Tier-0
    rules); reports decided, narrowed and undecided symbols. Does not write a
    changeset. The card builder makes no card for a file, and the analyzer
    mapping has no entry for the code graph's Module node."
  attributes:
    priority: medium
    status: delivered
    documentation:
      "CLI: dr analyzer classify --tier0-only (card builder + Tier-0
      rules); reports decided, narrowed and undecided symbols. Does not write a
      changeset. The card builder makes no card for a file, and the analyzer
      mapping has no entry for the code graph's Module node; the node is still
      read as data (a test file's calls, a declaration's file). Rules that
      matched on a file card (file-based routes, UI library folders) apply to
      declarations only. The classify-eval harness and Tier 1's held-out record
      leave file cards out of the scored set."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/analyzers/tier0-rules.ts
  metadata:
    created_at: 2026-11-09T21:54:58.035Z
    updated_at: 2026-11-09T21:54:58.035Z
    version: 1
