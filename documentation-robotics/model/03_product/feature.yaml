  path: product.feature.extraction-to-a-changeset
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Extraction to a changeset
  description:
    "MCP: codebase_extract. Builds cards from the declarations the code
    index reports (classes, interfaces, functions, methods, routes, types),
    never from a file, stages what the Tier-0 rules decide into a changeset, and
    returns the narrowed and undecided symbols to the calling agent, which
    stages its own decisions. Import and test-file relationships are joined to
    declarations, not to a file's element. The calling agent is the cascade's
    last tier, and it also models what the code graph reports no declaration
    for; no separate model API key."
  attributes:
    priority: high
    status: delivered
    documentation:
      "MCP: codebase_extract. Builds cards from the declarations the
      code index reports (classes, interfaces, functions, methods, routes,
      types), never from a file, stages what the Tier-0 rules decide into a
