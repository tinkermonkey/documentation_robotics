product.feature.commit-confirmation-token:
  id: 024c8984-3141-4664-848d-87f229d7a22a
  path: product.feature.commit-confirmation-token
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Commit confirmation token
  description: "MCP: changeset_commit_preview checks a changeset for landing
    without writing anything and returns the landing summary (intent, counts,
    layers, drift, validation) with a token bound to the changeset's confirmed
    state. Claude Code shows the summary, and the person approves the
    changeset_commit call carrying the token in Claude Code's permission prompt,
    which anthropic/requiresUserInteraction forces. changeset_commit accepts the
    token only from Claude Code (v2.1.199 or later) and refuses it once used,
    expired, or when the changeset, base model or force changed since the
    preview. Other clients still confirm in the elicitation dialog."
  attributes:
    priority: high
    status: developing
    size: s
    documentation:
      "Token: an HMAC, keyed per server process, over the changeset id,
      force, a 10-minute expiry and the confirmedState fingerprint (staged
      changes and base model); good once. The preview tool is not flagged, so
      landing takes one approval. Permission modes (checked 2026-11-17 against
      the Claude Code docs): the prompt is forced in acceptEdits, auto and
      bypassPermissions (so --dangerously-skip-permissions too), allow rules and
      PreToolUse hooks don't skip it, and dontAsk, --permission-prompt-tool and
      runs without a prompt callback deny the call. The server can't see the
      mode and doesn't need to."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/mcp/tools/changeset-commit.ts
        symbol: changesetCommitPreviewHandler
  metadata:
    created_at: 2026-11-17T20:42:52.469Z
    updated_at: 2026-11-17T20:42:52.469Z
    version: 1
product.feature.base-drift-on-the-changeset-api:
  id: e4c2e358-5964-4c9a-8f61-e13c0a5d94f4
  path: product.feature.base-drift-on-the-changeset-api
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Base drift on the changeset API
  description:
    "Viewer API: GET /api/changesets and GET /api/changesets/:id carry
    a drift field, with no commit attempt. The list gives each changeset's drift
    state (none, content-free, drifted, not-applicable, unknown), whether it
    blocks a commit, and a sentence saying why. The detail adds what changed:
    the staged changes the base now overlaps, the elements and relationships
    added, removed or changed in the base since the changeset was created, and
    the layers they are in. Read from the same code as changeset_brief's drift
    and the commit's drift check."
  attributes:
    priority: high
    status: developing
    size: s
    documentation:
      "Purpose-aware (changeset-purpose.ts): blocksCommit is true only
      for a staged changeset whose actions include commit and whose base drifted
      in content. A verification record reads not-applicable, since it never
      lands, and names its plan's state. A committed or discarded changeset
      reads not-applicable. Content-free drift (the model hash changed, nothing
      the changeset was staged against did) is its own state and never blocks.
      Cost, measured on a synthetic model with 9 staged changesets: the list's
      check is about 2 ms per changeset at 200 elements and 8 ms at 2,000; the
      detail's description adds about 4 ms at 2,000. The list therefore carries
      the summary and only the detail carries the id lists. Additive: no
      existing field changes. docs/api-spec.yaml is regenerated with it."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/core/changeset-drift-status.ts
        symbol: driftStatus
  metadata:
    created_at: 2026-11-18T19:52:37.509Z
    updated_at: 2026-11-18T19:52:37.509Z
    version: 1
