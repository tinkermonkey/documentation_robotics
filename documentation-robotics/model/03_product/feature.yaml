product.feature.extraction-triage-by-rule:
  id: 2c5c136e-48cf-4365-b756-9b1089dd00a1
  path: product.feature.extraction-triage-by-rule
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Extraction triage by rule
  description: "MCP: codebase_extract. A run returns its undecided cards as groups with a decision count; decide takes decisions in bulk by a stated rule (previewed with a sample), stages or rejects what it covers, and keep: true records the rule in documentation-robotics/extraction-rules.yaml for every later run and checkout."
  attributes:
    priority: high
    status: delivered
    documentation: "MCP: codebase_extract. Each card carries facts read from the code: visibility, whether it is nested in another function, and the element its class or file already has. A run with more cards than a page answers with groups (folder and file, kind and visibility, folders no element names, functions many services share) and the number of decisions needed; view filters and pages the cards. decide: [{where | card, as: layer.type | none, reason, keep}] decides cards by rule; with preview: true it returns each rule's count and a sample and changes nothing. Kept rules are applied before cards are made, in this order: an element that names the symbol, a decision on that one card, a rule that says none, Tier 0, a rule that names a type. A since run lists the symbols its range changed and counts the rest; with a plan active it lists planned elements with no as-built candidate. reject and decide take their items from a JSON file (file) and answer with counts and the items that need attention."
  metadata:
    created_at: 2026-11-20T16:56:25.762Z
    updated_at: 2026-11-20T16:56:25.762Z
    version: 1
