product.feature.changeset-lifecycle:
  id: 0e9afa3e-65d4-4d6e-b661-9df09cd9a9c1
  path: product.feature.changeset-lifecycle
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Changeset lifecycle
  description: "MCP: changeset_create, changeset_activate, changeset_deactivate, changeset_update, changeset_list, changeset_show. CLI: dr changeset create/activate/deactivate/list/show/status. Which changeset is active is per-checkout state, kept in .dr/active-changeset, and it counts only while it names a staged changeset."
  attributes:
    priority: critical
    status: delivered
    documentation: "The active changeset is named by one file, .dr/active-changeset (the changeset's id), read and written by cli/src/core/active-changeset-marker.ts. It is per-checkout state, so it sits in .dr/ with the spec reference and the analyzer state, out of git (#1218). The older documentation-robotics/changesets/.active is still read when .dr/ has no marker, and the next activate or deactivate writes .dr/ and deletes it. The marker counts only while it names a staged changeset: one that names a changeset committed, discarded or deleted since is no active changeset on any surface (Model.load, the CLI, the MCP tools, the viewer), and writes then go to the base model. dr changeset status says when such a marker is being ignored; dr changeset deactivate and changeset_deactivate remove it (the tool reports clearedLeftoverMarker)."
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/mcp/tools/changeset-lifecycle.ts
  metadata:
    created_at: 2026-11-09T21:54:57.018Z
    updated_at: 2026-11-09T21:54:57.018Z
    version: 1
product.feature.stage-element-changes:
  id: ab6e7c50-5dec-4c85-9363-8c4588f30a26
  path: product.feature.stage-element-changes
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Stage element changes
  description: "MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. model_add and model_update take a list, inline or in a JSON file, and answer with counts and only the items that need attention. CLI: dr add/update/delete."
  attributes:
    priority: critical
    status: delivered
    documentation: 'MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. CLI: dr add/update/delete. With no changeset active the write goes to the base model. A base write from a model that was loaded while a changeset was active, when that changeset has since stopped being staged, fails with "The change was not saved" instead of reporting success and storing nothing (#1218, cli/src/core/mutation-handler.ts). Batches (CLI 0.7.0): model_add takes elements (with relationships) and model_update takes updates, inline or in a JSON file named by file (one object holding the tool''s lists under their own names; the file must be inside the project the call addresses, links resolved). A batch returns total, counts by status and attention: only the items not written as sent, or elements written with a warning or a note, up to limit in full (default 50, failures first) and every one past that by position under its reason with what its message named (attentionNotListed), so one response accounts for every item; verbose: true returns every item (#1182, #1217). A refused model_add batch lists what each refused type requires (#1153). sourceFile without sourceProvenance gets ''manual'' with no warning over MCP (#1233). Ids: dr add, model_add and extraction derive an id from a name with one function, deriveElementId in cli/src/utils/id-generator.ts (#1225): camelCase and a digit before a capitalised word are word breaks (#1184), dots, slashes and braces are word breaks, a leading digit gets the prefix n- (#1212), and a name over 100 characters is cut with a hash. An id is derived once and never rewritten: an add is refused, naming the element, when an element of the same name sits at an id an earlier release derived for that name (earlierElementIds) or at one that differs only by hyphens; a test sweeps this repository''s model for it.'
  source_reference:
    provenance: manual
    locations:
      - file: cli/src/mcp/tools/model-update.ts
  metadata:
    created_at: 2026-11-09T21:54:57.057Z
    updated_at: 2026-11-09T21:54:57.057Z
    version: 1
