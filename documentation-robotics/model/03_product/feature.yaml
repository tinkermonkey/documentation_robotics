  path: product.feature.changeset-verify
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Changeset verify
  description: "MCP: changeset_verify against an as-built changeset or the base, and changeset_adopt_source_references. CLI: dr changeset verify. What extraction can't see is unverifiable with its reason, never missing; a service or operation the build may register by a name string is named in the verdict, which is never a clean match while one is unconfirmed. Planned adds with no source reference come with candidate files, and adopt takes the references the agent confirmed. Every list is a page with its true total."
  attributes:
    priority: high
    status: delivered
    documentation: "MCP: changeset_verify (limit and offset page every list; page.totals gives true lengths) and changeset_adopt_source_references (references: {id, sourceFile, sourceSymbol} for elements with no as-built match, stored root-relative with provenance manual; result counts over everything, items past limit still accounted for). CLI: dr changeset verify. Unverifiable: intent, re-exports, planned JS/TS test cases, relationships no code edge maps to, and a planned service, interface, function, event, process or operation a code file names only as a call argument or name property (reason gives file and line; verdict at best probable-match)."
