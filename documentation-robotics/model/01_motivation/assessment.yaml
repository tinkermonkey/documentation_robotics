motivation.assessment.dr-cannot-tell-a-worktree-from-a-project:
  id: f5d624a2-c32a-4288-9048-34f314ef7393
  path: motivation.assessment.dr-cannot-tell-a-worktree-from-a-project
  spec_node_id: motivation.assessment
  type: assessment
  layer_id: motivation
  name: DR cannot tell a worktree from a project
  description: "Nothing in DR knows a worktree is a worktree: the farm, MCP root
    resolution, the viewer registry and .dr/ state each treat every checkout as
    a separate project (issue 1285)."
  attributes:
    assessmentType: gap
  metadata:
