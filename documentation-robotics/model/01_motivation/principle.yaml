    version: 1
motivation.principle.worktrees-are-a-structure-not-a-name:
  id: 1adcf157-331c-485b-81f6-4dd16f1b0cd8
  path: motivation.principle.worktrees-are-a-structure-not-a-name
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Worktrees are a structure not a name
  description: "A worktree is an organizational layer, never folded into a
    project's name: checkouts are a first-class structure below the project in
    DR's project data model (maintainer ruling 2, issue 1285)."
  attributes:
    category: architecture
  metadata:
    created_at: 2026-11-21T17:14:10.879Z
    updated_at: 2026-11-21T17:14:10.879Z
    version: 1
motivation.principle.authenticate-every-call-then-trust:
  id: 2e2e40ae-d843-42ce-ac2c-d6f57191504e
  path: motivation.principle.authenticate-every-call-then-trust
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Authenticate every call then trust
  description: One token covers every project. Every viewer API call and every
    MCP-over-HTTP call carries it; whatever it permits is allowed. No click
    proofs or cookies (maintainer ruling 3).
  attributes:
    category: security
  metadata:
    created_at: 2026-11-21T17:14:10.879Z
    updated_at: 2026-11-21T17:14:10.879Z
    version: 1
