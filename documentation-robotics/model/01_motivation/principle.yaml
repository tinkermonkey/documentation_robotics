motivation.principle.base-model-is-as-built:
  id: 17481ecd-a794-4337-96d7-5815ecae3e90
  path: motivation.principle.base-model-is-as-built
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Base model is as-built
  description:
    A change-modeling changeset stays staged while its code is written
    and is committed in the same pull request; main's model never claims what
    isn't built.
  attributes:
    category: architecture
    documentation: A change-modeling changeset stays staged while its code is
      written and is committed in the same pull request; main's model never
      claims what isn't built.
