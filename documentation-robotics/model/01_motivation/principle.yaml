motivation.principle.the-mcp-server-is-the-gateway-to-the-model:
  id: 817f81bc-559b-44d7-950b-a1280e4ddaea
  path: motivation.principle.the-mcp-server-is-the-gateway-to-the-model
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: The MCP server is the gateway to the model
  description: Everything a person does with a DR model, from creating it to
    landing a change, can be done by their agent through the dr MCP server. The
    CLI is for scripts, CI and people who prefer it.
  attributes:
    category: development
    documentation: A developer working with a coding agent shouldn't have to switch
      to a terminal to keep the model in step with their work. Each CLI workflow
      has an MCP route built on the same core operation, so the two never
      disagree.
  metadata:
    created_at: 2026-11-09T22:04:37.879Z
    updated_at: 2026-11-09T22:04:37.879Z
    version: 1
motivation.principle.a-file-is-a-source-link-not-an-element:
  id: 9b8e9eea-ba46-47da-9d4a-63769c8674c6
  path: motivation.principle.a-file-is-a-source-link-not-an-element
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: A file is a source link, not an element
  description: A source file is where an element was found and nothing more. Only
    what a file contains can be an element; the file itself never is, and the
    model records it only in an element's source reference.
  attributes:
    category: architecture
    documentation: "A source file is where an element was found and nothing more.
      Only what a file contains can be an element; the file itself never is, and
      the model records it only in an element's source reference. Maintainer
      ruling, 2026-11-18: a file does not map to the DR schema in any way, and a
      file with no modelled content is ignored until a case shows it would add
      value. A module in the architectural sense may be a file, part of a file
      or several files, so it is never read off a file's existence."
  metadata:
    created_at: 2026-11-18T18:04:53.544Z
    updated_at: 2026-11-18T18:04:53.544Z
    version: 1
motivation.principle.no-unseen-limits:
  id: df551c78-4eb1-4572-a227-7d50779ddd76
  path: motivation.principle.no-unseen-limits
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: No unseen limits
  description: "A tool's answer never portrays completeness it does not have. A
    count or size limit is a default and a target, not a hard cut-off: the
    caller can change it and can ask for everything; anything shortened is
    pageable or otherwise reachable and the answer says so, with the true total;
    counts, summaries and verdicts are computed over the whole set, never over
    the part returned. (The maintainer's rule, 2026-11-20.)"
  attributes:
    category: operational
  metadata:
    created_at: 2026-11-20T16:57:54.080Z
    updated_at: 2026-11-20T16:57:54.080Z
    version: 1
motivation.principle.one-project-list-for-every-interface:
  id: e8b53610-cbd0-4a2a-bae8-9e63cb4be812
  path: motivation.principle.one-project-list-for-every-interface
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: One project list for every interface
  description: User-level DR has one cohesive, deterministic list of projects. The
    MCP server, the viewer and the CLI read the same list through the same code;
    no interface has its own discovery or behaviour (maintainer ruling 1,
    2026-11-21).
  attributes:
    category: architecture
  metadata:
    created_at: 2026-11-21T17:14:10.878Z
    updated_at: 2026-11-21T17:14:10.878Z
    version: 1
