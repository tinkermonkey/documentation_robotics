motivation.requirement.developer-stays-in-the-conversation:
  id: 13aed281-5f0d-454b-8dbc-f6310dc41221
  path: motivation.requirement.developer-stays-in-the-conversation
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Developer stays in the conversation
  description:
    Every step of the DR use cases can be done by the developer's agent
    through dr mcp; the developer types no dr command. Verified by walking each
    use case in Claude Code with only the dr MCP tools and no Bash access to dr.
  attributes:
    requirementType: non-functional
    priority: critical
    documentation: Every step of the DR use cases can be done by the developer's
