motivation.requirement.a-refused-landing-says-why:
  id: 829c1e18-29ab-4838-b6e0-9eab0ebf0a22
  path: motivation.requirement.a-refused-landing-says-why
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A refused landing says why
  description: "When changeset_commit does not land a changeset, it says which of
    these happened: the person declined, the dialog could not be shown, or the
    model drifted. It names the way forward for each: the viewer's Apply, an
    interactive session, or force."
  attributes:
    requirementType: functional
    priority: high
    documentation: "A decline that arrives within about a second of the request is
      reported as 'the confirmation dialog could not be shown', not as the
      person declining. Acceptance: in the desktop Code tab an elicitation-only
      commit reports that the dialog could not be shown and points to the
      viewer's Apply; a person's real decline is still reported as declined."
  metadata:
    created_at: 2026-11-17T20:42:52.468Z
    updated_at: 2026-11-17T20:42:52.468Z
    version: 1
motivation.requirement.extraction-offers-only-reported-declarations-as-candidates:
  id: ccced842-9d54-4b36-a912-7ce78715cec8
  path: motivation.requirement.extraction-offers-only-reported-declarations-as-candidates
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Extraction offers only reported declarations as candidates
  description: Extraction builds a candidate only from a declaration the code
    graph reports (a class, interface, function, method, route or type). It
    never offers a file. Relationships that were joined through a file's element
    are joined to declarations or dropped, and an element an existing model
    sourced at a whole file stays valid and is not reported as drift.
  attributes:
    requirementType: functional
    priority: high
    documentation: Extraction builds a candidate only from a declaration the code
      graph reports (a class, interface, function, method, route or type). It
      never offers a file. Relationships that were joined through a file's
      element (imports and test-file links) are joined to declarations or
      dropped, and an element an existing model sourced at a whole file stays
      valid and is not reported as drift. Verified when codebase_extract returns
      no file card on any corpus and the analyzer mapping has no entry for the
      code graph's Module node.
  metadata:
    created_at: 2026-11-18T18:04:53.571Z
    updated_at: 2026-11-18T18:04:53.571Z
    version: 1
motivation.requirement.the-agent-models-what-the-code-graph-does-not-report:
  id: b0b9c76e-dd71-44f9-9a61-22a2ac3fab9e
  path: motivation.requirement.the-agent-models-what-the-code-graph-does-not-report
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: The agent models what the code graph does not report
  description: "Content the code graph reports no declaration for is modelled by
    the calling agent, guided by the skills: entry points made of top-level
    statements, file-based routes, top-level constants such as stores and
    schemas, and buildable projects. Each element it stages names the file and,
    where there is one, the symbol."
  attributes:
    requirementType: functional
    priority: medium
    documentation: "Content the code graph reports no declaration for is modelled by
      the calling agent, guided by the skills: entry points made of top-level
      statements (Program.cs, main.tsx), file-based routes (a Next.js page),
      top-level constants such as stores and schemas, and buildable projects
      declared by a build manifest. Each element the agent stages names the file
      and, where there is one, the symbol. Verified when the layer skills say
      where to look for each of these and no longer tell the agent to model a
      file as an element."
  metadata:
    created_at: 2026-11-18T18:04:53.572Z
    updated_at: 2026-11-18T18:04:53.572Z
    version: 1
motivation.requirement.drift-is-known-before-landing:
  id: 6d3aed99-7cba-451a-8a2d-11515b661066
  path: motivation.requirement.drift-is-known-before-landing
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Drift is known before landing
  description: A person reviewing a staged changeset can see, before trying to
    land it, whether the base model changed under it, what changed, and whether
    that blocks landing. Drift that touched nothing the changeset was staged
    against, and drift under a verification record (which never lands), never
    read as blocking.
  attributes:
    requirementType: functional
    priority: high
    documentation: "Acceptance: with no commit attempt, the viewer API reports for
      each changeset one of: nothing changed; the base changed but nothing the
      changeset was staged against did (content-free, #1169; not blocking); the
      base changed under it (blocking a commit without force, with the
      overlapping staged changes and the base's changes named); or not
      applicable (a verification record, #1171, or a changeset that is no longer
      staged). The answer agrees with what a commit would do: it is blocking
      exactly when POST /api/changesets/:id/commit would refuse for drift."
  metadata:
    created_at: 2026-11-18T19:52:37.508Z
    updated_at: 2026-11-18T19:52:37.508Z
    version: 1
motivation.requirement.only-an-overlapping-base-change-blocks-a-landing:
  id: 1214a779-73a8-463e-95cf-8ce4681faf4a
  path: motivation.requirement.only-an-overlapping-base-change-blocks-a-landing
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Only an overlapping base change blocks a landing
  description: "A staged changeset is refused for drift only when the base
    overlaps it: an element it stages any change for (an update, a delete, or a
    delete then an add) changed or was removed, an element it deletes gained a
    relationship the delete would remove, an element at an end of a relationship
    it adds or deletes changed or was removed, the base already has what it
    adds, or lacks what it deletes. Any other change to the base does not block
    it."
  attributes:
    requirementType: functional
    priority: high
    documentation: "Acceptance: with a base index recorded, a changeset staged
      before another one landed commits without force when the other changed or
      removed only elements and relationships it does not edit or link to; it is
      still refused when the other changed or removed an element it stages a
      change for (whatever the staged ops and their order), linked an element it
      deletes, or changed or removed an element it links to. Without a base
      index a changed hash still blocks, since the two cannot be told apart. The
      CLI, changeset_commit, the viewer's Apply, project_status and the viewer
      API's drift field all read the one rule (StagingAreaManager.detectDrift).
      Not covered, as before this change: fields outside the base index's
      content hash (accepted gaps, metadata, references), and an update of an
      element the base gained after the changeset was created."
  metadata:
    created_at: 2026-11-18T20:52:36.711Z
    updated_at: 2026-11-18T20:52:36.711Z
    version: 1
motivation.requirement.a-migration-records-what-it-drops:
  id: ee6ddf29-29f2-492c-93c5-db3723f4aacc
  path: motivation.requirement.a-migration-records-what-it-drops
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A migration records what it drops
  description: When a spec migration removes relationships whose type has no
    replacement in the catalog, it leaves a record that names each one (source,
    predicate, target, and the rule that retired it), which the user can review
    and restore from. The record is a staged changeset that never lands.
  attributes:
    requirementType: functional
    priority: high
    documentation: "Issue #1164, maintainer decision 2026-11-18. Verified when an
      upgrade that drops relationships leaves one staged upgrade-record
      changeset listing them, the dry run names it, and a run that drops nothing
      writes none."
  metadata:
    created_at: 2026-11-19T13:36:34.322Z
    updated_at: 2026-11-19T13:36:34.322Z
    version: 1
motivation.requirement.a-migration-takes-the-route-the-catalog-offers:
  id: 830c9304-fb28-479a-8620-7c30bd282853
  path: motivation.requirement.a-migration-takes-the-route-the-catalog-offers
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A migration takes the route the catalog offers
  description: A relationship of a retired type is rewritten, not dropped, when
    the catalog has a type that says the same thing and a change record names it
    as the replacement. Replacements come only from catalog types a Context
    Studio proposal added.
  attributes:
    requirementType: functional
    priority: high
    documentation: "Issue #1164. The rewrite table is generated from change records;
      a replace-dropped action names the replacement for a triple an earlier
      record dropped, and the generator fails when the replacement is not in the
      catalog."
  metadata:
    created_at: 2026-11-19T13:36:34.344Z
    updated_at: 2026-11-19T13:36:34.344Z
    version: 1
