motivation.requirement.landing-a-change-needs-a-humans-confirmation:
  id: de220664-6286-46c8-9741-94ab45f0c3c9
  path: motivation.requirement.landing-a-change-needs-a-humans-confirmation
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Landing a change needs a human's confirmation
  description: "A changeset reaches the base model only after a person confirms it: in an MCP confirmation dialog (elicitation), in the permission prompt a client forces for changeset_commit (Claude Code, carrying a confirmation token from a preview of the same changeset state), or with the viewer's Apply button. A session where no person can answer (DrBot, a non-interactive run) is refused."
  attributes:
    requirementType: functional
    priority: critical
    documentation: "A changeset reaches the base model only after a person confirms it: in an MCP confirmation dialog (elicitation), in the permission prompt a client forces for changeset_commit (Claude Code, carrying a confirmation token from a preview of the same changeset state), or with the viewer's Apply button. A session where no person can answer (DrBot, a non-interactive run) is refused. Acceptance: a changeset lands from the Claude desktop Code tab after one approval; no client lands one without a person."
  metadata:
    created_at: 2026-11-09T22:04:38.022Z
    updated_at: 2026-11-09T22:04:38.022Z
    version: 1
