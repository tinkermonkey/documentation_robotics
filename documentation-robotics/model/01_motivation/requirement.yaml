motivation.requirement.a-refused-landing-says-why:
  id: 829c1e18-29ab-4838-b6e0-9eab0ebf0a22
  path: motivation.requirement.a-refused-landing-says-why
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A refused landing says why
  description:
    "When changeset_commit does not land a changeset, it says which of
    these happened: the person declined, the dialog could not be shown, or the
    model drifted. It names the way forward for each: the viewer's Apply, an
    interactive session, or force."
  attributes:
    requirementType: functional
    priority: high
    documentation:
      "A decline that arrives within about a second of the request is
      reported as 'the confirmation dialog could not be shown', not as the
      person declining. Acceptance: in the desktop Code tab an elicitation-only
      commit reports that the dialog could not be shown and points to the
      viewer's Apply; a person's real decline is still reported as declined."
  metadata:
    created_at: 2026-11-17T20:42:52.468Z
    updated_at: 2026-11-17T20:42:52.468Z
    version: 1
