motivation.requirement.landing-a-change-needs-a-humans-confirmation:
  id: de220664-6286-46c8-9741-94ab45f0c3c9
  path: motivation.requirement.landing-a-change-needs-a-humans-confirmation
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Landing a change needs a human's confirmation
  description: "A changeset reaches the base model only after a person confirms
    it: in an MCP confirmation dialog (elicitation), in the permission prompt a
    client forces for changeset_commit (Claude Code, carrying a confirmation
    token from a preview of the same changeset state), or with the viewer's
    Apply button. A session where no person can answer (DrBot, a non-interactive
    run) is refused."
  attributes:
    requirementType: functional
    priority: critical
    documentation:
      "A changeset reaches the base model only after a person confirms
      it: in an MCP confirmation dialog (elicitation), in the permission prompt
      a client forces for changeset_commit (Claude Code, carrying a confirmation
      token from a preview of the same changeset state), or with the viewer's
      Apply button. A session where no person can answer (DrBot, a
      non-interactive run) is refused. Acceptance: a changeset lands from the
      Claude desktop Code tab after one approval; no client lands one without a
      person."
  metadata:
    created_at: 2026-11-09T22:04:38.022Z
    updated_at: 2026-11-09T22:04:38.022Z
    version: 1
motivation.requirement.extraction-writes-the-as-built-side:
  id: 2265de5e-1a75-41ac-a6bf-d7511eb7c82a
  path: motivation.requirement.extraction-writes-the-as-built-side
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Extraction writes the as-built side
  description: Extraction stages what it finds into a changeset, never into the
    base model, so the same output can bootstrap a model, keep it as-built, or
    be compared with a plan.
  attributes:
    requirementType: functional
    priority: high
    documentation:
      Extraction stages what it finds into a changeset, never into the
      base model, so the same output can bootstrap a model, keep it as-built, or
      be compared with a plan.
  metadata:
    created_at: 2026-11-09T22:04:38.033Z
    updated_at: 2026-11-09T22:04:38.033Z
    version: 1
