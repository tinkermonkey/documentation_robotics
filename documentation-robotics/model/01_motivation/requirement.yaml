motivation.requirement.accepted-gaps-are-recorded-with-a-reason:
  id: 4c129e17-3920-42f8-a2a8-0155f847151f
  path: motivation.requirement.accepted-gaps-are-recorded-with-a-reason
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Accepted gaps are recorded with a reason
  description:
