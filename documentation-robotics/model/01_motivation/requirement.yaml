motivation.requirement.one-central-process-per-user:
  id: 1301f97a-e3f1-4924-846c-1b8d3a12088f
  path: motivation.requirement.one-central-process-per-user
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: One central process per user
  description: One back-end process per user serves the MCP interface and the multi-project viewer on one port with one token, and launches every DrBot sub-process (maintainer ruling 4).
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.879Z
    updated_at: 2026-11-21T17:14:10.879Z
    version: 1
motivation.requirement.every-api-call-names-its-project-and-checkout:
  id: cb1efd63-80a8-4c4b-938f-899c0dca1568
  path: motivation.requirement.every-api-call-names-its-project-and-checkout
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Every API call names its project and checkout
  description: Every viewer API route that reads or writes project data is scoped by project and checkout (/api/projects/:project/checkouts/:checkout/...). The unscoped /api routes are removed in the release whose bundled viewer uses the scoped ones, with no compatibility window (maintainer ruling 5).
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.per-checkout-state-never-leaks:
  id: c61cbf29-75e4-4554-b5c2-aca360b977c6
  path: motivation.requirement.per-checkout-state-never-leaks
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Per-checkout state never leaks
  description: Annotations, changesets, staging, drift, the active changeset, the websocket feed and DrBot conversations are held per checkout; nothing read or written for one checkout is visible through another's routes, links or feed.
  attributes:
    requirementType: non-functional
    priority: critical
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.a-checkout-is-addressed-below-its-project:
  id: 5b20734d-4b3b-4d68-8800-d0ba47810be0
  path: motivation.requirement.a-checkout-is-addressed-below-its-project
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A checkout is addressed below its project
  description: A checkout (the main checkout or a linked worktree) is named by a key that is unique within its project and derived from git, and is addressed as project plus checkout in MCP arguments, viewer URLs, API routes and CLI arguments.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.links-into-the-shared-viewer-start-no-process:
  id: 5f709fc2-6cb0-4b04-b875-5d1dea085491
  path: motivation.requirement.links-into-the-shared-viewer-start-no-process
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Links into the shared viewer start no process
  description: review_open, project_status and every MCP tool that returns a viewer link return a deep link (project, checkout, changeset or element) into the one shared viewer and never start a per-project viewer.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.dr-bot-runs-in-its-project-and-checkout:
  id: 6880e9b4-f7ba-4179-9cba-3000e983cb58
  path: motivation.requirement.dr-bot-runs-in-its-project-and-checkout
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: DrBot runs in its project and checkout
  description: The central process launches each DrBot sub-process (Claude Code CLI, GitHub Copilot CLI) with the checkout as its working directory and its dr MCP connection pinned to that project and checkout.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.models-load-lazily-and-are-evicted:
  id: b526c79c-8ed6-422f-b573-1e616505664e
  path: motivation.requirement.models-load-lazily-and-are-evicted
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Models load lazily and are evicted
  description: A checkout's model is loaded on first use, watched while loaded, and evicted when idle or when the pool is full, so a long farm does not load every model at start-up.
  attributes:
    requirementType: non-functional
    priority: medium
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.projects-resolve-through-one-registry:
  id: 276e9bf8-523c-4a0a-bf4e-b6bba196378e
  path: motivation.requirement.projects-resolve-through-one-registry
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Projects resolve through one registry
  description: Every interface turns a path, a project name or a project and checkout into a project and checkout through the one project registry; a path outside every registered project is registered through the same code before it is served.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T17:14:10.880Z
    updated_at: 2026-11-21T17:14:10.880Z
    version: 1
motivation.requirement.telemetry-names-its-project-and-checkout:
  id: bb4d59a0-104c-42c2-9d43-2c05c82a89e6
  path: motivation.requirement.telemetry-names-its-project-and-checkout
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Telemetry names its project and checkout
  description: When the CLI is built with telemetry, every span the central process emits for project data carries dr.project and dr.checkout, so traces from one per-user process can be told apart per checkout in the collector.
  attributes:
    requirementType: non-functional
    priority: low
  metadata:
    created_at: 2026-11-21T17:22:16.827Z
    updated_at: 2026-11-21T17:22:16.827Z
    version: 1
