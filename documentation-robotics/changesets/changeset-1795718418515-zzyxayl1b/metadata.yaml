id: changeset-1795718418515-zzyxayl1b
name: cli010-b2-intent-gaps
description: |-
  Make `changeset_brief` trustworthy for bootstraps and long plans (#1329, #1391, #1392).

  **In scope:** intent tracing treats an added requirement/feature/capability that realizes, satisfies or supports a goal or outcome (added or not) as an anchor; contradicted accepted gaps are listed under `gaps` with the `gap_reopen` call; peer-pattern gaps skip external/headless elements and learn from accepted gaps of the same type; shown traced paths prefer realizes/serves chains over hubs.

  **Done when:** cabinet-sheets and toland-cad-shaped bootstraps report traced elements, and tests cover each change.
