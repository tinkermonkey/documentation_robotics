id: changeset-1795281066041-0kg0ygyyb
name: user-level-dr
description: One central DR process per user serves the MCP interface, a
  multi-project viewer and DrBot from one project registry. Projects are named
  once for every interface, and a project's repository and checkouts (main
  checkout plus worktrees) are first-class. Done when the registry, checkout
  structure, central process, project- and checkout-scoped API, deep links and
  DrBot launching are planned across layers, and the unscoped /api routes are
  planned out.
