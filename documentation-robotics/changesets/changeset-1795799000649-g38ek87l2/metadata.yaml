id: changeset-1795799000649-g38ek87l2
name: cli010-v2b-verdicts
description: |-
  changeset_verify never reports a pass for something it didn't check (#1383, #1307, #1346).

  **In scope:**
  - `checkDescriptionOnlyPlan` (#1383): a plan that only changes descriptions checks that each element's source files changed in the range and its referenced symbols still exist; otherwise the verdict says "not checked: the plan changes only descriptions".
  - Already-applied plans (#1307): a planned add already in the base unchanged is matched against the as-built changeset's new elements and source references, not against itself; unmatched it is unverifiable and `verdictText` says the plan was applied before the build. `changeset_adopt_source_references` counts planned elements with no source reference anywhere (`unreferenced`) with a next step.
  - `narrowVerifyReport` (#1346): `ids`/`layers` compute the verdict and counts over the subset, with `wholePlan` totals beside them.

  **Done when:** the three behaviours are covered by tests and the verify docs and tool descriptions say so.
