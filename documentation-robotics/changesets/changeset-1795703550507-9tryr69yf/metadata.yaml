description: 'Fix #1422 and #1368. Every MCP result names the branch beside the checkout key, and a landing says "Lands on branch X in checkout main". changeset_create and project_status list staged plans in the project''s other checkouts and warn (never refuse) when one matches by name, issue or intent; when the farm can''t list them the result says so.'
