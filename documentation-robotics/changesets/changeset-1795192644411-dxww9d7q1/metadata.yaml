id: changeset-1795192644411-dxww9d7q1
name: drift-warns-landing-always-confirmable
description: "Drift stops refusing a landing (#1200): a drifted changeset lands
  from changeset_commit, the viewer's Apply and the CLI with no force, and the
  confirmation names each overlap and what landing does about it. A person can
  always confirm a landing: the dialog, Claude Code's permission prompt with a
  preview token, or Apply (#1239, #1207). An overlap is only what could make the
  landing wrong: a description edit on a link's end is not one (#1208), and an
  update restaged on the current base is not one (#1239). The base hash covers
  content and relationships only, with a version prefix, and changeset_update
  can re-baseline a changeset, showing what moved under it (#1169). Done when
  the model's three drift requirements, the commit and drift features and the
  functions they name say this."
