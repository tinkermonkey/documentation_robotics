        spec_node_id: motivation.requirement
        type: requirement
        layer_id: motivation
        name: A changeset can be re-baselined
        description: "A staged changeset whose base moved can take the base as it is now
          as its starting point: changeset_update with rebaseline records the
          current base hash and base index and returns what moved under the
          changeset since the last one. Re-baselining never hides an overlap
          that is still true against the current base: a staged update or delete
          made on older content of an element stays an overlap until it is
          restaged, and the landing summary says when the changeset was
          re-baselined."
        attributes:
          requirementType: functional
          priority: medium
          documentation: "Acceptance: after a re-baseline the changeset's drift state is
            none unless a staged change still overlaps the base as it is now;
            the response lists what was added, removed and changed in the base
            since the previous base, the overlaps that were cleared and the ones
            that remain with how to resolve each; the base index records when it
            was re-baselined and from which base hash, and the confirmation
            dialog and commit preview show it. A record (verification, upgrade)
            and a changeset that is no longer staged are refused."
