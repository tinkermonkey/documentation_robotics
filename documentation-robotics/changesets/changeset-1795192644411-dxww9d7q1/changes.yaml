    name: Commit confirmation token
    description: "MCP: changeset_commit_preview checks a changeset for landing
      without writing anything and returns the landing summary (intent, counts,
      layers, drift, validation) with a token bound to the changeset's confirmed
      state. Claude Code shows the summary, and the person approves the
      changeset_commit call carrying the token in Claude Code's permission
