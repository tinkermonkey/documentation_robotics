- type: update
  elementId: motivation.requirement.only-an-overlapping-base-change-blocks-a-landing
  layerName: motivation
  before:
    id: 1214a779-73a8-463e-95cf-8ce4681faf4a
    path: motivation.requirement.only-an-overlapping-base-change-blocks-a-landing
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Only an overlapping base change blocks a landing
    description: "A staged changeset is refused for drift only when the base
      overlaps it: an element it stages any change for (an update, a delete, or
      a delete then an add) changed or was removed, an element it deletes gained
      a relationship the delete would remove, an element at an end of a
      relationship it adds or deletes changed or was removed, the base already
      has what it adds, or lacks what it deletes. Any other change to the base
      does not block it."
    attributes:
      requirementType: functional
      priority: high
      documentation: "Acceptance: with a base index recorded, a changeset staged
        before another one landed commits without force when the other changed
        or removed only elements and relationships it does not edit or link to;
        it is still refused when the other changed or removed an element it
        stages a change for (whatever the staged ops and their order), linked an
        element it deletes, or changed or removed an element it links to.
        Without a base index a changed hash still blocks, since the two cannot
        be told apart. The CLI, changeset_commit, the viewer's Apply,
        project_status and the viewer API's drift field all read the one rule
        (StagingAreaManager.detectDrift). Not covered, as before this change:
        fields outside the base index's content hash (accepted gaps, metadata,
        references), and an update of an element the base gained after the
        changeset was created."
    metadata: &a1
      created_at: 2026-11-18T20:52:36.711Z
      updated_at: 2026-11-18T20:52:36.711Z
      version: 1
  after:
    id: 1214a779-73a8-463e-95cf-8ce4681faf4a
    path: motivation.requirement.only-an-overlapping-base-change-blocks-a-landing
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Only an overlapping base change warns at a landing
    description: "Drift never refuses a landing. A staged changeset lands with a
      warning only when the base overlaps it in a way that could make the
      landing wrong: an element it stages a change for changed in the base after
      that change was staged, or was removed; an element it deletes gained a
      relationship the delete would remove; an element at an end of a
      relationship it adds or deletes was removed; the base already has what it
      adds, or lacks what it deletes. Each overlap is named with what landing
      does about it. Any other change to the base, a description, name or
      attribute edit on a link's end included, is not an overlap."
    attributes:
      requirementType: functional
      priority: high
      documentation: "Acceptance: a drifted changeset lands from the CLI,
        changeset_commit and the viewer's Apply without force, and each shows
        what overlapped and what landing did about it. A staged update or delete
        is compared with the base through the element state it recorded when it
        was staged, so an update restaged on the current base is not an overlap,
        and one staged on an older base still is after a re-baseline. A change
        to an element at a link's end that keeps its id is not an overlap (the
        id carries its layer and type); a removed end is. Without a base index,
        what changed cannot be listed and the landing says so. The CLI,
        changeset_commit, the viewer's Apply, project_status and the viewer
        API's drift field all read the one rule
        (StagingAreaManager.detectDrift). Validation errors the changeset
        introduces and records (verification, upgrade) are still refused. Not
        covered, as before: fields outside the content hash (accepted gaps,
        metadata, references)."
    metadata: *a1
  timestamp: 2026-11-20T16:38:01.493Z
