- type: update
  elementId: product.feature.base-drift-on-the-changeset-api
  layerName: product
  before:
    id: e4c2e358-5964-4c9a-8f61-e13c0a5d94f4
    path: product.feature.base-drift-on-the-changeset-api
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Base drift on the changeset API
    description: "Viewer API: GET /api/changesets and GET /api/changesets/:id carry
      a drift field, with no commit attempt. The list gives each changeset's
      drift state (none, content-free, drifted, not-applicable, unknown),
      whether it blocks a commit, and a sentence saying why. The detail adds
      what changed: the staged changes the base now overlaps, the elements and
      relationships added, removed or changed in the base since the changeset
      was created, and the layers they are in. Read from the same code as
      changeset_brief's drift and the commit's drift check."
    attributes:
      priority: high
      status: developing
      size: s
      documentation: "Purpose-aware (changeset-purpose.ts): blocksCommit is true only
        for a staged changeset whose actions include commit and whose base
        drifted in content. A verification record reads not-applicable, since it
        never lands, and names its plan's state. A committed or discarded
        changeset reads not-applicable. Content-free drift (the model hash
        changed, nothing the changeset was staged against did) is its own state
        and never blocks. Cost, measured on a synthetic model with 9 staged
        changesets: the list's check is about 2 ms per changeset at 200 elements
        and 8 ms at 2,000; the detail's description adds about 4 ms at 2,000.
        The list therefore carries the summary and only the detail carries the
        id lists. Additive: no existing field changes. docs/api-spec.yaml is
        regenerated with it."
    source_reference: &a12
      provenance: manual
      locations:
        - file: cli/src/core/changeset-drift-status.ts
          symbol: driftStatus
    metadata: &a13
      created_at: 2026-11-18T19:52:37.509Z
      updated_at: 2026-11-18T19:52:37.509Z
      version: 1
  after:
    id: e4c2e358-5964-4c9a-8f61-e13c0a5d94f4
    path: product.feature.base-drift-on-the-changeset-api
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Base drift on the changeset API
    description: "Viewer API: GET /api/changesets and GET /api/changesets/:id carry
      a drift field, with no commit attempt. The list gives each changeset's
      drift state (none, content-free, drifted, not-applicable, unknown) and a
      sentence saying what it means; blocksCommit is kept and always false,
      since drift no longer refuses a commit. The detail adds what changed: the
      staged changes the base now overlaps, each with what landing does about
      it, the elements and relationships added, removed or changed in the base
      since the changeset was created or re-baselined, and the layers they are
      in. POST /api/changesets/:id/commit lands a drifted changeset and returns
      the overlaps it landed over. Read from the same code as changeset_brief's
      drift and the commit's drift check."
    attributes:
      priority: high
      status: developing
      size: s
      documentation: "Purpose-aware (changeset-purpose.ts): a verification record or
        an upgrade record reads not-applicable, since it never lands, and a
        verification record names its plan's state. A committed or discarded
        changeset reads not-applicable. Content-free drift (the base changed,
        nothing the changeset stages overlaps it) is its own state. State
        drifted means a landing warns, not that it is refused: blocksCommit is
        always false and stays only so a client built against the earlier API
        keeps reading it. Each overlap carries a consequence sentence. The
        commit route answers 409 only for a record or a changeset that is no
        longer staged. docs/api-spec.yaml is regenerated with it."
    source_reference: *a12
    metadata: *a13
  timestamp: 2026-11-20T16:38:04.310Z
  sequenceNumber: 5
- type: add
  elementId: motivation.requirement.a-changeset-can-be-re-baselined
  layerName: motivation
  after:
    id: 687301ac-59d9-41ac-8e34-030f71cef401
    path: motivation.requirement.a-changeset-can-be-re-baselined
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A changeset can be re-baselined
    description: "A staged changeset whose base moved can take the base as it is now
      as its starting point: changeset_update with rebaseline records the
      current base hash and base index and returns what moved under the
      changeset since the last one. Re-baselining never hides an overlap that is
      still true against the current base: a staged update or delete made on
      older content of an element stays an overlap until it is restaged, and the
      landing summary says when the changeset was re-baselined."
    attributes:
      requirementType: functional
      priority: medium
      documentation: "Acceptance: after a re-baseline the changeset's drift state is
        none unless a staged change still overlaps the base as it is now; the
        response lists what was added, removed and changed in the base since the
        previous base, the overlaps that were cleared and the ones that remain
        with how to resolve each; the base index records when it was
        re-baselined and from which base hash, and the confirmation dialog and
        commit preview show it. A record (verification, upgrade) and a changeset
        that is no longer staged are refused."
    metadata:
      created_at: 2026-11-20T16:38:29.310Z
      updated_at: 2026-11-20T16:38:29.310Z
      version: 1
  timestamp: 2026-11-20T16:38:29.336Z
  sequenceNumber: 6
