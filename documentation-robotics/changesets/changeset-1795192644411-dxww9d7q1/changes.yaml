        person declining. Acceptance: in the desktop Code tab an
        elicitation-only commit reports that the dialog could not be shown and
        points to the viewer's Apply; a person's real decline is still reported
        as declined."
    metadata: &a5
      created_at: 2026-11-17T20:42:52.468Z
      updated_at: 2026-11-17T20:42:52.468Z
      version: 1
  after:
    id: 829c1e18-29ab-4838-b6e0-9eab0ebf0a22
    path: motivation.requirement.a-refused-landing-says-why
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A refused landing says why
    description: "When changeset_commit does not land a changeset, it says which of
      these happened: the person declined, no confirmation came back (the dialog
      may not have been shown), no person can confirm in this session, the
      changeset or base changed since the person saw it, validation failed, or
      the changeset is a record. It names the way forward that works from this
      client: the commit preview and its token in Claude Code's permission
      prompt, or the viewer's Apply. Drift is not a refusal, and no refusal
      leaves the dr CLI as the only way to land."
    attributes: *a4
