- type: update
  elementId: motivation.requirement.drift-is-known-before-landing
  layerName: motivation
  before:
    id: 6d3aed99-7cba-451a-8a2d-11515b661066
    path: motivation.requirement.drift-is-known-before-landing
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Drift is known before landing
    description: A person reviewing a staged changeset can see, before trying to
      land it, whether the base model changed under it, what changed, and
      whether that blocks landing. Drift that touched nothing the changeset was
      staged against, and drift under a verification record (which never lands),
      never read as blocking.
    attributes: &a2
      requirementType: functional
      priority: high
      documentation: "Acceptance: with no commit attempt, the viewer API reports for
        each changeset one of: nothing changed; the base changed but nothing the
        changeset was staged against did (content-free, #1169; not blocking);
        the base changed under it (blocking a commit without force, with the
        overlapping staged changes and the base's changes named); or not
        applicable (a verification record, #1171, or a changeset that is no
        longer staged). The answer agrees with what a commit would do: it is
        blocking exactly when POST /api/changesets/:id/commit would refuse for
        drift."
    metadata: &a3
      created_at: 2026-11-18T19:52:37.508Z
      updated_at: 2026-11-18T19:52:37.508Z
      version: 1
  after:
    id: 6d3aed99-7cba-451a-8a2d-11515b661066
    path: motivation.requirement.drift-is-known-before-landing
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Drift is known before landing
    description: "A person reviewing a staged changeset can see, before landing it,
      whether the base model changed under it, which staged changes the base
      overlaps, and what landing does about each overlap. Drift never blocks a
      landing: it is shown where the person confirms (the dialog, the commit
      preview, the viewer before Apply) and again in the landing's result. Drift
      that overlaps nothing the changeset stages, and drift under a record
      (which never lands), read as no warning."
    attributes: *a2
    metadata: *a3
