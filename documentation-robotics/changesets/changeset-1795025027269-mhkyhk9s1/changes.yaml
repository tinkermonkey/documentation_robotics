- type: add
  elementId: motivation.principle.a-file-is-a-source-link-not-an-element
  layerName: motivation
  after:
    id: 9b8e9eea-ba46-47da-9d4a-63769c8674c6
    path: motivation.principle.a-file-is-a-source-link-not-an-element
    spec_node_id: motivation.principle
    type: principle
    layer_id: motivation
    name: A file is a source link, not an element
    description:
      A source file is where an element was found and nothing more. Only
      what a file contains can be an element; the file itself never is, and the
      model records it only in an element's source reference.
    attributes:
      category: architecture
      documentation:
        "A source file is where an element was found and nothing more.
        Only what a file contains can be an element; the file itself never is,
        and the model records it only in an element's source reference.
        Maintainer ruling, 2026-11-18: a file does not map to the DR schema in
        any way, and a file with no modelled content is ignored until a case
        shows it would add value. A module in the architectural sense may be a
        file, part of a file or several files, so it is never read off a file's
        existence."
    metadata:
      created_at: 2026-11-18T18:04:53.544Z
      updated_at: 2026-11-18T18:04:53.544Z
      version: 1
  timestamp: 2026-11-18T18:04:53.596Z
  sequenceNumber: 0
- type: add
  elementId: motivation.constraint.no-list-of-recognised-calls
  layerName: motivation
  after:
    id: 88ddcad5-79ba-4aff-9c6d-c40fc01a29a2
    path: motivation.constraint.no-list-of-recognised-calls
    spec_node_id: motivation.constraint
    type: constraint
    layer_id: motivation
    name: No list of recognised calls
    description:
      DR does not keep a list of framework or library calls that mark a
      top-level constant as a store, a schema, a route or anything else.
      Maintaining one is outside this project's scope.
    attributes:
      constraintType: technical
      documentation:
        "DR does not keep a list of framework or library calls (a store
        factory, a schema builder, a route builder) that mark a top-level
        constant as an element. Maintaining one is outside this project's scope.
        Source: maintainer ruling, 2026-11-18. Scope: the cbm analyzer's mapping
        and Tier 0 rules. Check: no rule or mapping entry matches on the name of
        a third-party call. Where the code graph reports nothing that tells such
        a constant from any other, extraction by rule ignores it."
    metadata:
      created_at: 2026-11-18T18:04:53.570Z
      updated_at: 2026-11-18T18:04:53.570Z
      version: 1
  timestamp: 2026-11-18T18:04:53.596Z
  sequenceNumber: 1
- type: add
  elementId: motivation.requirement.extraction-offers-only-reported-declarations-as-candidates
  layerName: motivation
  after:
    id: ccced842-9d54-4b36-a912-7ce78715cec8
    path: motivation.requirement.extraction-offers-only-reported-declarations-as-candidates
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Extraction offers only reported declarations as candidates
    description: Extraction builds a candidate only from a declaration the code
      graph reports (a class, interface, function, method, route or type). It
      never offers a file. Relationships that were joined through a file's
      element are joined to declarations or dropped, and an element an existing
      model sourced at a whole file stays valid and is not reported as drift.
    attributes:
      requirementType: functional
      priority: high
      documentation:
        Extraction builds a candidate only from a declaration the code
        graph reports (a class, interface, function, method, route or type). It
        never offers a file. Relationships that were joined through a file's
        element (imports and test-file links) are joined to declarations or
        dropped, and an element an existing model sourced at a whole file stays
        valid and is not reported as drift. Verified when codebase_extract
        returns no file card on any corpus and the analyzer mapping has no entry
        for the code graph's Module node.
    metadata:
      created_at: 2026-11-18T18:04:53.571Z
      updated_at: 2026-11-18T18:04:53.571Z
      version: 1
  timestamp: 2026-11-18T18:04:53.596Z
