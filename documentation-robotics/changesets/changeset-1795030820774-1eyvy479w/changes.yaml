- type: add
  elementId: motivation.assessment.drift-shows-only-when-apply-is-refused
  layerName: motivation
  after:
    id: 522bbb11-a395-4c53-aeee-e0ae39f8c2df
    path: motivation.assessment.drift-shows-only-when-apply-is-refused
    spec_node_id: motivation.assessment
    type: assessment
    layer_id: motivation
    name: Drift shows only when Apply is refused
    description: The viewer learns that the base model changed under a changeset
      only when a commit is attempted and refused (409). GET /api/changesets and
      GET /api/changesets/:id carry no drift field, so nothing can be shown
      before Apply.
    attributes:
      assessmentType: gap
      documentation: "Found 2026-11-18 from the viewer side
        (documentation_robotics_viewer issue 576, show base drift before Apply):
        at main 6ef30d2f the REST side meets drift only in the commit route
        (StagingAreaManager.detectDrift), while changeset_brief already names
        what changed (describeDrift). Dogfood the same day (#1171): the viewer
        offered Apply on a verification record whose plan had landed, and the
        refusal for drift was the first sign anything was off. #1169: drift with
        nothing changed read as blocking until the base index told the two
        apart."
    metadata:
      created_at: 2026-11-18T19:52:37.492Z
      updated_at: 2026-11-18T19:52:37.492Z
      version: 1
  timestamp: 2026-11-18T19:52:37.523Z
  sequenceNumber: 0
- type: add
  elementId: motivation.requirement.drift-is-known-before-landing
  layerName: motivation
  after:
    id: 6d3aed99-7cba-451a-8a2d-11515b661066
    path: motivation.requirement.drift-is-known-before-landing
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Drift is known before landing
    description: A person reviewing a staged changeset can see, before trying to
      land it, whether the base model changed under it, what changed, and
      whether that blocks landing. Drift that touched nothing the changeset was
      staged against, and drift under a verification record (which never lands),
      never read as blocking.
    attributes:
      requirementType: functional
      priority: high
      documentation:
        "Acceptance: with no commit attempt, the viewer API reports for
        each changeset one of: nothing changed; the base changed but nothing the
        changeset was staged against did (content-free, #1169; not blocking);
        the base changed under it (blocking a commit without force, with the
        overlapping staged changes and the base's changes named); or not
        applicable (a verification record, #1171, or a changeset that is no
        longer staged). The answer agrees with what a commit would do: it is
        blocking exactly when POST /api/changesets/:id/commit would refuse for
        drift."
    metadata:
      created_at: 2026-11-18T19:52:37.508Z
      updated_at: 2026-11-18T19:52:37.508Z
      version: 1
  timestamp: 2026-11-18T19:52:37.523Z
  sequenceNumber: 1
- type: add
  elementId: product.feature.base-drift-on-the-changeset-api
  layerName: product
  after:
    id: e4c2e358-5964-4c9a-8f61-e13c0a5d94f4
    path: product.feature.base-drift-on-the-changeset-api
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Base drift on the changeset API
    description:
      "Viewer API: GET /api/changesets and GET /api/changesets/:id carry
      a drift field, with no commit attempt. The list gives each changeset's
      drift state (none, content-free, drifted, not-applicable, unknown),
      whether it blocks a commit, and a sentence saying why. The detail adds
      what changed: the staged changes the base now overlaps, the elements and
      relationships added, removed or changed in the base since the changeset
      was created, and the layers they are in. Read from the same code as
      changeset_brief's drift and the commit's drift check."
    attributes:
      priority: high
      status: developing
      size: s
      documentation:
        "Purpose-aware (changeset-purpose.ts): blocksCommit is true only
        for a staged changeset whose actions include commit and whose base
        drifted in content. A verification record reads not-applicable, since it
        never lands, and names its plan's state. A committed or discarded
        changeset reads not-applicable. Content-free drift (the model hash
        changed, nothing the changeset was staged against did) is its own state
        and never blocks. Cost, measured on a synthetic model with 9 staged
        changesets: the list's check is about 2 ms per changeset at 200 elements
        and 8 ms at 2,000; the detail's description adds about 4 ms at 2,000.
        The list therefore carries the summary and only the detail carries the
        id lists. Additive: no existing field changes. docs/api-spec.yaml is
        regenerated with it."
    metadata:
      created_at: 2026-11-18T19:52:37.509Z
      updated_at: 2026-11-18T19:52:37.509Z
      version: 1
    source_reference:
      provenance: manual
      locations:
        - file: cli/src/core/changeset-drift-status.ts
          symbol: driftStatus
