name: changeset-drift-in-rest-api
description: "GET /api/changesets and GET /api/changesets/:id on the dr
  visualize server report base drift without a commit attempt, so the viewer can
  show it before Apply (viewer issue 576). The field says whether the base
  changed under the changeset and whether that blocks landing; content-free
  drift (#1169) and a verification record whose plan landed (#1171) never read
  as blocking. The detail endpoint names what changed, reusing describeDrift;
  the list stays cheap. Done: both endpoints return the field, tests cover
  clean, drifted plan, content-free and verification record, docs/api-spec.yaml
  is regenerated, PR open against main."
