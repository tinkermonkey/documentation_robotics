        name: Base drift on the changeset API
        description:
          "Viewer API: GET /api/changesets and GET /api/changesets/:id carry
          a drift field, with no commit attempt. The list gives each changeset's
          drift state (none, content-free, drifted, not-applicable, unknown),
          whether it blocks a commit, and a sentence saying why. The detail adds
          what changed: the staged changes the base now overlaps, the elements
          and relationships added, removed or changed in the base since the
          changeset was created, and the layers they are in. Read from the same
          code as changeset_brief's drift and the commit's drift check."
        attributes:
          priority: high
          status: developing
          size: s
          documentation:
            "Purpose-aware (changeset-purpose.ts): blocksCommit is true only
            for a staged changeset whose actions include commit and whose base
            drifted in content. A verification record reads not-applicable,
            since it never lands, and names its plan's state. A committed or
            discarded changeset reads not-applicable. Content-free drift (the
            model hash changed, nothing the changeset was staged against did) is
            its own state and never blocks. Cost, measured on a synthetic model
            with 9 staged changesets: the list's check is about 2 ms per
            changeset at 200 elements and 8 ms at 2,000; the detail's
            description adds about 4 ms at 2,000. The list therefore carries the
            summary and only the detail carries the id lists. Additive: no
            existing field changes. docs/api-spec.yaml is regenerated with it."
