    path: motivation.principle.the-mcp-server-is-the-gateway-to-the-model
    spec_node_id: motivation.principle
    type: principle
    layer_id: motivation
    name: The MCP server is the gateway to the model
    description: Everything a person does with a DR model, from creating it to
      landing a change, can be done by their agent through the dr MCP server.
      The CLI is for scripts, CI and people who prefer it.
    attributes:
      category: development
      documentation:
        A developer working with a coding agent shouldn't have to switch
        to a terminal to keep the model in step with their work. Each CLI
        workflow has an MCP route built on the same core operation, so the two
        never disagree.
    metadata:
