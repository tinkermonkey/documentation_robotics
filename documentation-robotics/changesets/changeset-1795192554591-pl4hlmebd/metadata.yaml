id: changeset-1795192554591-pl4hlmebd
name: batch-writes-and-id-derivation
description: "Make the MCP write tools cheap for large batches and make ids
  predictable. model_add, relationship_add and model_update take a JSON file and
  return counts plus only the items that need attention; model_update gets a
  list form; a name or hyphenless id resolves against the model as the active
  changeset leaves it; model_add, dr add and extraction share one id function.
  Existing ids are never rewritten. Done: one PR for 1182, 1217, 1233, 1230,
  1153, 1212, 1184, 1225 with tests, and the response size of a 300-element
  model_add and a 500-relationship relationship_add measured before and after."
