- type: update
  elementId: product.feature.stage-element-changes
  layerName: product
  before:
    id: ab6e7c50-5dec-4c85-9363-8c4588f30a26
    path: product.feature.stage-element-changes
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Stage element changes
    description: "MCP: model_add, model_update (attributePatch), model_delete; stage
      into the active changeset. CLI: dr add/update/delete."
    attributes:
      priority: critical
      status: delivered
      documentation: 'MCP: model_add, model_update (attributePatch), model_delete;
        stage into the active changeset. CLI: dr add/update/delete. With no
        changeset active the write goes to the base model. A base write from a
        model that was loaded while a changeset was active, when that changeset
        has since stopped being staged, fails with "The change was not saved"
        instead of reporting success and storing nothing (#1218,
        cli/src/core/mutation-handler.ts).'
    source_reference: &a1
      provenance: manual
      locations:
        - file: cli/src/mcp/tools/model-update.ts
    metadata: &a2
      created_at: 2026-11-09T21:54:57.057Z
      updated_at: 2026-11-09T21:54:57.057Z
      version: 1
  after:
    id: ab6e7c50-5dec-4c85-9363-8c4588f30a26
    path: product.feature.stage-element-changes
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Stage element changes
    description: "MCP: model_add, model_update (attributePatch), model_delete; stage
      into the active changeset. model_add and model_update take a list, inline
      or in a JSON file, and answer with counts and only the items that need
      attention. CLI: dr add/update/delete."
    attributes:
      priority: critical
      status: delivered
      documentation: "MCP: model_add, model_update (attributePatch), model_delete;
        stage into the active changeset. CLI: dr add/update/delete. With no
        changeset active the write goes to the base model. A base write from a
        model that was loaded while a changeset was active, when that changeset
        has since stopped being staged, fails with \"The change was not saved\"
        instead of reporting success and storing nothing (#1218,
        cli/src/core/mutation-handler.ts). Batches (CLI 0.7.0): model_add takes
        elements (with relationships) and model_update takes updates, inline or
        in a JSON file named by file (one object holding the tool's lists under
        their own names; a relative path is read from the project the call
        addresses). A batch returns total, counts by status and attention: only
        the items not written as sent, or written with a warning or a note;
        verbose: true returns every item (#1182, #1217). A refused model_add
        batch lists what each refused type requires (#1153). sourceFile without
        sourceProvenance gets 'manual' with no warning over MCP (#1233). Ids: dr
        add, model_add and extraction derive an id from a name with one
        function, deriveElementId in cli/src/utils/id-generator.ts (#1225):
        camelCase and a digit before a capitalised word are word breaks (#1184),
        dots, slashes and braces are word breaks, a leading digit gets the
        prefix n- (#1212), and a name over 100 characters is cut with a hash. An
        id is derived once and never rewritten: an add whose id differs only by
        hyphens from an existing element of the same name is refused, naming
        that element."
    source_reference: *a1
    metadata: *a2
  timestamp: 2026-11-20T16:36:08.276Z
  sequenceNumber: 0
