  after:
    id: a5c62b62-6de7-4435-b545-73944e15a9e7
    path: product.feature.stage-relationship-changes
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Stage relationship changes
    description: "MCP: relationship_add, relationship_delete, validated against the
      catalog. relationship_add takes a list, inline or in a JSON file, and
      answers with counts and only the items that need attention. CLI: dr
      relationship add/delete (same staging code)."
    attributes:
      priority: critical
      status: delivered
      documentation: "MCP: relationship_add, relationship_delete, validated against
        the catalog. CLI: dr relationship add/delete (same staging code).
        Batches (CLI 0.7.0): relationship_add takes relationships inline or in a
        JSON file named by file ({\"relationships\": [...]}), staged in one
        write. It returns total, counts by status and attention: the items that
        are invalid (with the reason), duplicate or restored, and the ones whose
        end was read by name; verbose: true returns every item (#1182, #1217).
        In a list (model_add's relationships too), an end that is not an exact
        id is read as the one element it names by its name or its id without
        hyphens, among the elements the call adds and the model as the active
        changeset leaves it, with a note; a name is first a name of the call's
        own elements; more than one match is refused, naming the candidates
        (#1230). An end that is not found is offered the id that starts the same
        (#1225)."
    source_reference: *a3
    metadata: *a4
  timestamp: 2026-11-20T16:36:16.172Z
  sequenceNumber: 1
