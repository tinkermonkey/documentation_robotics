id: changeset-1795718494401-umhemppng
name: s3a-verify-matching
description: |-
  Verify pairs planned and built elements through one reusable matcher (`matchPlannedElements`, new `cli/src/core/changeset-matching.ts`): source file + symbol is an exact match, file alone and type/description similarity are probable. A hand-adopted source reference whose symbol is in the build counts as found (unverifiable, never missing). Missing elements and links say when a missing source reference is the cause and give the fix; adopt explains ids it does not take.

  **In scope:** `matchPlannedElements`, `changeset-verify.ts` use of it, `build-evidence.ts` symbol check, `source-reference-adoption.ts` unknown-id reasons.

  **Done when:** #1318, #1348, #1429, #1253 behave as their issues expect, with tests.
