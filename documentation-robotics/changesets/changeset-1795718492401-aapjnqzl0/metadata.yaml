id: changeset-1795718492401-aapjnqzl0
name: cli010-x1-unverifiable
description: |-
  Planned elements changeset_verify can't pair with a built one are classified by why: code that exists but the range didn't change, deletes with no source reference, file-backed data-store collections, and files in a language the index doesn't read go on the unverifiable list with a reason (not missing, not deletions not done); the agent checks them by reading code. Closes #1371, #1374, #1351, #1319.

  **In scope:** `classifyUnseenElements` in `cli/src/core/unverifiable-classification.ts`, wired into `verifyChangesetInModel`; `extraction.unindexedFiles` in the report.

  **Done when:** each of the four cases is unverifiable with a reason; the files the index skipped are listed.
