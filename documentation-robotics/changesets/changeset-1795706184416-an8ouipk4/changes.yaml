    name: Central server HTTP API
    description: "The viewer's HTTP API on the central process (127.0.0.1:<port>): GET /api/projects and every project-data route under /api/projects/:project/checkouts/:checkout/, the retired unscoped routes answering 410, the OpenAPI document (/api-spec.yaml) and its docs page (/api-docs), and /health. Every /api/ route requires the token; /health answers without it and reports more with it."
