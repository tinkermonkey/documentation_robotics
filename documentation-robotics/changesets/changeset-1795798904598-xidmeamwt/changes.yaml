    type: feature
    layer_id: product
    name: Changeset commit
    description: "MCP: changeset_commit, an ordinary write tool that lands when the user asks in the conversation: no dialog, no token. It takes changesets: [...] and lands them in order, stopping at the first refusal, with one summary of each changeset's counts and any overlaps between them. It is refused in changeset-only mode (DrBot), for verification and upgrade records, and on a validation error. Drift does not refuse it: the result gives the true count of staged changes the base overlaps and what landing did about each kind. The result names the files to commit (model files and each changeset's folder) and the branch; project_status warns when a landed changeset's folder is untracked in git. Viewer: Apply. CLI: dr changeset commit."
    attributes:
