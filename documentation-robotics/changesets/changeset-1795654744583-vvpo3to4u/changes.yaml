    id: 1c4924a5-d71f-46af-add6-1889c7306da9
    path: application.applicationfunction.stdio-client-close
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: StdioClient close
    source_reference: *a3
    metadata: *a4
    description: "Close the connection: write a shutdown notification (a write the analyzer can no longer read fails later, on stdin's error listener, and is ignored), fail the waiting requests with 'Client closed', drop the process's listeners, end stdin and send SIGTERM, then SIGKILL after a second if it is still running."
  timestamp: 2026-11-26T00:59:33.543Z
