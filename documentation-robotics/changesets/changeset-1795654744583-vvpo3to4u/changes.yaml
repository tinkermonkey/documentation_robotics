- type: update
  elementId: application.applicationfunction.stdio-client-spawn
  layerName: application
  before:
    id: d37dcf01-69d8-4a0a-95d3-9b4ee2d2e41f
    path: application.applicationfunction.stdio-client-spawn
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: StdioClient spawn
    description: Spawn an analyzer process
    source_reference: &a1
      provenance: extracted
      locations:
        - file: cli/src/analyzers/stdio-client.ts
          symbol: StdioClient.spawn
    metadata: &a2
      created_at: 2026-11-20T15:05:21.254Z
      updated_at: 2026-11-20T15:05:21.254Z
      version: 1
  after:
    id: d37dcf01-69d8-4a0a-95d3-9b4ee2d2e41f
    path: application.applicationfunction.stdio-client-spawn
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: StdioClient spawn
    description: "Spawn an analyzer process and listen to it: JSON-RPC lines on stdout settle the pending requests, stderr is logged, and the process's exit or error fails what is still waiting. An error on its stdin (EPIPE, when a write reaches an analyzer that has exited) fails the waiting requests while the client still runs that process, and is ignored after close() or once another process is spawned, so it is never thrown."
    source_reference: *a1
    metadata: *a2
  timestamp: 2026-11-26T00:59:33.520Z
