    layer_id: application
    name: migrateInterfaceProtocols
    description: "The 0.15.0 -> 0.16.0 migration step: rewrites each application interface in the model's application layer files with migratedInterfaceAttributes, and updates the loaded model to match. Returns the files written, the element ids changed (by path) and any errors. Not stamp-only, so migrationKind reports model."
