    path: application.applicationfunction.migrated-interface-attributes
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: migratedInterfaceAttributes
    description: "An application interface's attributes as spec 0.16.0 has them: protocol REST or HTTPS becomes HTTP, and interfaceType is set where the old protocol value says it (api for REST, gRPC, GraphQL, SOAP and WebSocket; message-channel for AMQP; none for HTTP or HTTPS, which may also serve pages). An interfaceType already set is kept. Null when nothing changes, so running it again changes nothing."
    source_reference:
      provenance: manual
      locations:
        - file: cli/src/core/interface-protocol.ts
          symbol: migratedInterfaceAttributes
    metadata:
      created_at: 2026-11-26T00:59:19.289Z
