- type: update
  elementId: product.feature.model-upgrade
  layerName: product
  before:
    id: 070a96d6-d702-43c6-8e3c-d025813127b7
    path: product.feature.model-upgrade
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Model upgrade
    description: "MCP: project_upgrade, previews the migration unless apply is set (from a rehearsal on a copy: the model files it would write, the values it would derive, what it would leave empty). It reports each per-project integration installed (.claude/, .github/): whether an older dr installed it and what its upgrade would change (the edited files it would replace named), and for Claude Code which installed files the dr plugin also carries and which it doesn't; upgradeIntegrations with apply upgrades the ones an older dr installed, as dr upgrade does, even when the model is already current. CLI: dr upgrade, which also brings installed integration files up to date unless --model-only, and names its drop record by the dr changeset show call that reads it. Both name the active-changeset marker left in its old place (documentation-robotics/changesets/.active) in their plan (project_upgrade at the top level, legacyMarker, with a next line), and remove it when applied: when the checkout has no marker in .dr/, the changeset it names becomes active only if it is still staged, else nothing is made active and the stale id is said. The preview's migration.kind is manifest-only when the migration changes nothing but the spec version in manifest.yaml, and says so plainly (#1435). relayout: true (dr upgrade --relayout) lays out model files an earlier dr wrote (long strings folded at 80 columns) in dr's layout, data unchanged, as a previewed step of its own, also on a model already on this spec; without it the result only counts them, so later landings carry only their own changes once it is run (#1439). A model file whose data does not change keeps its bytes, and documentation-robotics/ is listed in .prettierignore when the project uses prettier."
    attributes: &a5
      priority: high
      status: delivered
      documentation: "MCP: project_upgrade (cli/src/mcp/tools/project-tools.ts), previews the migration unless apply is set; leaves installed integrations alone and says when a project still has them. CLI: dr upgrade (cli/src/commands/upgrade.ts), which also brings installed integration files up to date. Model writes skip unchanged files (writeLayer, cli/src/core/model.ts). Issues #1246, #1165, #1168."
    source_reference: &a6
      provenance: manual
      locations:
        - file: cli/src/commands/upgrade.ts
    metadata: &a7
      created_at: 2026-11-09T21:54:58.555Z
