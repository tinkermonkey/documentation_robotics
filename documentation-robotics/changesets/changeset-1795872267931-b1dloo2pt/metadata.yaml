id: changeset-1795872267931-b1dloo2pt
name: cli010-m1-overlaps
description: |-
  Compare staged changesets with each other before landing (#1209) and let a changeset declare `dependsOn` another staged one (#1292).

  **In scope:** a `changeset_overlaps` tool and core module that list each element or link two staged changesets both change, with the drift report's reasons, suggest a landing order, and for changes that cannot both land as they are show what a combined change needs; `changeset_commit` with `changesets: [...]` uses the same logic. `dependsOn` on a changeset: writes and reads resolve elements staged in the dependency, landing is refused until the dependency landed (or lands first in the same call), discarding a dependency warns about its dependents.

  **Done when:** the agent decides every merge (nothing merges automatically); targeted tests pass; plan landed with the PR.
