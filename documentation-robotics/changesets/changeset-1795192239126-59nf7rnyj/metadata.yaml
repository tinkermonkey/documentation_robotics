id: changeset-1795192239126-59nf7rnyj
name: brief-sections-fit-one-response
description: "changeset_brief's sections return compact forms in which a long
  list comes a page at a time: every list reports its true total, how many items
  the answer holds and the call for the next page, so no limit leaves an answer
  looking complete when it is not. Page sizes default to what keeps the answer
  near a 40 KB target, which the caller can change (targetBytes) or replace with
  a fixed limit; detail: \"full\" with sections returns those sections in full
  at once. changeset_impact counts everything it reaches and pages what it
  lists. Intent traces a part through the whole that composes it, counts types
  with no catalog route to intent apart from untraced, and explains an empty
  intent. Done: on a 2,364-element changeset the default brief and the filtered
  calls of #1183 and #1232 each come back near 40 KB with true totals; for every
  list that can be shortened, a test shows the total is right and the pages
  together equal the whole set; and the acceptance criteria of #1183, #1221,
  #1231 and #1232 are met."
