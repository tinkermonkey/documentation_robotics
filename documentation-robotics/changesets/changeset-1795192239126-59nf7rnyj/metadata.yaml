id: changeset-1795192239126-59nf7rnyj
name: brief-sections-fit-one-response
description: "changeset_brief's sections return compact forms in which every
  list in an answer is the same page: the answer's page gives each list's true
  total, how many items it holds and the next offset, so no limit leaves an
  answer looking complete when it is not. The page is sized to a 40 KB target
  the caller can change (targetBytes) or replace with a fixed limit; detail:
  \"full\" with sections returns those sections in full at once.
  changeset_impact counts everything it reaches and pages what it lists. Intent
  traces a part through the whole that composes it and an element through what
  it realizes (hubs included, the maintainer's ruling of 2026-11-20), names its
  walk's bounds and what the hub rule leaves untraced, counts types with no
  catalog route to intent apart from untraced, and explains an empty intent.
  Done: on a 2,364-element changeset the default brief and the filtered calls of
  #1183 and #1232 each come back near 40 KB with true totals; for every list
  that can be shortened, a test shows the total is right and the pages together
  equal the whole set; and the acceptance criteria of #1183, #1221, #1231 and
  #1232 are met."
