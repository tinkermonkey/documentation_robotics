    name: A limit never hides part of an answer
    description: "A count or size limit in a changeset_brief or changeset_impact
      answer is a default the caller can change, never a silent cut-off. A list
      too long for one tool result comes a page at a time, with its true total,
      how many items the answer holds and the call for the next page; counts and
      summaries are over the whole list, not the page. No answer reads as
      complete when it is not (#1183, #1232)."
