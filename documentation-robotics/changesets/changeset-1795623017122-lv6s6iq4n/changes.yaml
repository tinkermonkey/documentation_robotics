- type: update
  elementId: product.feature.extraction-triage-by-rule
  layerName: product
  before:
    id: 2c5c136e-48cf-4365-b756-9b1089dd00a1
    path: product.feature.extraction-triage-by-rule
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Extraction triage by rule
    description: "MCP: codebase_extract. A run returns its undecided cards as groups with a decision count; decide takes decisions in bulk by a stated rule (previewed with a sample), stages or rejects what it covers, and keep: true records the rule in documentation-robotics/extraction-rules.yaml for every later run and checkout."
    attributes:
      priority: high
      status: delivered
      documentation: "MCP: codebase_extract. Each card carries facts read from the code: visibility, whether it is nested in another function, and the element its class or file already has. A run with more cards than a page answers with groups (folder and file, kind and visibility, folders no element names, functions many services share) and the number of decisions needed; view filters and pages the cards. decide: [{where | card, as: layer.type | none, reason, keep}] decides cards by rule; with preview: true it returns each rule's count and a sample and changes nothing. Kept rules are applied before cards are made, in this order: an element that names the symbol, a decision on that one card, a rule that says none, Tier 0, a rule that names a type. A since run lists the symbols its range changed and counts the rest; with a plan active it lists planned elements with no as-built candidate. reject and decide take their items from a JSON file (file) and answer with counts and the items that need attention."
    metadata: &a1
      created_at: 2026-11-20T16:56:25.762Z
      updated_at: 2026-11-20T16:56:25.762Z
      version: 1
  after:
    id: 2c5c136e-48cf-4365-b756-9b1089dd00a1
    path: product.feature.extraction-triage-by-rule
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Extraction triage by rule
    description: "MCP: codebase_extract. A run returns its undecided cards as groups with a decision count; decide takes decisions in bulk by a stated rule (previewed with a sample), stages or rejects what it covers, and keep: true records the rule in documentation-robotics/extraction-rules.yaml for every later run and checkout."
    attributes:
      priority: high
      status: delivered
      documentation: "MCP: codebase_extract. Each card carries facts read from the code: visibility, whether it is nested in another function, and the element its class or file already has. A run with more cards than a page answers with groups (folder and file, kind and visibility, folders no element names, functions many services share) and the number of decisions needed; view filters and pages the cards, states a candidate list several cards share once (candidateLists), and groups them by file with groupBy. decide: [{where | card, as: layer.type | none, reason, keep, attributes, overrideTier0}] decides cards by rule; where.name matches the bare name and where.symbol the card's symbol (Class.method); a card item takes a cardId, a symbol or file#symbol of this run; attributes supply what a type requires; with preview: true it returns each rule's count and a sample and changes nothing; with view it answers with that view's page after applying. A none rule leaves a symbol Tier 0 decided as an element to Tier 0 unless it says overrideTier0, and ruleWarnings says so at the top with counts. Kept rules are applied before cards are made, in this order: an element that names the symbol, a decision on that one card, a rule that says none, Tier 0, a rule that names a type. A since run lists the symbols its range changed and counts the rest; with a plan active it lists planned elements with no as-built candidate and marks cards the plan's elements name (planned). reject records what is not an element locally (it says so), skips cards an element now names, applies after the call's decide items, takes except on a files item, and with keep: true writes a rule instead; a kept decide rule that covers recorded rejections retires them; a preview of reject or clearRejected records nothing and says would-record. reject and decide take their items from a JSON file (file) and answer with counts and the items that need attention. The impacted list comes in full only when it changed since the last run."
    metadata: *a1
  timestamp: 2026-11-25T16:10:43.742Z
  sequenceNumber: 16
