name: cli09-extract-decide
description: "CLI 0.9.0, extract output and decide (#1424, #1254, #1414, #1332, #1333, #1322, #1380, #1394, #1298, #1350). A none rule no longer takes what Tier 0 decided unless it says overrideTier0, and the run warns at the top with counts; codebase_verify applies the project's rules as extraction does; decide takes required attributes, matches the Class.method symbol, and resolves file#symbol against the run; reject skips modelled symbols, applies after decide, can keep a rule, and a preview of it records nothing; views state candidate lists once and group by file; the impacted list comes once; decide can return a view; changeset_verify pages sized to about 40 KB. Done when each issue's behaviour is in the code with tests."
