    path: application.applicationfunction.ensure-cbm-ignore
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: ensureCbmIgnore
    description: Makes sure codebase-memory-mcp leaves DR's own folders ({@link DR_OWN_DIRS}
    source_reference: &a1
      provenance: extracted
      locations:
        - file: cli/src/analyzers/cbm-analyzer.ts
          symbol: ensureCbmIgnore
    metadata: &a2
      created_at: 2026-11-20T15:07:11.555Z
      updated_at: 2026-11-20T15:07:11.555Z
      version: 1
  after:
    id: 28403604-d960-4d49-a436-5a6fb28a6ff3
    path: application.applicationfunction.ensure-cbm-ignore
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: ensureCbmIgnore
    description: Makes sure codebase-memory-mcp leaves DR's own folders (documentation-robotics/, .dr/) out of the index without changing the tree as git sees it (#1300). With no .cbmignore at the codebase root, it writes one and hides it from git through the repository's local exclude (excludeFromGit), so nothing needs committing. It adds lines only to a .cbmignore that git doesn't track and that is DR's own (git-ignored, or written by DR); a .cbmignore the developer tracks or wrote is never edited, and the lines it lacks come back as missing, for the developer to add.
    source_reference: *a1
    metadata: *a2
  timestamp: 2026-11-25T16:09:06.762Z
  sequenceNumber: 13
