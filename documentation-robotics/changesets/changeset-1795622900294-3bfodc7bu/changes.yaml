    name: settleIndexCounts
    description: "The node and edge counts of an index_repository call (#1345). When CBM answered without them (status indexing, busy or pending: another process is indexing the same code), waits for that run through index_status within the run's timeout and reads the counts there. Throws when CBM reports failed, when the counts stay unreadable, or when the index holds no nodes, so the run fails and no index metadata reads as fresh."
