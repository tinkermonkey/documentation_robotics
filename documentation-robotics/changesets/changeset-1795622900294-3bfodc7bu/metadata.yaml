id: changeset-1795622900294-3bfodc7bu
name: cli09-index-freshness
description: "CLI 0.9.0 (Tool ergonomics), index tranche: #1345, #1347, #1300. An index that holds no code, or whose run could not read its counts, never reads as fresh: the CBM run fails instead of recording 0 nodes, and the freshness rule calls a 0-node index stale. codebase_extract indexes first when the index is missing or stale (or a run is in flight), within its time budget, reports that it did and how long it took, and says how to wait when the run outlasts the budget; autoIndex: false keeps the old refusal. codebase_index keeps .cbmignore out of git's view (the repository's local info/exclude) and never edits a .cbmignore the developer tracks, so a read-only run leaves the tree as git saw it. Done: unit tests beside each change, integration test for the job, skills and CHANGELOG updated."
