- type: update
  elementId: product.feature.stage-element-changes
  layerName: product
  before:
    id: ab6e7c50-5dec-4c85-9363-8c4588f30a26
    path: product.feature.stage-element-changes
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Stage element changes
    description: "MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. model_add, model_update and model_delete take a list, inline or in a JSON file, and answer summary first: counts, then the items that need attention grouped by cause (one entry per cause with its true count, items listed up to limit), and id-derivation notes once each with a count and sample ids. A re-sent element that matches what is there is unchanged, not refused, so a batch can be retried. model_add places a product workflow step after or before another, rewiring flows-to and renumbering sequence. model_update gives a hand-set source file 'manual' and adds or removes one source location with addSourceLocation / removeSourceLocation. A write aimed at a changeset that landed or is landing fails naming it, never falling through to the base model. CLI: dr add/update/delete."
    attributes:
      priority: critical
      status: delivered
      documentation: 'MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. CLI: dr add/update/delete. With no changeset active the write goes to the base model. A base write from a model that was loaded while a changeset was active, when that changeset has since stopped being staged, fails with "The change was not saved" instead of reporting success and storing nothing (#1218, cli/src/core/mutation-handler.ts). Batches (CLI 0.7.0): model_add takes elements (with relationships) and model_update takes updates, inline or in a JSON file named by file (one object holding the tool''s lists under their own names; the file must be inside the project the call addresses, links resolved). A batch returns total, counts by status and attention: only the items not written as sent, or elements written with a warning or a note, up to limit in full (default 50, failures first) and every one past that by position under its reason with what its message named (attentionNotListed), so one response accounts for every item; verbose: true returns every item (#1182, #1217). A refused model_add batch lists what each refused type requires (#1153). sourceFile without sourceProvenance gets ''manual'' with no warning over MCP (#1233). Ids: dr add, model_add and extraction derive an id from a name with one function, deriveElementId in cli/src/utils/id-generator.ts (#1225): camelCase and a digit before a capitalised word are word breaks (#1184), dots, slashes and braces are word breaks, a leading digit gets the prefix n- (#1212), and a name over 100 characters is cut with a hash. An id is derived once and never rewritten: an add is refused, naming the element, when an element of the same name sits at an id an earlier release derived for that name (earlierElementIds) or at one that differs only by hyphens; a test sweeps this repository''s model for it.'
    source_reference: &a8
      provenance: manual
      locations:
        - file: cli/src/mcp/tools/model-update.ts
    metadata: &a9
      created_at: 2026-11-09T21:54:57.057Z
      updated_at: 2026-11-09T21:54:57.057Z
      version: 1
  after:
    id: ab6e7c50-5dec-4c85-9363-8c4588f30a26
    path: product.feature.stage-element-changes
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Stage element changes
    description: "MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. model_add, model_update and model_delete take a list, inline or in a JSON file, and answer summary first: counts, then the items that need attention grouped by cause (one entry per cause with its true count, items listed up to limit), and, from model_add, id-derivation notes once each with a count and sample ids. A re-sent element that matches what is there is unchanged, not refused, so a batch can be retried. model_add places a product workflow step after or before another, rewiring flows-to and renumbering sequence. model_update gives a hand-set source file 'manual' and adds or removes one source location with addSourceLocation / removeSourceLocation. A write aimed at a changeset that landed or is landing fails naming it, never falling through to the base model. CLI: dr add/update/delete."
    attributes:
      priority: critical
      status: delivered
      documentation: 'MCP: model_add, model_update (attributePatch), model_delete; stage into the active changeset. CLI: dr add/update/delete. With no changeset active the write goes to the base model, except after a landing of the active changeset in this checkout: then it is refused until a changeset is activated or created, or changeset_deactivate is called (#1437). A base write from a model that was loaded while a changeset was active, when that changeset has since stopped being staged, fails with "The change was not saved" instead of reporting success and storing nothing (#1218, cli/src/core/mutation-handler.ts). Batches (CLI 0.7.0): model_add takes elements (with relationships) and model_update takes updates, inline or in a JSON file named by file (one object holding the tool''s lists under their own names; the file must be inside the project the call addresses, links resolved). A batch returns total, counts by status, attentionTotal and causes: the items not written as sent, or elements written with a warning or a note, grouped by cause with each cause''s true count (failures first, then the largest), listed by position up to limit across the causes (default 50, one of every cause first; limit caps the causes too, with causesTotal), and notListed counts the rest, so one response accounts for every item; verbose: true returns every item (#1182, #1217, #1295). A refused model_add batch lists what each refused type requires (#1153). sourceFile without sourceProvenance gets ''manual'' with no warning over MCP, except that model_update keeps the element''s provenance for a file it already references (#1233, #1260). Ids: dr add, model_add and extraction derive an id from a name with one function, deriveElementId in cli/src/utils/id-generator.ts (#1225): camelCase and a digit before a capitalised word are word breaks (#1184), dots, slashes and braces are word breaks, a leading digit gets the prefix n- (#1212), and a name over 100 characters is cut with a hash. An id is derived once and never rewritten: an add is refused, naming the element, when an element of the same name sits at an id an earlier release derived for that name (earlierElementIds) or at one that differs only by hyphens; a test sweeps this repository''s model for it.'
