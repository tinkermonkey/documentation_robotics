      documentation: "MCP: codebase_extract. Each card carries facts read from the code: visibility, whether it is nested in another function, and, for a member, the element its class already has (owner). A run with more cards than a page answers with groups (folder and file, kind and visibility, folders no element names, functions many services share) and the number of decisions needed; view filters and pages the cards, states a candidate list several cards share once (candidateLists), and groups them by file with groupBy. decide: [{where | card, as: layer.type | none, reason, keep, attributes, overrideTier0}] decides cards by rule; where.name matches the bare name and where.symbol the card's symbol (Class.method); a card item takes a cardId, a symbol or file#symbol of this run; attributes supply what a type requires; with preview: true it returns each rule's count and a sample and changes nothing; with view it answers with that view's page after applying. A none rule leaves a symbol Tier 0 decided as an element to Tier 0 unless it says overrideTier0, and ruleWarnings says so at the top with counts. Kept rules are applied before cards are made, in this order: an element that names the symbol, a decision on that one card, a rule that says none, Tier 0, a rule that names a type. A since run lists the symbols its range changed and counts the rest; with a plan active it lists the planned elements with no as-built element yet, with the cards that could be them (planCoverage), and marks cards the plan's elements name (planned). reject records what is not an element locally (it says so), skips cards an element now names, applies after the call's decide items, takes except on a files item, and with keep: true writes a rule instead; a kept decide rule that covers recorded rejections retires them; a preview of reject or clearRejected records nothing and says would-record. reject and decide take their items from a JSON file (file) and answer with counts and the items that nee