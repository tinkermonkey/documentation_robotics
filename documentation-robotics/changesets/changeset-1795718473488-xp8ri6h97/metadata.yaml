description: "Tier 0 recognises plain CommonJS and Electron code (#1320). **In scope:** a Tier-0 `visibility` condition so a function not exported by its module is not an element; `ipcMain.handle/on('ns:action')` registrations as interface operations (hand-read from text, like hand-routed routes); `changeset_verify` says when the as-built side was staged by hand from extraction's own cards instead of warning it is thin. **Not in scope:** a module file as an element (a file is a source link, not an element: needs the maintainer). **Done when:** targeted tests pass and extraction on a CommonJS/Electron fixture decides its private functions and ipc handlers."
