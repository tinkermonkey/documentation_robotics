- type: update
  elementId: product.feature.model-upgrade
  layerName: product
  before:
    id: 070a96d6-d702-43c6-8e3c-d025813127b7
    path: product.feature.model-upgrade
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Model upgrade
    description: "MCP: project_upgrade, previews the migration unless apply is set (from a rehearsal on a copy: the model files it would write, the values it would derive, what it would leave empty). It reports each per-project integration installed (.claude/, .github/): what its upgrade would change and, for Claude Code, which installed files the dr plugin also carries and which it doesn't; upgradeIntegrations with apply upgrades them, even when the model is already current. CLI: dr upgrade, which also brings installed integration files up to date unless --model-only, and names its drop record by the dr changeset show call that reads it. A model file whose data does not change keeps its bytes, and documentation-robotics/ is listed in .prettierignore when the project uses prettier."
    attributes: &a39
      priority: high
      status: delivered
      documentation: "MCP: project_upgrade (cli/src/mcp/tools/project-tools.ts), previews the migration unless apply is set; leaves installed integrations alone and says when a project still has them. CLI: dr upgrade (cli/src/commands/upgrade.ts), which also brings installed integration files up to date. Model writes skip unchanged files (writeLayer, cli/src/core/model.ts). Issues #1246, #1165, #1168."
    source_reference: &a40
      provenance: manual
      locations:
        - file: cli/src/commands/upgrade.ts
    metadata: &a41
      created_at: 2026-11-09T21:54:58.555Z
      updated_at: 2026-11-09T21:54:58.555Z
      version: 1
  after:
    id: 070a96d6-d702-43c6-8e3c-d025813127b7
    path: product.feature.model-upgrade
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Model upgrade
    description: "MCP: project_upgrade, previews the migration unless apply is set (from a rehearsal on a copy: the model files it would write, the values it would derive, what it would leave empty). It reports each per-project integration installed (.claude/, .github/): whether an older dr installed it and what its upgrade would change (the edited files it would replace named), and for Claude Code which installed files the dr plugin also carries and which it doesn't; upgradeIntegrations with apply upgrades the ones an older dr installed, as dr upgrade does, even when the model is already current. CLI: dr upgrade, which also brings installed integration files up to date unless --model-only, and names its drop record by the dr changeset show call that reads it. Both name the active-changeset marker left in its old place (documentation-robotics/changesets/.active) in their plan, and remove it when applied, moving its changeset to .dr/ when the checkout has no marker there. A model file whose data does not change keeps its bytes, and documentation-robotics/ is listed in .prettierignore when the project uses prettier."
    attributes: *a39
    source_reference: *a40
    metadata: *a41
  timestamp: 2026-11-25T17:12:40.805Z
