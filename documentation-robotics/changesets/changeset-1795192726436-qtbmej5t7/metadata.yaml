id: changeset-1795192726436-qtbmej5t7
name: project-status-names-drift
description: "project_status says what drifted and what to do next:
  per-changeset base drift with counts and whether landing needs force (#1227);
  code drift counted from the code commit the last as-built landing read, with
  the rule in use, the plans landed since and what clears it (#1228, #1195);
  changed files no element references; and a dr server older than the installed
  CLI. Done when an agent that reads one project_status answer can say, for each
  drift state, what changed, whether a landing will be refused and which tool to
  call next."
