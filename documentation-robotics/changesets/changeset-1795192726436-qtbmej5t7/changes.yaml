    path: product.feature.project-status
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Project status
    description: "MCP: project_status. Where this repo stands with DR: model
      present, spec version against the CLI, active and staged changesets, code
      index present and fresh, code changed since the model was last reconciled
      with it, viewer running, Tier 1 state, and the suggested next step. The
      server instructions tell the agent to call it first."
    attributes:
      priority: critical
      status: delivered
      documentation: "MCP: project_status (cli/src/mcp/tools/project-status.ts,
        sections in project-status-collectors.ts). Where this repo stands with
        DR: model present, spec version against the CLI, active and staged
        changesets, code index present and fresh (and any indexing run in
        flight), code drift, viewer running, Tier 1 state, and nextStep, a
        sentence and the tool to call. Code drift is counted from the last
        as-built landing; a model with none counts from its last commit that is
        not a spec migration. Reads local files and git only. The server
        instructions tell the agent to call it first."
    source_reference: &a1
      provenance: manual
      locations:
        - file: cli/src/mcp/tools/project-status.ts
    metadata: &a2
      created_at: 2026-11-09T22:04:38.150Z
      updated_at: 2026-11-09T22:04:38.150Z
      version: 1
  after:
    id: e3de59af-bd7a-44b4-ad8c-abe777fbd163
    path: product.feature.project-status
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Project status
    description: "MCP: project_status. Where this repo stands with DR: model
      present, spec version against the CLI, whether the dr server answering is
      older than the CLI installed now, active and staged changesets (with what
      moved in the base under each and whether landing needs force), code index
      present and fresh, code changed since the model was last reconciled with
      it, viewer running, Tier 1 state, and the suggested next step. The server
      instructions tell the agent to call it first."
    attributes:
      priority: critical
      status: delivered
      documentation: "MCP: project_status (cli/src/mcp/tools/project-status.ts,
        sections in project-status-collectors.ts). Where this repo stands with
        DR: model present, spec version against the CLI, the dr server's version
        against the installed CLI, active and staged changesets, code index
        present and fresh (and any indexing run in flight), code drift, viewer
        running, Tier 1 state, and nextStep, a sentence and the tool to call.
        Each drift state says what changed, whether a landing is refused and
        which tool comes next, without a second call. A staged changeset whose
        base changed carries drift: the state and whether it blocks (read from
        core/changeset-drift-status.ts, never re-derived), how many base
        elements and relationships changed, how many of its own changes they
        overlap, landing (refused-without-force, allowed, allowed-with-warning)
        and the changeset_brief call that lists the rest. Code drift is counted
        from the code commit the last as-built landing's extraction read
        (countedFrom), or from the commit that brought in that landing when the
        repository lacks it; a model with no as-built landing counts from its
        last commit that is not a spec migration. rule says which applies,
        landedSince names the changesets landed since (none moves the baseline),
        and unreferenced counts changed files no element references, which the
        check cannot see. server is stale when the CLI on disk has another
        version than the running process or its files were written after the
        process started: the fix is a restart of the session's dr server, not an
        update. Reads local files and git only. The server instructions tell the
        agent to call it first."
    source_reference: *a1
    metadata: *a2
