    type: feature
    layer_id: product
    name: Commit hook notes
    description: "dr init, dr upgrade and their MCP tools say when a pre-commit hook
      would get in the way of committing dr's files: a prettier hook that still
      receives documentation-robotics/, or a check-added-large-files hook that
      would refuse a large changes.yaml. Each note gives the exclude line to
      add; the hook configuration is never edited."
    attributes:
