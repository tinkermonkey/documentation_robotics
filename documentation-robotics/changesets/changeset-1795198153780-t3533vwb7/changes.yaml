- type: add
  elementId: motivation.requirement.an-upgrade-changes-only-what-it-says
  layerName: motivation
  after:
    id: 04a8d749-4b94-43f8-9117-b2d9c525be78
    path: motivation.requirement.an-upgrade-changes-only-what-it-says
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: An upgrade changes only what it says
    description: Before it writes, an upgrade names every file it would change, in
      the model and outside it (spec reference, integration files, reports,
      ignore files, git's index), with every list's true total and a way to see
      all of it. It writes nothing it did not name, and a model file whose data
      does not change keeps its bytes, so an upgrade that only stamps the spec
      version changes only the manifest.
    attributes:
      requirementType: functional
      priority: high
      documentation: "Issues #1246 and #1165. Verified when a version-stamp upgrade of
        a model in prettier's layout changes only manifest.yaml, and the dry run
        on a copy names the same model files the real run writes."
    metadata:
      created_at: 2026-11-20T18:10:01.918Z
      updated_at: 2026-11-20T18:10:01.918Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 0
- type: add
  elementId: motivation.requirement.derived-values-are-reviewed-before-they-reach-the-model
  layerName: motivation
  after:
    id: 9562292e-2589-4351-90f4-12422b54c9cb
    path: motivation.requirement.derived-values-are-reviewed-before-they-reach-the-model
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Derived values are reviewed before they reach the model
    description: When a new spec version requires attributes the model leaves empty,
      values that follow plainly from the element itself may be derived, but
      they go into a staged changeset for the user to review and land, never
      into the base model directly. What has no such value is listed per
      element.
    attributes:
      requirementType: functional
      priority: high
      documentation: "Issue #1166, maintainer decision 2026-11-18. Verified when an
        upgrade leaves the base model's element files unchanged and stages the
        derived values in upgrade-fills-<spec version>, and a second run stages
        none of them again."
    metadata:
      created_at: 2026-11-20T18:10:01.964Z
      updated_at: 2026-11-20T18:10:01.964Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 1
- type: add
  elementId: motivation.requirement.a-decision-about-tracked-files-is-the-users
  layerName: motivation
  after:
    id: e0d9e0fb-956e-4580-9d72-d7c29c49701b
    path: motivation.requirement.a-decision-about-tracked-files-is-the-users
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A decision about tracked files is the user's
    description: When git tracks files that an ignore rule would cover, the tool
      does not add the rule over them. It puts the choice to the person
      (untrack, keep tracked, or leave as is) with what each choice changes, and
      acts only on their answer.
    attributes:
      requirementType: functional
      priority: high
      documentation: "Issue #1185. Verified when dr upgrade and project_upgrade leave
        .gitignore and the index alone without a choice, and after untrack the
        next git add -A of the upgrade succeeds."
    metadata:
      created_at: 2026-11-20T18:10:01.964Z
      updated_at: 2026-11-20T18:10:01.964Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 2
- type: add
  elementId: product.feature.upgrade-fills
  layerName: product
  after:
    id: 6db99cc3-d10f-427b-a823-9fc284a55f64
    path: product.feature.upgrade-fills
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Upgrade fills
    description: dr upgrade and project_upgrade derive values for required
      attributes the new spec leaves empty, only where the element itself gives
      them (operationId from the name, summary from the description, title,
      label, description), and stage them in a plan changeset,
      upgrade-fills-<spec version>, one update per element with the rule in its
      origin. Nothing is written to the base model. A second run stages nothing
      an unlanded fills changeset already holds.
    attributes:
      priority: high
      status: delivered
      documentation: "cli/src/core/upgrade-fills.ts; called from upgradeModel
        (cli/src/core/model-upgrade.ts). Issue #1166."
    metadata:
      created_at: 2026-11-20T18:10:01.964Z
      updated_at: 2026-11-20T18:10:01.964Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 3
- type: add
  elementId: product.feature.upgrade-plan-outside-the-model
  layerName: product
  after:
    id: 57a14f8e-f266-486f-bf9b-fa5e69311379
    path: product.feature.upgrade-plan-outside-the-model
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Upgrade plan outside the model
    description: "The upgrade plan and dry run list every file the run touches
      outside documentation-robotics/model/, by group: spec reference, each
      installed integration's files, layer reports, .gitignore and
      .prettierignore lines, git's index. The dry run rehearses the model step
      on a copy and names the model files it would write. --model-only
      (modelOnly) leaves the rest alone. Leftovers of older integration layouts
      (names an earlier dr installed) are listed and removed only when chosen.
      Long lists give their totals; --full (detail: full) lists all."
    attributes:
      priority: high
      status: delivered
      documentation: "cli/src/core/upgrade-outside-model.ts, upgrade-rehearsal.ts,
        cli/src/integrations/shipped-entries.ts. Issue #1165."
    metadata:
      created_at: 2026-11-20T18:10:01.969Z
      updated_at: 2026-11-20T18:10:01.969Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 4
- type: add
  elementId: product.feature.tracked-dot-dr-decision
  layerName: product
  after:
    id: 4dbd63f2-d192-4956-aa64-b08fe6faf705
    path: product.feature.tracked-dot-dr-decision
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Tracked dot-dr decision
    description: When git tracks files under .dr/, dr upgrade and project_upgrade
      add no ignore rule over them. The choice (untrack, keep-tracked, skip) is
      asked in a terminal, taken from --dot-dr, or returned by project_upgrade
      as gitignore.options and taken back as gitignore. Each option names the
      lines it writes and removes and the files it takes out of git's index. An
      existing .dr rule or comment is replaced, not added to.
    attributes:
      priority: high
      status: delivered
      documentation: "cli/src/core/dot-dr-ignore.ts. Issue #1185."
    metadata:
      created_at: 2026-11-20T18:10:01.969Z
      updated_at: 2026-11-20T18:10:01.969Z
      version: 1
  timestamp: 2026-11-20T18:10:01.987Z
  sequenceNumber: 5
