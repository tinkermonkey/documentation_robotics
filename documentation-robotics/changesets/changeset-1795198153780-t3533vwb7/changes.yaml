      status: delivered
      documentation: cli/src/core/commit-hooks.ts. From the tranche 9 brief and the
        maintainer's ruling of 2026-11-20 on prettier and the DR folder.
    metadata:
      created_at: 2026-11-20T18:10:01.969Z
      updated_at: 2026-11-20T18:10:01.969Z
