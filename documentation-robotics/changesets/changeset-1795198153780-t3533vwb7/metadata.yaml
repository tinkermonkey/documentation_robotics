id: changeset-1795198153780-t3533vwb7
name: upgrade-says-what-it-touches
description: "dr upgrade and project_upgrade change only what they say. A model
  file whose data is unchanged is never rewritten, and documentation-robotics/
  is listed in .prettierignore (#1246). The plan and dry run list every file
  outside the model, grouped (integrations, reports, ignore files); --model-only
  skips them; leftovers of older integration layouts are listed and removed only
  when chosen (#1165). Clear derivations for newly required attributes
  (operationId from the name, and the like) are staged in a changeset,
  upgrade-fills-<spec version>, for review, never written to the base model
  (#1166). dr validate says in one line when the spec reference is not installed
  (#1168). Files git tracks under .dr/ become a decision (untrack, keep tracked,
  skip): asked in the CLI, returned by project_upgrade (#1185). init and upgrade
  say when a commit hook would get in the way of committing dr's files. Long
  lists give their totals and a way to see all. Done when an upgrade that only
  stamps the version changes only the manifest."
