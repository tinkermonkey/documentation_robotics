- type: update
  elementId: product.feature.model-upgrade
  layerName: product
  before:
    id: 070a96d6-d702-43c6-8e3c-d025813127b7
    path: product.feature.model-upgrade
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Model upgrade
    description: "MCP: project_upgrade, previews the migration unless apply is set (from a rehearsal on a copy: the model files it would write, the values it would derive, what it would leave empty); leaves installed integrations alone. CLI: dr upgrade, which also brings installed integration files up to date unless --model-only. A model file whose data does not change keeps its bytes, and documentation-robotics/ is listed in .prettierignore when the project uses prettier. The preview's migration.kind is manifest-only when the migration changes nothing but the spec version in manifest.yaml, and says so plainly (#1435). Model files an earlier dr wrote (long strings folded at 80 columns) are re-laid out in dr's layout as a previewed step of their own, also on a model already on this spec, so later landings carry only their own changes (#1439)."
    attributes: &a15
      priority: high
      status: delivered
      documentation: "MCP: project_upgrade (cli/src/mcp/tools/project-tools.ts), previews the migration unless apply is set; leaves installed integrations alone and says when a project still has them. CLI: dr upgrade (cli/src/commands/upgrade.ts), which also brings installed integration files up to date. Model writes skip unchanged files (writeLayer, cli/src/core/model.ts). Issues #1246, #1165, #1168."
    source_reference: &a16
      provenance: manual
      locations:
