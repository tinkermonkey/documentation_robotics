    name: Declared-spec check
    description: 'relationship_add, model_add, model_update, model_validate and changeset_commit_preview check a type or relationship against the spec the model''s manifest declares, not only the CLI''s own catalog. One that exists only in a newer spec is refused: "<type or triple> is not in spec 0.13.0, the model''s version; it exists from 0.14.0. Run project_upgrade first." A model that already holds one still loads and reads; model_validate names its element ids, and a landing counts it with the errors already in the base. A model on a spec newer than dr''s is refused nothing extra, and a type dr doesn''t know is reported as unknown here, with the update to make. The versions come from a table generated from the released spec catalogs (0.8.0 on) and committed with the CLI (#1411).'
