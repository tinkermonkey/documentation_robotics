        spec_node_id: product.feature
        type: feature
        layer_id: product
        name: Commit confirmation token
        description:
          "MCP: a preview call of changeset_commit returns the landing
          summary (counts, drift, validation) and a token bound to the
          changeset's confirmed state. Claude Code shows the summary, and the
          person approves the commit call in Claude Code's permission prompt,
          which anthropic/requiresUserInteraction forces. changeset_commit
          accepts the token as the confirmation from Claude Code and refuses it
          when the changeset or base model changed since the preview. Other
          clients still confirm in the elicitation dialog."
        attributes:
          priority: high
          status: planned
          size: s
          documentation:
            "Token: an HMAC over the confirmedState fingerprint (changeset
            revision, base snapshot, force flag), keyed per server process,
            valid for one commit and a few minutes. Accepted only from clients
            identified as Claude Code by clientInfo, because only those force
            the permission prompt. Open checks before building: whether Claude
            Code still forces the prompt under bypassPermissions or
            --dangerously-skip-permissions, and whether the server can tell
            which mode it is in; if it can't, the token path must not be the
            only gate in those modes."
