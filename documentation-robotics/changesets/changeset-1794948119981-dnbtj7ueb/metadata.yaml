id: changeset-1794948119981-dnbtj7ueb
name: land-from-clients-without-dialogs
description: "Let a person land a changeset from a client that can't show MCP
  elicitation dialogs (the Claude desktop Code tab runs Claude Code in print
  mode, which declines them automatically). A preview step returns the
  confirmation summary and a token bound to the changeset's state;
  changeset_commit accepts the token as the confirmation from clients that force
  a permission prompt (Claude Code, via anthropic/requiresUserInteraction) and
  refuses on mismatch; elicitation stays the gate everywhere else. An instant
  decline is reported as 'the dialog could not be shown', pointing to the
  viewer's Apply or an interactive session. Done: a changeset lands from the
  desktop Code tab after one approval, and no client can land one without a
  person."
