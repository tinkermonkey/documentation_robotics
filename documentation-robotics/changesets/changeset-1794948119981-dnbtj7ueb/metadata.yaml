          size: s
          documentation:
            "Token: an HMAC, keyed per server process, over the changeset id,
            force, a 10-minute expiry and the confirmedState fingerprint (staged
            changes and base model); good once. The preview tool is not flagged,
            so landing takes one approval. Permission modes (checked 2026-11-17
            against the Claude Code docs): the prompt is forced in acceptEdits,
            auto and bypassPermissions (so --dangerously-skip-permissions too),
            allow rules and PreToolUse hooks don't skip it, and dontAsk,
            --permission-prompt-tool and runs without a prompt callback deny the
            call. The server can't see the mode and doesn't need to."
