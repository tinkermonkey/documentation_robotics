- type: add
  elementId: motivation.assessment.print-mode-declines-elicitation
  layerName: motivation
  after:
    id: 372878ce-87fe-4f07-bda1-6eaf12c6ab2e
    path: motivation.assessment.print-mode-declines-elicitation
    spec_node_id: motivation.assessment
    type: assessment
    layer_id: motivation
    name: Print mode declines elicitation
    description:
      The Claude desktop app's Code tab runs Claude Code in print mode,
      which declines every MCP elicitation request at once while still
      advertising the form capability, so changeset_commit's dialog never
      reaches the person.
    attributes:
      assessmentType: gap
      documentation:
        "Found 2026-11-17 landing context-studio's restore-upgrade-drops:
        changeset_commit was declined twice although the person approved the
        permission card. The MCP log
        (~/Library/Caches/claude-cli-nodejs/<project>/mcp-logs-plugin-dr-dr/)
        records 'Elicitation request received in print mode' and the decline in
        the same second. The client advertises capabilities.elicitation.form, so
        the server cannot tell beforehand."
    metadata:
      created_at: 2026-11-17T20:42:52.452Z
      updated_at: 2026-11-17T20:42:52.452Z
      version: 1
  timestamp: 2026-11-17T20:42:52.479Z
  sequenceNumber: 0
- type: add
  elementId: motivation.requirement.a-refused-landing-says-why
  layerName: motivation
  after:
    id: 829c1e18-29ab-4838-b6e0-9eab0ebf0a22
    path: motivation.requirement.a-refused-landing-says-why
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A refused landing says why
    description:
      "When changeset_commit does not land a changeset, it says which of
      these happened: the person declined, the dialog could not be shown, or the
      model drifted. It names the way forward for each: the viewer's Apply, an
      interactive session, or force."
    attributes:
      requirementType: functional
      priority: high
      documentation:
        "A decline that arrives within about a second of the request is
        reported as 'the confirmation dialog could not be shown', not as the
        person declining. Acceptance: in the desktop Code tab an
        elicitation-only commit reports that the dialog could not be shown and
        points to the viewer's Apply; a person's real decline is still reported
        as declined."
    metadata:
      created_at: 2026-11-17T20:42:52.468Z
      updated_at: 2026-11-17T20:42:52.468Z
      version: 1
  timestamp: 2026-11-17T20:42:52.479Z
  sequenceNumber: 1
- type: add
  elementId: product.feature.commit-confirmation-token
  layerName: product
  after:
    id: 024c8984-3141-4664-848d-87f229d7a22a
    path: product.feature.commit-confirmation-token
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Commit confirmation token
    description: "MCP: changeset_commit_preview checks a changeset for landing
      without writing anything and returns the landing summary (intent, counts,
      layers, drift, validation) with a token bound to the changeset's confirmed
      state. Claude Code shows the summary, and the person approves the
      changeset_commit call carrying the token in Claude Code's permission
      prompt, which anthropic/requiresUserInteraction forces. changeset_commit
      accepts the token only from Claude Code (v2.1.199 or later) and refuses it
      once used, expired, or when the changeset, base model or force changed
      since the preview. Other clients still confirm in the elicitation dialog."
    attributes:
      priority: high
      status: developing
      size: s
      documentation:
        "Token: an HMAC, keyed per server process, over the changeset id,
        force, a 10-minute expiry and the confirmedState fingerprint (staged
        changes and base model); good once. The preview tool is not flagged, so
        landing takes one approval. Permission modes (checked 2026-11-17 against
        the Claude Code docs): the prompt is forced in acceptEdits, auto and
        bypassPermissions (so --dangerously-skip-permissions too), allow rules
        and PreToolUse hooks don't skip it, and dontAsk,
        --permission-prompt-tool and runs without a prompt callback deny the
        call. The server can't see the mode and doesn't need to."
    metadata:
      created_at: 2026-11-17T20:42:52.469Z
      updated_at: 2026-11-17T20:42:52.469Z
      version: 1
  timestamp: 2026-11-17T21:00:57.385Z
  sequenceNumber: 2
