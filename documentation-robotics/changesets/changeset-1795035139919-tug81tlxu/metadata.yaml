        name: Only an overlapping base change blocks a landing
        description: "A staged changeset is refused for drift only when the base
          overlaps it: an element it updates or deletes changed or was removed,
          an element at an end of a relationship it adds or deletes changed or
          was removed, the base already has what it adds, or lacks what it
          deletes. Any other change to the base does not block it."
        attributes:
          requirementType: functional
          priority: high
          documentation:
            "Acceptance: with a base index recorded, a changeset staged
            before another one landed commits without force when the other
            changed or removed only elements and relationships it does not edit
            or link to; it is still refused when the other changed an element it
            updates, deletes or links to, or removed an element it updates.
            Without a base index a changed hash still blocks, since the two
            cannot be told apart. The CLI, changeset_commit, the viewer's Apply,
            project_status and the viewer API's drift field all read the one
            rule (StagingAreaManager.detectDrift)."
