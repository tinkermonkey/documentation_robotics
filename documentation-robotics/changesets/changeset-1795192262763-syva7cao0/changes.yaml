- type: add
  elementId: product.feature.viewer-lifecycle
  layerName: product
  after:
    id: 739052bf-20b9-4144-acba-85486be6c3e4
    path: product.feature.viewer-lifecycle
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Viewer lifecycle
    description: "CLI: dr visualize --list shows every running viewer (project,
      port, pid, CLI version, started at) and dr visualize --stop [project |
      --all] stops them, including viewers the registry lost. MCP: review_open
      replaces an older viewer it started and says when another viewer is older;
      restart: true replaces it. A viewer review_open starts exits after 24
      hours with no browser tab and no request; any viewer exits when its
      project's documentation-robotics/ folder is gone."
    attributes:
      priority: high
      status: planned
    metadata:
      created_at: 2026-11-20T16:31:40.294Z
      updated_at: 2026-11-20T16:31:40.294Z
      version: 1
  timestamp: 2026-11-20T16:31:40.334Z
  sequenceNumber: 0
