    path: product.feature.changeset-overlay-in-the-viewer
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Changeset overlay in the viewer
    description: "MCP: review_open starts or reuses the viewer and returns a link to
      the changeset. Viewer: changeset overlay with Apply and Discard, offered
      only where the server's actions allow them, with base drift shown before
      review and before Apply. CLI: dr visualize."
    attributes:
