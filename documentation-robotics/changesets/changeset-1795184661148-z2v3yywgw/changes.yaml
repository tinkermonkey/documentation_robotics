        dr_change_planning skill, shipped in the DR plugin for Claude Code; dr
        claude install still copies them into a project. GitHub Copilot: the
        same skill under integrations/github_copilot, installed by dr copilot
        install and brought up to date by dr upgrade. The loop is Frame, Orient,
        Draft, Pressure-test, Review, Build, Verify, Land, over the MCP tools.
        Build commits only the plan's own changeset directory with the code;
        which changeset is active is no longer a file under changesets/, so
        there is no marker to keep out of the commit (#1218). The as-built
        verification record is made in Verify, after the build commit. The human
        then chooses: discard it (changeset_discard), or keep it, in which case
        it stays staged and its directory is committed beside the plan's in the
        same PR. It is never landed (#1197)."
    source_reference: *a7
