      status: delivered
      documentation: "MCP: review_open (cli/src/mcp/tools/review-open.ts) reuses the
        dr visualize already serving the project or starts one, and returns a
        link that opens the changeset on the graph. CLI: dr visualize. The CLI
        bundles viewer 0.12.0, which follows what the changeset API reports: it
        treats a changeset by its purpose and offers only the server's actions
        (a verification record or an upgrade record shows as a record with
        Discard only), and it shows base drift before review and before Apply.
        GET /health carries cliVersion, the dr CLI serving the API, beside the
        API's own version; the viewer shows it in its status bar. The server
        watches .dr/active-changeset, so the viewer learns of an activation made
        elsewhere. Stopping dr visualize stops its server for certain: the
        launcher signals the server process and sends SIGKILL if it has not
        exited after 3 seconds (cli/src/utils/stop-child-process.ts), and the
        server leaves its file watcher to the process exit instead of closing it
        (#1235)."
    source_reference: *a5
    metadata: *a6
