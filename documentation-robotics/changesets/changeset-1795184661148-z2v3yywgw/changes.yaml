  after:
    id: 0e9afa3e-65d4-4d6e-b661-9df09cd9a9c1
    path: product.feature.changeset-lifecycle
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Changeset lifecycle
    description: "MCP: changeset_create, changeset_activate, changeset_deactivate,
      changeset_update, changeset_list, changeset_show. CLI: dr changeset
      create/activate/deactivate/list/show/status. Which changeset is active is
      per-checkout state, kept in .dr/active-changeset, and it counts only while
      it names a staged changeset."
    attributes:
      priority: critical
      status: delivered
      documentation: "The active changeset is named by one file, .dr/active-changeset
        (the changeset's id), read and written by
        cli/src/core/active-changeset-marker.ts. It is per-checkout state, so it
        sits in .dr/ with the spec reference and the analyzer state, out of git
        (#1218). The older documentation-robotics/changesets/.active is still
        read when .dr/ has no marker, and the next activate or deactivate writes
        .dr/ and deletes it. The marker counts only while it names a staged
        changeset: one that names a changeset committed, discarded or deleted
        since is no active changeset on any surface (Model.load, the CLI, the
        MCP tools, the viewer), and writes then go to the base model. dr
        changeset status says when such a marker is being ignored; dr changeset
        deactivate and changeset_deactivate remove it (the tool reports
        clearedLeftoverMarker)."
    source_reference: *a1
    metadata: *a2
