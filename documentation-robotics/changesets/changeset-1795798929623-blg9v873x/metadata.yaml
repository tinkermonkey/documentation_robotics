id: changeset-1795798929623-blg9v873x
name: adopt-reporting-multi-locations-unreferenced
description: |-
  Fix #1324, #1393, #1353.

  - adopt reports references written (copied vs passed vs already present), keeps `extracted` provenance for as-built copies, and verify honours an add's own `sourceProvenance: extracted`.
  - adopt accepts several references per element in one call.
  - `changeset_brief` sections: ["unreferenced"] lists planned code elements with no source reference, paged, without an as-built changeset.

  **Done when:** the three issues' behaviours are tested and the changelog has an entry.
