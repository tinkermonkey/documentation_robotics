    name: Code-to-model verification
    description: "MCP: codebase_verify. CLI: dr analyzer verify (graph-discovered
      routes vs model endpoints). An element sourced at a whole file is checked
      by its file alone: it is not reported as drift because extraction no
      longer offers the file."
    attributes:
      priority: medium
      status: delivered
      documentation: "MCP: codebase_verify. CLI: dr analyzer verify (graph-discovered
        routes vs model endpoints). An element an existing model sourced at a
        whole file (no symbol, or the file's module name as its symbol) is
        checked by its file alone: it counts as present while the file exists,
        and is not reported as drift or as a candidate delete because extraction
        no longer offers the file."
    source_reference: &a1
      provenance: manual
      locations:
        - file: cli/src/analyzers/verify-engine.ts
    metadata: &a2
      created_at: 2026-11-09T21:54:58.119Z
      updated_at: 2026-11-09T21:54:58.119Z
      version: 1
  after:
    id: 9febeada-0c2e-4dd0-8b31-387b12ded0a1
    path: product.feature.code-to-model-verification
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Code-to-model verification
    description: "MCP: codebase_verify. CLI: dr analyzer verify. Each layer (api,
      data-store, technology, testing) states its status first: checked and in
      step, checked and drifted, or not checked with why and what would make it
      checkable. API operations are compared with served routes and with the
      routes an OpenAPI file declares; recorded rejections are applied and
      reported; every list is a page with its true total."
    attributes:
      priority: medium
      status: delivered
      documentation: "MCP: codebase_verify. CLI: dr analyzer verify. Each layer leads
        with status (in_step, drifted, not_checked) and coverage; a layer that
        compared nothing is never in step. API: served routes, and the routes an
        OpenAPI file declares against operations sourced to it. Testing: test
        functions and methods, and JS/TS it()/test() cases. Technology:
        infrastructure, and system software sourced to a dependency manifest
        against what it lists. Elements that could not be compared are listed by
        reason under not_checked. Recorded codebase_extract rejections leave
        entries out of in_graph_only, listed under ignored, and rejections says
        how many were read and applied. Lists page with limit and offset
        (default 50, lowered near 40 KB); page.totals gives true lengths. An
        element sourced at a whole file is checked by its file alone."
    source_reference: *a1
    metadata: *a2
