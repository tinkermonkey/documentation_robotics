- type: add
  elementId: motivation.requirement.verification-says-what-it-could-not-check
  layerName: motivation
  after:
    id: b78f9db9-77a1-4de5-8bcf-edee2ee5644c
    path: motivation.requirement.verification-says-what-it-could-not-check
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Verification says what it could not check
    description: "codebase_verify and changeset_verify never report an unchecked
      element as in step, drifted or missing. Each layer states one of three
      things: checked and in step, checked and drifted (with what), or not
      checked (with why and what would make it checkable). A list is never cut:
      it is a page with its true total."
    attributes:
      requirementType: functional
      priority: high
      documentation: "Acceptance (issues 1180, 1226, 1159): a layer that compared
        nothing reads not_checked, never in_step; an operation sourced to a file
        the check can't read is not counted as lacking a source reference; a
        planned element extraction can't produce is unverifiable with its
        reason, and a clean match never rests on text evidence alone; recorded
        rejections are reported with how many were read and applied; every list
        gives its true total and the call for the rest."
    metadata:
      created_at: 2026-11-20T18:09:28.129Z
      updated_at: 2026-11-20T18:09:28.129Z
      version: 1
  timestamp: 2026-11-20T18:09:28.190Z
  sequenceNumber: 0
