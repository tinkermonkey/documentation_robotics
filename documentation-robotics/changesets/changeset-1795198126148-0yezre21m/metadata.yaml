id: changeset-1795198126148-0yezre21m
name: honest-verification
description: "codebase_verify and changeset_verify never report \"in step\" or
  \"missing\" for what they could not check (issues 1180, 1226, 1159, CLI 0.7.0
  tranche 8, PR 1268). Each codebase_verify layer states one of: checked and in
  step, checked and drifted (with what), or not checked (with why and what would
  make it checkable), with coverage counts first. The API check reads the
  OpenAPI document extraction reads and honours recorded rejections, reporting
  how many it read and applied; the testing check reads JS/TS test cases;
  technology checks dependency-based system software against its manifest.
  changeset_verify reports a planned service or operation the code may register
  by a name string as unverifiable, never as grounds for a clean match.
  changeset_adopt_source_references takes confirmed {id, sourceFile,
  sourceSymbol} for planned adds extraction can't see. Every list both tools
  return is a page with true totals. Done: PR 1268 merged with this plan landed
  after it."
