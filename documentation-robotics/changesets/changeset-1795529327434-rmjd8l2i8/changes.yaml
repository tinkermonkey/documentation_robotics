- type: add
  elementId: application.applicationfunction.create-commit-progress-reporter
  layerName: application
  after:
    id: d3ee643d-d2bd-43c8-8019-3e10c3ddc9f2
    path: application.applicationfunction.create-commit-progress-reporter
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: createCommitProgressReporter
    description: "Throttles one commit's progress reports (the first, each phase
      change and the final one always; otherwise at most one per interval,
      default 200 ms) and publishes them on the process-wide commit progress
      channel keyed by the checkout's root path; finish() sends the final
      applied == total report, fail() the last one with failed: true."
    source_reference:
      provenance: manual
      locations:
        - file: cli/src/core/commit-progress.ts
          symbol: createCommitProgressReporter
    metadata:
      created_at: 2026-11-24T14:08:57.652Z
