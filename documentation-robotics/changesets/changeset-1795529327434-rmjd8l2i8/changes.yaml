- type: add
  elementId: product.feature.commit-progress
  layerName: product
  after:
    id: 7f92476e-ed85-44a4-acac-542ec029d028
    path: product.feature.commit-progress
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Commit progress
    description: "While a changeset commit runs, the central server tells the
      viewers open on that checkout how far it has got: a
      changeset.commit.progress broadcast with the changes applied so far, the
      total and the phase (validating, applying, saving, reloading, done).
      Throttled; a success always ends with applied == total and phase done, a
      failure with failed: true and the phase it stopped in. Sent for the
      viewer's Apply and for changeset_commit (MCP, DrBot) run in the central
      process; a separate dr changeset commit process sends none. Advisory: the
      commit's own response is unchanged."
    attributes:
      priority: medium
      status: developing
    source_reference:
      provenance: manual
      locations:
        - file: cli/src/core/commit-progress.ts
    metadata:
      created_at: 2026-11-24T14:09:03.141Z
      updated_at: 2026-11-24T14:09:03.141Z
      version: 1
  timestamp: 2026-11-24T14:09:03.160Z
  sequenceNumber: 5
