    name: centralStaleReason
    description: "Why the central process should stop for a restart on the installed CLI, or null (#1427): the CLI changed since it started, and nothing a restart would cut is using it: no browser tab, no DrBot turn, no API request or MCP tool call being answered (requestsInFlight) and no MCP client connected straight to /mcp (directMcpSessions). Sessions of the dr mcp bridge, which marks them, don't hold it: it replays them. Only a process started detached with the default options restarts; any other keeps running and says to restart it by hand."
