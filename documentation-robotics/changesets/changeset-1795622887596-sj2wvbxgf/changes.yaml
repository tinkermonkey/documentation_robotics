- type: add
  elementId: motivation.requirement.a-long-lived-dr-process-never-writes-the-model-with-code-older-than-the-installed-cli
  layerName: motivation
  after:
    id: 9f9b4cd1-6151-4ad5-a8a3-5e9fbaf3e977
    path: motivation.requirement.a-long-lived-dr-process-never-writes-the-model-with-code-older-than-the-installed-cli
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A long-lived DR process never writes the model with code older than the installed CLI
    description: Once the dr CLI installed where a long-lived DR process (the central process) was loaded from changes after the process started (another version, or its files rewritten), the process refuses every write to the base model and says to restart it, so a landing never stamps an old cli_version or writes the old file layout (#1427). A commit is checked once at its start, so a change partway through never half-lands it. Drift already there at start is reported, not refused. A process started detached with the default options restarts itself once nothing a restart would cut is using it; any other keeps running and says to restart it by hand.
    attributes:
      requirementType: non-functional
      priority: high
    metadata:
      created_at: 2026-11-25T16:09:06.759Z
      updated_at: 2026-11-25T16:09:06.759Z
      version: 1
  timestamp: 2026-11-25T17:18:20.779Z
  sequenceNumber: 13
