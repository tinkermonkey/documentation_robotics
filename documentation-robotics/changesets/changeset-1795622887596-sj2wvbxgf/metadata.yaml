        spec_node_id: motivation.requirement
        type: requirement
        layer_id: motivation
        name: A long-lived DR process never writes the model with code older than the installed CLI
        description: Once the dr CLI installed where a long-lived DR process (the central process) was loaded from changes under it (another version, or its files rewritten after it started), the process refuses every write to the base model and says to restart it, so a landing never stamps an old cli_version or writes the old file layout (#1427). It restarts itself when only MCP sessions, which reconnect, are using it.
        attributes:
          requirementType: non-functional
          priority: high
        metadata:
          created_at: 2026-11-25T16:09:06.759Z
          updated_at: 2026-11-25T16:09:06.759Z
          version: 1
      timestamp: 2026-11-25T16:09:06.925Z
