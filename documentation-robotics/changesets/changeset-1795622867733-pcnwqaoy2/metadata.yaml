name: cli09-compact-changeset-reads
description: 'CLI 0.9.0 tranche "Compact changeset reads" (#1250 #1257 #1258 #1281 #1283 #1284 #1294 #1299 #1334 #1373 #1390 #1395): changeset reads are compact by default and page. One approach everywhere: a compact default, layer and type filters, limit/offset paging with true totals and the exact next call (core/paging.ts). changeset_list lists staged changesets by default and counts the rest; changeset_show is one line per change, filtered by layer, type and operation, and paged; changeset_impact lists ids per layer by default; changeset_unstage returns counts and change lines; changeset_brief gains summary/byLayer/reach/changesByType/neighborFiles sections, a types filter, incoming staged links and unchanged elements for ids, drift named once and paged with the answer, and pages that stay near targetBytes even with limit; model_search excludes layers and types, searches descriptions and attributes, ranks name hits first and pages; model_show takes ids.'
