- type: add
  elementId: motivation.requirement.model-reads-fit-one-result-and-agree
  layerName: motivation
  after:
    id: 4c878843-c1f6-413a-81a9-0d310a9c4bb9
    path: motivation.requirement.model-reads-fit-one-result-and-agree
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Model reads fit one result and agree
    description: "A read tool's default answer fits one tool result however large
      the model, puts errors and the few items that matter ahead of bulk
      listings, and two tools asked the same thing about the same view give the
      same answer and say which view it was. A limit is a page size, never a
      cut-off: a longer list is paged with its true total, and every count and
      verdict is of the whole set."
    attributes:
      requirementType: quality
      priority: high
      documentation: "Found by sister projects' agents (issues 1203, 1204, 1214, 1215,
        1216), with the maintainer's rule on limits of 2026-11-20: limits are
        flexible boundaries, paged or pageable, and an answer never portrays
        completeness it does not have. The default of model_validate,
        model_stats, model_list and model_trace does not grow with the model:
        bulk is counted by kind, layer and type, and listed on request a page at
        a time (limit, offset, the true total, nextOffset, and the exact next
        call). Counts, summaries and verdicts are computed over the whole set,
        never the page. model_stats and model_validate report the same validity
        for the same view (the base model, or the active changeset's projection)
        and name the view. A trace answers what an element depends on by the
        predicate's meaning, and reports only the changeset edges it walked.
        Verified by the before and after response sizes on DR's own model in the
        pull request, and by tests that the pages together equal the whole
        list."
    metadata:
      created_at: 2026-11-20T16:31:17.277Z
      updated_at: 2026-11-20T16:31:17.277Z
      version: 1
  timestamp: 2026-11-20T17:02:56.965Z
  sequenceNumber: 0
