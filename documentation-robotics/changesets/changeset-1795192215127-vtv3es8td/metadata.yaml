          listings, and two tools asked the same thing about the same view give
          the same answer and say which view it was.
        attributes:
          requirementType: quality
          priority: high
          documentation: "Found by sister projects' agents (issues 1203, 1204, 1214, 1215,
            1216). The default of model_validate, model_stats, model_list and
            model_trace does not grow with the model: bulk is counted by kind,
            layer and type, and listed on request. model_stats and
            model_validate report the same validity for the same view (the base
            model, or the active changeset's projection) and name the view. A
            trace answers what an element depends on by the predicate's meaning,
            and reports only the changeset edges it walked. Verified by the
            before and after response sizes on DR's own model in the pull
            request."
