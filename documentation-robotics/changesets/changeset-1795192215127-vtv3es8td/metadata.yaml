id: changeset-1795192215127-vtv3es8td
name: dependable-model-reads
description: "The MCP read tools give an agent one right, small answer about a
  model. model_validate returns a summary by default (counts by kind, layer and
  type; a page of errors in full; warnings listed on request) and no longer asks
  motivation, business and product elements for a source reference. model_stats
  validates the same view as model_validate and says which view. model_trace and
  dr trace read which end of a relationship depends on the other from its
  predicate, by one shared rule: an element depends on what serves, realizes,
  satisfies, delivers or supports it, as on what it uses. model_trace reports
  only the changeset edges the trace walked. spec_type answers catalog queries
  across types and shows required enums in a layer listing. model_list can list
  orphans only. A limit is a page size, never a cut-off: lists page with limit
  and offset and give their true total, and counts and verdicts are of the whole
  set. Done: 1203, 1204, 1214, 1215, 1216 closed with tests, and before/after
  response sizes on the repo's own model in the PR."
