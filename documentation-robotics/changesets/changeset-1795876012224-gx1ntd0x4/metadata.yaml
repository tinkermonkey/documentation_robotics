name: cli010-r2-adopt-shared
description: |-
  Adopting source references amends the plan's change entries in place (no renumbering), so branches adopting into one staged plan merge cleanly (#1382). `changeset_verify` offers ready calls that take the built value for each divergence (#1325).

  **In scope:** `amendChangesInPlace`, `amendInPlace`, the adoption functions, and `takeBuilt` on divergent elements and relationships.

  **Done when:** a three-way git merge of two adoptions has no conflict; divergences carry takeBuilt calls; description notes never do.
