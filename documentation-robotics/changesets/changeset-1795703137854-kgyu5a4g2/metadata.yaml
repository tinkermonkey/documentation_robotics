name: cli010-a1-purpose-recorded
description: "#1171 + #1370: add the `recorded` changeset status (landing a plan moves the verification records that verify it to recorded; hidden from changeset_list default, project_status staged work/nextStep, and the viewer API), and have codebase_extract pick the purpose by rule when since is given with no plan active (since == manifest reconciled code commit → reconcile, otherwise verification record naming the plan it verifies or none; explicit purpose overrides). Done = tests for both branches and that a since-scoped verification landing cannot stamp reconciled; lifecycle documented."
