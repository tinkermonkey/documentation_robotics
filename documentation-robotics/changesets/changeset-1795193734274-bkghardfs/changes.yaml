    attributes:
      priority: high
      status: delivered
      documentation: "MCP: codebase_extract. Builds cards from the declarations the
        code index reports (classes, interfaces, functions, methods, routes,
        types), never from a file, stages what the project's rules
        (documentation-robotics/extraction-rules.yaml) and the Tier-0 rules
        decide into a changeset, and returns the rest to the calling agent as
        groups with a decision count, then as cards by filter and page. A since
        run lists the symbols its range changed and counts the others. intent
        sets the changeset's description, and the tool creates the changeset
        under the caller's name with the bootstrap, reconcile or verification
        purpose. Import and test-file relationships are joined to declarations,
        not to a file's element; a symbol with no element of its own passes its
        relationships and test links to the element that owns it (its class,
        else the one element that implements its file). A service's calls stage
        'realizes' from what it calls, a rendered child is composed, and a used
        schema definition is accessed. A reject or decide item that names
        nothing is reported and the others still apply. Every shortened list
        gives its total and the call for the rest. The calling agent is the
        cascade's last tier, and it also models what the code graph reports no
        declaration for (entry points, file-based routes, top-level constants,
        buildable projects); no separate model API key."
    source_reference: *a1
    metadata: *a2
