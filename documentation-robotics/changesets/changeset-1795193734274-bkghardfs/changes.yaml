- type: add
  elementId: motivation.requirement.extraction-decisions-are-made-by-rule-and-kept-with-the-model
  layerName: motivation
  after:
    id: ff8e6b6c-a8b5-495c-83c8-46e0d4323633
    path: motivation.requirement.extraction-decisions-are-made-by-rule-and-kept-with-the-model
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Extraction decisions are made by rule and kept with the model
    description: What extraction should stage or leave out is decided in bulk by a
      stated rule (which code, what it is, why), and the rules a project keeps
      are committed beside its model, so every checkout and every later run
      applies them without asking again.
    attributes:
      requirementType: functional
      priority: high
      documentation: "A decision covers every card a rule names: by files, kind,
        visibility, nesting, name or the type of the owning class's element. A
        rule says an element type or 'not an element', with a reason. Kept rules
        live in documentation-robotics/extraction-rules.yaml and are applied
        before cards are made. Verified when a fresh clone of a project with
        rules is asked only for the cards no rule covers, and each run reports
        what every rule decided."
    metadata:
      created_at: 2026-11-20T16:56:25.745Z
      updated_at: 2026-11-20T16:56:25.745Z
      version: 1
  timestamp: 2026-11-20T16:56:25.802Z
  sequenceNumber: 0
- type: add
  elementId: motivation.requirement.an-extraction-run-says-how-many-decisions-it-needs
  layerName: motivation
  after:
    id: fea3d982-963d-458e-9815-8c16cdaf5dde
    path: motivation.requirement.an-extraction-run-says-how-many-decisions-it-needs
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: An extraction run says how many decisions it needs
    description: A run answers with the cards grouped and counted, and with the
      number of decisions left for the caller, before it lists any card. A since
      run asks only about the symbols its range changed.
    attributes:
      requirementType: functional
      priority: high
      documentation: Groups are by folder and file, kind and visibility, with what the
        model already has there and the folders no element names. preview
        returns the same groups without creating anything. Cards stay reachable
        by filter and page. In a since run, symbols the range did not touch are
        counted and listed on request, and with a plan active the run lists
        planned elements that have no as-built candidate. Verified by the
        decisions, calls and bytes a whole-codebase run and a 20-commit since
        run of this repository need, before and after.
    metadata:
      created_at: 2026-11-20T16:56:25.762Z
      updated_at: 2026-11-20T16:56:25.762Z
      version: 1
  timestamp: 2026-11-20T16:56:25.802Z
  sequenceNumber: 1
- type: add
  elementId: motivation.requirement.a-shortened-or-filtered-extraction-answer-says-what-it-left-out
  layerName: motivation
  after:
    id: 4478fc3c-40e6-42d7-bf63-4a4eb62cfec3
    path: motivation.requirement.a-shortened-or-filtered-extraction-answer-says-what-it-left-out
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A shortened or filtered extraction answer says what it left out
    description: Every count and verdict codebase_extract gives is over the whole
      set. A list shortened to fit, a filter, or a rule that decided cards
      reports its true total and the call that returns the rest, and no answer
      reads as complete while something is hidden.
    attributes:
      requirementType: non-functional
      priority: high
      documentation: "Limits are defaults the caller can change (limit, offset), never
        cut-offs. A shortened list returns total, returned, nextOffset and a
        one-line 'more' naming the next call. A layers, view or since filter
        reports what it left out. Items that failed or did nothing are never
        shortened. Verified by a test per list with more items than its default:
        total is right, the rest is reachable and the pages together equal the
        whole."
    metadata:
      created_at: 2026-11-20T16:56:25.762Z
      updated_at: 2026-11-20T16:56:25.762Z
      version: 1
  timestamp: 2026-11-20T16:56:25.802Z
  sequenceNumber: 2
- type: add
  elementId: product.feature.extraction-triage-by-rule
  layerName: product
  after:
    id: 2c5c136e-48cf-4365-b756-9b1089dd00a1
    path: product.feature.extraction-triage-by-rule
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Extraction triage by rule
    description: "MCP: codebase_extract. A run returns its undecided cards as groups
      with a decision count; decide takes decisions in bulk by a stated rule
      (previewed with a sample), stages or rejects what it covers, and keep:
      true records the rule in documentation-robotics/extraction-rules.yaml for
      every later run and checkout."
    attributes:
      priority: high
      status: delivered
      documentation: "MCP: codebase_extract. Each card carries facts read from the
        code: visibility, whether it is nested in another function, and the
        element its class or file already has. A run with more cards than a page
        answers with groups (folder and file, kind and visibility, folders no
        element names, functions many services share) and the number of
        decisions needed; view filters and pages the cards. decide: [{where |
        card, as: layer.type | none, reason, keep}] decides cards by rule; with
        preview: true it returns each rule's count and a sample and changes
        nothing. Kept rules are applied before cards are made, in this order: an
        element that names the symbol, a decision on that one card, a rule that
        says none, Tier 0, a rule that names a type. A since run lists the
        symbols its range changed and counts the rest; with a plan active it
        lists planned elements with no as-built candidate. reject and decide
        take their items from a JSON file (file) and answer with counts and the
        items that need attention."
    metadata:
      created_at: 2026-11-20T16:56:25.762Z
      updated_at: 2026-11-20T16:56:25.762Z
      version: 1
  timestamp: 2026-11-20T16:56:25.802Z
  sequenceNumber: 3
