id: changeset-1795193734274-bkghardfs
name: extraction-triage-by-rule
description: codebase_extract answers with groups and a count of the decisions
  needed, not a page loop, and takes decisions in bulk by a stated rule that the
  project keeps in the repo. A run then asks an agent for tens of decisions, not
  thousands, and the same rules hold in every checkout. Done when the
  whole-codebase run of this repository and a since run over its last 20 commits
  are measured before and after, and issues 1154, 1177, 1178, 1213, 1181, 1162
  and the reject part of 1182 are closed with tests.
