name: "Element CRUD Operations"
description: "Test add, update, delete operations for elements across layers"
priority: high

pipelines:
  - name: "Add and update motivation goal"
    steps:
      - command: 'add motivation goal test-goal --name ''Test Strategic Goal'' --description ''Test goal for verification'' --attributes ''{"priority":"high"}'''
        files_to_compare:
          - manifest.yaml
          - 01_motivation/goal.yaml
        expect_exit_code: 0
        expect_stdout_contains:
          - "Added"
          - "test-goal"

      - command: "update motivation.goal.test-goal --name 'Updated Strategic Goal'"
        files_to_compare:
          - 01_motivation/goal.yaml
        expect_exit_code: 0
        expect_stdout_contains:
          - "Updated"

      - command: "delete motivation.goal.test-goal --force"
        files_to_compare:
          - 01_motivation/goal.yaml
          - manifest.yaml
        expect_exit_code: 0
        expect_stdout_contains:
          - "Deleted"
          - "test-goal"

  - name: "Add application component lifecycle"
    steps:
      - command: 'add application component test-component --name ''Test Component'' --description ''Test application component'' --attributes ''{"type":"generic"}'''
